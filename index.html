<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 Jensen Huang - Caltech 2024 Commencement Speech | English Learning</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg-primary: #0f0f14;
    --bg-secondary: #1a1a24;
    --bg-card: #22222e;
    --bg-hover: #2a2a38;
    --text-primary: #e8e8ef;
    --text-secondary: #9898a8;
    --text-dim: #68688a;
    --accent: #76b900;
    --accent-glow: rgba(118, 185, 0, 0.3);
    --accent-dim: rgba(118, 185, 0, 0.12);
    --highlight: #fbbf24;
    --highlight-bg: rgba(251, 191, 36, 0.12);
    --border: rgba(255,255,255,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
  }

  /* === Layout === */
  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* === Header === */
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header .logo {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #000;
    flex-shrink: 0;
  }
  .header .title-group h1 {
    font-size: 16px; font-weight: 600; line-height: 1.3;
  }
  .header .title-group p {
    font-size: 12px; color: var(--text-secondary); margin-top: 2px;
  }
  .header .stats {
    margin-left: auto;
    display: flex; gap: 16px; font-size: 12px; color: var(--text-dim);
  }
  .header .stats span { display: flex; align-items: center; gap: 4px; }

  /* === Main Content === */
  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    overflow: hidden;
    min-height: 0;
  }

  /* === Subtitle Panel === */
  .subtitle-panel {
    overflow-y: auto;
    padding: 20px 24px;
    scroll-behavior: smooth;
  }
  .subtitle-panel::-webkit-scrollbar { width: 4px; }
  .subtitle-panel::-webkit-scrollbar-track { background: transparent; }
  .subtitle-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .seg {
    padding: 12px 76px 12px 16px;
    margin-bottom: 4px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    border-left: 3px solid transparent;
    position: relative;
  }
  .seg:hover {
    background: var(--bg-hover);
  }
  .seg.active {
    background: var(--accent-dim);
    border-left-color: var(--accent);
  }
  .seg.active .seg-text {
    color: #fff;
  }
  .seg .seg-time {
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .seg.active .seg-time {
    color: var(--accent);
  }
  .seg .seg-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-secondary);
    transition: color 0.25s;
  }

  /* Vocab highlight in subtitle */
  .vocab-word {
    color: var(--highlight);
    background: var(--highlight-bg);
    padding: 1px 4px;
    border-radius: 4px;
    cursor: help;
    position: relative;
    font-weight: 500;
    transition: all 0.2s;
  }
  .vocab-word:hover {
    background: rgba(251, 191, 36, 0.25);
  }

  /* Tooltip */
  .vocab-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #2d2d3a;
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .vocab-tip .tip-word { color: var(--highlight); font-weight: 600; }
  .vocab-tip .tip-phonetic { color: var(--text-dim); font-size: 11px; margin-left: 6px; }
  .vocab-tip .tip-meaning { color: var(--text-primary); margin-top: 4px; font-family: 'Noto Sans SC', sans-serif; }
  .vocab-word:hover .vocab-tip { display: block; }

  /* === Vocabulary Sidebar === */
  .vocab-sidebar {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .vocab-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .vocab-header .badge {
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .vocab-search {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .vocab-search input {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .vocab-search input:focus {
    border-color: var(--accent);
  }
  .vocab-search input::placeholder {
    color: var(--text-dim);
  }
  .vocab-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 12px;
  }
  .vocab-list::-webkit-scrollbar { width: 4px; }
  .vocab-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .vocab-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    border-bottom: 1px solid var(--border);
  }
  .vocab-item:last-child { border-bottom: none; }
  .vocab-item:hover { background: var(--bg-hover); }
  .vocab-item.active { background: var(--highlight-bg); }
  .vocab-item .vi-word {
    font-size: 14px;
    font-weight: 600;
    color: var(--highlight);
  }
  .vocab-item .vi-phonetic {
    font-size: 11px;
    color: var(--text-dim);
    margin-left: 6px;
  }
  .vocab-item .vi-meaning {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .vocab-item .vi-delete {
    float: right;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    padding: 0 2px;
  }
  .vocab-item:hover .vi-delete { opacity: 0.7; }
  .vocab-item .vi-delete:hover { opacity: 1; color: #f87171; }

  /* Vocab tabs */
  .vocab-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .vocab-tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .vocab-tab:hover { color: var(--text-secondary); }
  .vocab-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .vocab-tab .tab-badge {
    font-size: 11px;
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .vocab-tab.active .tab-badge {
    background: var(--accent-dim);
    color: var(--accent);
  }

  /* Notebook actions bar */
  .notebook-actions {
    display: none;
    padding: 8px 12px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .notebook-actions.show { display: flex; }
  .nb-action-btn {
    flex: 1;
    padding: 6px 0;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .nb-action-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .nb-action-btn.danger:hover {
    border-color: #f87171;
    color: #f87171;
  }

  /* === Player Bar === */
  .player-bar {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-row .time-label {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    min-width: 48px;
    text-align: center;
  }
  .progress-bar-container {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    transition: height 0.15s;
  }
  .progress-bar-container:hover { height: 10px; }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    position: relative;
    transition: width 0.1s linear;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .progress-bar-container:hover .progress-bar-fill::after {
    opacity: 1;
  }
  .controls-row {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    font-size: 18px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
  }
  .btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .btn-play {
    background: var(--accent);
    color: #000;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 20px;
  }
  .btn-play:hover { background: #8ad400; color: #000; transform: scale(1.05); }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
  }
  .speed-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .speed-btn:hover, .speed-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
  }
  .volume-slider {
    -webkit-appearance: none;
    width: 80px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }

  /* === Responsive === */
  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
    .vocab-sidebar { display: none; }
  }

  /* === Toggle sidebar for mobile === */
  .vocab-toggle {
    display: none;
    position: fixed;
    bottom: 100px;
    right: 16px;
    width: 48px;
    height: 48px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow);
    z-index: 50;
  }
  @media (max-width: 900px) {
    .vocab-toggle { display: flex; align-items: center; justify-content: center; }
    .vocab-sidebar.show {
      display: flex;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 320px;
      background: var(--bg-secondary);
      z-index: 100;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
  }

  /* Loading overlay */
  .loading {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  .loading.hidden { display: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Auto-scroll toggle */
  .autoscroll-toggle {
    position: absolute;
    top: 12px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    z-index: 10;
  }
  .autoscroll-toggle input { accent-color: var(--accent); }

  .subtitle-wrapper {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* Loop mode indicator */
  .loop-indicator {
    font-size: 11px;
    color: var(--accent);
    margin-left: 8px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .loop-indicator.active { opacity: 1; }

  /* Sentence action buttons */
  .seg-actions {
    position: absolute;
    right: 8px;
    top: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .seg-action {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .seg:hover .seg-action,
  .seg:focus-within .seg-action {
    opacity: 0.6;
  }
  .seg-action:hover { opacity: 1 !important; color: var(--accent); background: rgba(255,255,255,0.06); }
  .seg-action:disabled {
    cursor: wait;
    opacity: 0.7;
  }
  .seg-translation {
    margin-top: 8px;
    padding-left: 10px;
    border-left: 2px solid var(--accent);
    color: var(--text-primary);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    line-height: 1.65;
  }
  .seg-translation[hidden] { display: none; }
  .seg-translation.is-loading,
  .seg-translation.is-error {
    color: var(--text-dim);
  }

  /* === Click-to-lookup popup === */
  .word-clickable {
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, color 0.15s;
  }
  .word-clickable:hover {
    background: rgba(255,255,255,0.08);
  }
  .word-clickable.looked-up {
    color: #60a5fa;
    text-decoration-color: rgba(96,165,250,0.3);
  }

  #wordPopup {
    display: none;
    position: fixed;
    z-index: 200;
    background: #1e1e2e;
    border: 1px solid rgba(118,185,0,0.4);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 280px;
    max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    font-size: 14px;
    animation: popIn 0.15s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  #wordPopup.show { display: block; }
  #wordPopup .popup-close {
    position: absolute;
    top: 8px; right: 12px;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }
  #wordPopup .popup-close:hover { color: #fff; }
  #wordPopup .popup-word {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  #wordPopup .popup-phonetic {
    font-size: 14px;
    color: var(--accent);
    margin-left: 8px;
    font-weight: 400;
  }
  #wordPopup .popup-speak {
    background: none; border: none;
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    margin-left: 6px;
    vertical-align: middle;
  }
  #wordPopup .popup-speak:hover { color: #8ad400; }
  #wordPopup .popup-divider {
    height: 1px;
    background: var(--border);
    margin: 10px 0;
  }
  #wordPopup .popup-meaning {
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--highlight);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
  }
  #wordPopup .popup-en-def {
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.6;
    margin-top: 6px;
  }
  #wordPopup .popup-en-def .def-pos {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
    margin-right: 4px;
  }
  #wordPopup .popup-loading {
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #wordPopup .popup-loading .mini-spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  #wordPopup .popup-source {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
  }
  #wordPopup .popup-source.is-vocab {
    color: var(--highlight);
  }
  #wordPopup .popup-add-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: none;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
  }
  #wordPopup .popup-add-btn:hover {
    background: var(--accent);
    color: #000;
  }
  #wordPopup .popup-add-btn.added {
    border-color: var(--text-dim);
    color: var(--text-dim);
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div style="color: var(--text-dim); font-size: 14px;">Loading audio...</div>
</div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">E</div>
    <div class="title-group">
      <h1>Jensen Huang — Caltech Commencement 2024</h1>
      <p>🎓 English Learning · Scroll Subtitles with Vocabulary</p>
    </div>
    <div class="stats">
      <span>📖 <span id="vocabCount">0</span> words</span>
      <span>⏱ <span id="durationStat">--:--</span></span>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="subtitle-wrapper">
      <label class="autoscroll-toggle">
        <input type="checkbox" id="autoScroll" checked> Auto-scroll
        <span class="loop-indicator" id="loopIndicator">🔁 Loop</span>
      </label>
      <div class="subtitle-panel" id="subtitlePanel"></div>
    </div>
    <div class="vocab-sidebar" id="vocabSidebar">
      <div class="vocab-header">
        📚 Vocabulary <span class="badge" id="vocabBadge">0</span>
      </div>
      <div class="vocab-tabs">
        <button class="vocab-tab active" data-tab="course" id="tabCourse">📖 课文词汇 <span class="tab-badge" id="courseCount">0</span></button>
        <button class="vocab-tab" data-tab="notebook" id="tabNotebook">⭐ 我的单词本 <span class="tab-badge" id="notebookCount">0</span></button>
      </div>
      <div class="vocab-search">
        <input type="text" id="vocabSearchInput" placeholder="Search words...">
      </div>
      <div class="notebook-actions" id="notebookActions">
        <button class="nb-action-btn" id="nbExport">📤 导出</button>
        <button class="nb-action-btn" id="nbImport">📥 导入</button>
        <button class="nb-action-btn danger" id="nbClear">🗑 清空</button>
      </div>
      <div class="vocab-list" id="vocabList"></div>
      <input type="file" id="nbImportFile" accept=".json" style="display:none">
    </div>
  </div>

  <!-- Player -->
  <div class="player-bar">
    <div class="progress-row">
      <span class="time-label" id="currentTime">0:00</span>
      <div class="progress-bar-container" id="progressBar">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <span class="time-label" id="totalTime">0:00</span>

<script>
// === Data ===
const SEGMENTS = [{"start": 8.26, "end": 11.26, "text": "It really makes me cringe listening to all that."}, {"start": 13.2, "end": 23.1, "text": "Thank you for that kind introduction, but I hate hearing about myself and just as a"}, {"start": 23.1, "end": 28.8, "text": "show, maybe you could just applaud, how many of you know who NVIDIA is?"}, {"start": 33.6, "end": 36.76, "text": "And how many of you know what a GPU is?"}, {"start": 42.2, "end": 44.04, "text": "Okay, good, I don't have to change my speech."}, {"start": 46.98, "end": 53.32, "text": "Ladies and gentlemen, President Rosenbaum, esteemed faculty members, distinguished guests,"}, {"start": 54.14, "end": 60.88, "text": "proud parents, and above all, the 2024 graduating class of Caltech."}, {"start": 68.14, "end": 69.98, "text": "This is a really happy day for you guys."}, {"start": 70.18, "end": 71.2, "text": "You have to look more excited."}, {"start": 71.38, "end": 73.44, "text": "You know you're graduating from Caltech."}, {"start": 74.54, "end": 83.74, "text": "This is the school of the great Richard Feynman, Linus Pauling, and someone who is very"}, {"start": 83.74, "end": 86.36, "text": "influential to me in our industry, Carver Mead."}, {"start": 87.08, "end": 88.5, "text": "Yeah, this is a very big deal."}, {"start": 92.96, "end": 95.74, "text": "Today is a day of immense pride and joy."}, {"start": 96.02, "end": 102.78, "text": "It is a dream come true for all of you, but not just for you, because your parents and"}, {"start": 102.78, "end": 107.36, "text": "families have made countless sacrifices to see you reach this milestone."}, {"start": 108.2, "end": 114.92, "text": "So let us take this moment and congratulate them, thank them, and let them know you love"}, {"start": 114.92, "end": 115.1, "text": "them."}, {"start": 124.54, "end": 129.48, "text": "You don't want to forget that because you don't know how long you're going to be living"}, {"start": 129.48, "end": 129.88, "text": "at home."}, {"start": 134.16, "end": 136.14, "text": "You want to be super grateful today."}, {"start": 140.0, "end": 145.94, "text": "As a prop parent, I really loved that when my parents, my kids didn't move out, and it was"}, {"start": 145.94, "end": 149.08, "text": "great to see them every day, but now they've moved out and mixed me sad."}, {"start": 149.44, "end": 151.64, "text": "So hopefully you guys get to spend some time with your parents."}, {"start": 152.16, "end": 157.88, "text": "Your journey here is a testament of your character, your determination, willingness to make"}, {"start": 157.88, "end": 160.86, "text": "sacrifices for your dreams and you should be proud."}, {"start": 161.62, "end": 168.64, "text": "The ability to make sacrifices and do or pain and suffering, you will need these qualities"}, {"start": 168.64, "end": 169.1, "text": "in life."}, {"start": 171.94, "end": 174.3, "text": "You and I share some things in common."}, {"start": 174.3, "end": 181.3, "text": "First, both chief scientists of NVIDIA were from Caltech."}, {"start": 187.78, "end": 193.9, "text": "And one of the reasons why I'm giving the speech today is because I'm recruiting."}, {"start": 195.74, "end": 199.32, "text": "And so I want to tell you that NVIDIA is a really great company."}, {"start": 200.82, "end": 202.64, "text": "I'm a very nice boss."}, {"start": 205.52, "end": 205.94, "text": "Universally loved."}, {"start": 206.88, "end": 208.36, "text": "Come work at NVIDIA."}, {"start": 210.52, "end": 213.48, "text": "You and I share a passion for science and engineering."}, {"start": 214.44, "end": 225.6, "text": "And although we're separated by about 40 years, we are both at the peaks of our career."}, {"start": 227.28, "end": 231.54, "text": "For all of you who have been paying attention to NVIDIA myself, you know what I mean?"}, {"start": 232.92, "end": 238.22, "text": "It's just that in your case, you'll have many, many more peaks to go."}, {"start": 239.14, "end": 244.38, "text": "I just hope that today is not my peak, not the peak."}, {"start": 245.44, "end": 250.62, "text": "And so I'm working as hard as ever to make sure that I have many more peaks ahead."}, {"start": 251.26, "end": 256.06, "text": "Last year, I was honored to give the commencement address at Taiwan University."}, {"start": 256.88, "end": 261.4, "text": "And I shared several stories by NVIDIA's journey and the lessons that we learned that"}, {"start": 261.4, "end": 262.68, "text": "might be valuable for graduates."}, {"start": 264.3, "end": 272.06, "text": "I have to admit that I don't love giving advice, especially to other people's children."}, {"start": 274.54, "end": 286.68, "text": "And so my advice today will largely be disguised in some stories that I've enjoyed."}, {"start": 287.56, "end": 290.96, "text": "And some life experiences that I've enjoyed."}, {"start": 292.12, "end": 294.9, "text": "I'm the longest running tech CEO in the world today, I believe."}, {"start": 298.8, "end": 308.28, "text": "And over the course of 31 years, I managed not to go out of business, and I get bored, and I get fired."}, {"start": 309.84, "end": 317.94, "text": "And so I have the great privilege of enjoying a lot of life's experiences on starting from creating"}, {"start": 317.94, "end": 321.18, "text": "NVIDIA, from nothing to what it is today."}, {"start": 322.14, "end": 326.2, "text": "And so I spoke about the long road of creating CUDA, a programming model."}, {"start": 326.46, "end": 332.96, "text": "The programming model that we dedicated over 20 years to invent, and that is revolutionizing"}, {"start": 332.96, "end": 341.44, "text": "computing today. I spoke about a very quite public-canceled SEGA game console project we worked on."}, {"start": 342.48, "end": 344.02, "text": "And we're intellectual honesty."}, {"start": 345.3, "end": 349.9, "text": "Something that I know Richard Feynman cares very deeply about and spoke quite often about."}, {"start": 350.7, "end": 359.68, "text": "We're intellectual honesty and humility saved our company and how a strategic retreat was one of"}, {"start": 359.68, "end": 369.28, "text": "our best strategies. All of these are counterintuitive lessons that I spoke about at the commencement."}, {"start": 370.52, "end": 378.06, "text": "But I encouraged the graduates to engage with AI, the most consequential technology of our time."}, {"start": 378.54, "end": 383.8, "text": "And I'll speak a little bit more about that later, but all of you know about AI."}, {"start": 384.16, "end": 389.08, "text": "It's hard not to be immersed in it and surrounded by it and a great deal of discussion about it."}, {"start": 389.66, "end": 395.7, "text": "And of course, I hope that all of you are using it and playing with it, with surprising results,"}, {"start": 396.26, "end": 403.0, "text": "and some magical, some disappointing and some surprising. But you have to enjoy it, you have to engage"}, {"start": 403.0, "end": 409.84, "text": "it because it's advancing so quickly. It is the only technology that I've known that is advancing"}, {"start": 409.84, "end": 414.84, "text": "on multiple exponentials at the same time. And so the technology is changing very, very quickly."}, {"start": 415.78, "end": 425.66, "text": "So I advise the students at the Taiwan University to run, don't walk and engage the AI"}, {"start": 426.28, "end": 430.96, "text": "revolution. And yet one year later, it's incredible how much has changed."}, {"start": 431.54, "end": 439.02, "text": "And so today, what I wanted to do is share with you my perspective, my, from my vantage point,"}, {"start": 439.6, "end": 443.14, "text": "of some of the important things that are happening that you're graduating into."}, {"start": 444.3, "end": 450.78, "text": "And these are extraordinary things that are happening that you should have an intuitive understanding for"}, {"start": 451.52, "end": 458.34, "text": "because it's going to matter to you. It's going to matter to the industry. And hopefully, you take"}, {"start": 458.34, "end": 463.16, "text": "advantage of the opportunity ahead of you. The computer industry is transforming from its"}, {"start": 463.16, "end": 469.98, "text": "foundations, literally from studs. Everything is changing from studs on up. And across every layer"}, {"start": 469.98, "end": 476.44, "text": "and soon, every industry will also be transformed. And the reason for that is quite obvious because"}, {"start": 476.44, "end": 481.86, "text": "computers today are the single most important instrument of knowledge. And it's foundational to"}, {"start": 481.86, "end": 486.8, "text": "every single industry and every field of science. If we are transforming the computer,"}, {"start": 487.54, "end": 493.38, "text": "so profoundly, it will, of course, have implications in every industry. And I'll talk about that in"}, {"start": 493.38, "end": 496.88, "text": "just a little bit. And as you enter industry, it's important you know what's happening."}, {"start": 498.86, "end": 506.68, "text": "Modern computing traces back to the IBM System 360. That was the architecture manual that I learned"}, {"start": 506.68, "end": 511.94, "text": "from. It's an architecture manual that you don't need to learn from. A lot has, a lot better"}, {"start": 511.94, "end": 516.3, "text": "better documentation and better descriptions of computers and architectures has been"}, {"start": 517.06, "end": 524.84, "text": "presented since. But the System 360 was incredibly important at its time. And in fact,"}, {"start": 525.42, "end": 535.56, "text": "the basic ideas of the System 360, the architecture of it, the principal ideas and architecture"}, {"start": 535.56, "end": 540.98, "text": "and strategy of the System 360 are still governing the computer industry today. And it was"}, {"start": 540.98, "end": 551.24, "text": "introduced a year after my birth. In the 80s, I was among the first generation of VLSI engineers"}, {"start": 551.86, "end": 559.16, "text": "who learned to design chips from meat and conways, landmark textbook. And I'm not sure if it's"}, {"start": 559.16, "end": 563.9, "text": "still being taught here, it should be in the introduction of VLSI systems. Based on cover"}, {"start": 563.9, "end": 570.72, "text": "meats, pioneering work here at Caltech on chip design methodologies and textbook that revolutionized"}, {"start": 570.72, "end": 577.98, "text": "IC design. And it enabled our generation to design super giant chips and ultimately the CPU."}, {"start": 579.02, "end": 587.88, "text": "The CPU led to exponential growth in computing. The performance, the incredible technology advances"}, {"start": 587.88, "end": 594.32, "text": "that's called Moore's Law, fueled the information technology revolution. The industrial revolution"}, {"start": 594.92, "end": 601.0, "text": "that we are part of, that my generation was part of, saw the mass production of something"}, {"start": 601.0, "end": 605.9, "text": "the world had never seen before. The mass production of something that was invisible,"}, {"start": 606.56, "end": 612.3, "text": "easy to copy, the mass production of software. And it led to a $3 trillion industry."}, {"start": 613.6, "end": 622.32, "text": "When I sat where you sat, the IT industry was miniscule. And the concept that you could make money"}, {"start": 622.32, "end": 628.74, "text": "selling software was a fantasy. And yet today, it's one of the most important commodities,"}, {"start": 629.14, "end": 635.26, "text": "most important technologies and product creations that our industry produces."}, {"start": 636.22, "end": 644.22, "text": "However, the limits of the large scaling of transistor scaling and instruction level parallelism"}, {"start": 644.22, "end": 651.46, "text": "have slowed CPU performance. And the slowed CPU performance gains is happening at a time when"}, {"start": 651.46, "end": 660.78, "text": "computing demand continues to grow exponentially. This exponentially growing gap between demand"}, {"start": 660.78, "end": 670.16, "text": "of computing and the capabilities of computers, if not addressed, computing energy consumption and"}, {"start": 670.16, "end": 678.56, "text": "cost inflation with eventually stifled living industry. We see very clear signs of computing"}, {"start": 678.56, "end": 686.38, "text": "inflation as we speak. And after two decades of advancing NVIDIA's CUDA and NVIDIA's accelerated"}, {"start": 686.38, "end": 692.58, "text": "computing offers a path forward. That's the reason why I'm here. Because finally the industry realized"}, {"start": 693.34, "end": 698.12, "text": "of the incredibly incredible effectiveness of accelerated computing at precisely the time"}, {"start": 698.12, "end": 708.1, "text": "that we're witnessing computing inflation after several decades. By offloading time-consuming algorithms"}, {"start": 708.1, "end": 718.5, "text": "to a GPU that specializes in parallel processing, we routinely achieve 10, 100, sometimes a thousand"}, {"start": 718.5, "end": 726.04, "text": "fold speed-ups saving money, cost, and energy. We now accelerate application domains from computer"}, {"start": 726.04, "end": 733.28, "text": "graphics, ray tracing, of course, to gene sequencing, scientific computing, astronomy, quantum circuit"}, {"start": 733.28, "end": 739.4, "text": "simulations, SQL data processing, and even pandas, data science. Accelerated computing has"}, {"start": 739.4, "end": 746.88, "text": "reached a tipping point. That is our first great contribution to the computer industry, our first"}, {"start": 746.88, "end": 754.16, "text": "great contribution to society, accelerated computing. And now gives us a path forward for sustainable"}, {"start": 754.16, "end": 762.04, "text": "computing where cost will continue to decline as computing requirement continues to grow. A hundred"}, {"start": 762.04, "end": 770.88, "text": "fold, a hundred fold of anything in time or cost or energy savings that accelerated computing"}, {"start": 770.88, "end": 778.26, "text": "opened surely would trigger a new development somewhere else. We just didn't know what it was"}, {"start": 779.24, "end": 792.02, "text": "until deep learning came to our consciousness. A whole new world of computing emerged. Jeff"}, {"start": 792.02, "end": 799.9, "text": "could have GPUs to train AlexNet and shocked the computer vision community by winning the 2012"}, {"start": 799.9, "end": 807.58, "text": "ImageNet challenge. This was the big moment, the big bang of deep learning, a pivotal moment in"}, {"start": 809.3, "end": 817.76, "text": "the mark the beginning of the AI revolution. Our decisions after AlexNet transformed our company"}, {"start": 818.4, "end": 823.74, "text": "is something that's worth taking note of. Our decisions after AlexNet transformed our company"}, {"start": 823.74, "end": 832.62, "text": "and likely everything else. We saw the potential of deep learning and believed, just believed through"}, {"start": 833.44, "end": 839.88, "text": "principle thinking, believed through our own analysis of the scalability of deep learning,"}, {"start": 839.94, "end": 845.12, "text": "we believe the approach could learn other valuable functions that maybe deep learning is a universal"}, {"start": 845.12, "end": 852.32, "text": "function learner. And how many problems are difficult or impossible to express using fundamental"}, {"start": 852.32, "end": 859.34, "text": "first principles? And so when we saw this, when we saw this, we thought this is a technology we"}, {"start": 859.34, "end": 867.98, "text": "really have to pay attention to because its limits are potentially only limited by model and data"}, {"start": 867.98, "end": 876.12, "text": "scale. However, there were challenges at the time. This is 2012. Shortly after 2012, how could we"}, {"start": 876.12, "end": 882.5, "text": "explore the limits of deep learning without having to build these massive GPU clusters at the time"}, {"start": 882.5, "end": 887.64, "text": "where a rather small company building these massive GPU clusters could cost hundreds and hundreds"}, {"start": 887.64, "end": 894.88, "text": "of millions of dollars? And if we didn't though, there was no assurance that it would be effective"}, {"start": 894.88, "end": 901.64, "text": "if we scaled, however, no one knew how far deep learning could scale and if we didn't build it"}, {"start": 902.16, "end": 909.06, "text": "who we never know. This is one of those, if you build it, well, they come. Our logic is if we don't"}, {"start": 909.06, "end": 914.52, "text": "build it, they can't come. And so we dedicated ourselves based on our first principle beliefs"}, {"start": 915.2, "end": 920.34, "text": "and our analysis. And we got ourselves to the point where we believe this was going to be so"}, {"start": 920.34, "end": 925.6, "text": "effective and when the company believes something, we should go act on it. So we dove deep into"}, {"start": 925.6, "end": 932.9, "text": "deep learning and over the next decade systematically reinvented everything. We reinvented every computing"}, {"start": 932.9, "end": 939.54, "text": "layer starting with the GPU itself. The invention of the modern GPU, which is very different than"}, {"start": 939.54, "end": 947.36, "text": "the GPU of the past that we invented in the first place. And we went on to invent just about every"}, {"start": 947.36, "end": 952.66, "text": "other aspect of computing, the interconnects, the systems, the networking and of course software."}, {"start": 953.82, "end": 961.22, "text": "We invested billions. We invested billions into the unknown. Thousands of engineers for a decade"}, {"start": 961.22, "end": 969.34, "text": "worked on deep learning and advancing and scaling deep learning without really knowing how far we"}, {"start": 969.34, "end": 974.82, "text": "could really take the technology. We invested billions and we designed and built supercomputers"}, {"start": 974.82, "end": 984.84, "text": "to explore the limits of learning of deep learning and AI. Then in 2016, we announced DGX1, our first"}, {"start": 984.84, "end": 993.18, "text": "AI supercomputer and I delivered the first one to a startup in San Francisco. A startup nobody knew"}, {"start": 993.18, "end": 1000.8, "text": "anything about, a group of friends of mine who were working on artificial intelligence, a company"}, {"start": 1000.8, "end": 1012.9, "text": "called OpenAI. In 2022, 10 years after Alex met and about a million fold increase in computing"}, {"start": 1012.9, "end": 1019.2, "text": "later, a million fold, if you could just imagine what would it be like if your laptop was a million"}, {"start": 1019.2, "end": 1027.28, "text": "fold more capable, a million fold later OpenAI launched chat GPT and AI went mainstream."}, {"start": 1028.24, "end": 1034.04, "text": "During this decade, NVIDIA transformed ourselves from a graphics company that many of you probably"}, {"start": 1034.04, "end": 1042.82, "text": "first knew us as, that builds GPUs to now an AI company that builds massive data center scale"}, {"start": 1042.82, "end": 1049.76, "text": "supercomputers. We transformed our company completely. We also transformed computing completely."}, {"start": 1050.34, "end": 1056.8, "text": "The fundamental way of doing computing today has been radically changed. The computing stack now"}, {"start": 1056.8, "end": 1067.3, "text": "uses GPU to process large language models that are trained on supercomputers rather than CPUs that"}, {"start": 1067.3, "end": 1074.64, "text": "are processing instructions written by programmers. We are now creating software that no humans can"}, {"start": 1074.64, "end": 1080.82, "text": "write. We are now creating software that does things that no humans can imagine even just 10 years"}, {"start": 1080.82, "end": 1090.06, "text": "ago. Computers are now intention driven rather than instruction driven. Tell a computer what you"}, {"start": 1090.06, "end": 1099.22, "text": "want and it will figure it out. It will figure out how. Like humans, AI applications will understand"}, {"start": 1099.22, "end": 1107.08, "text": "the mission, reason, plan, and orchestrate a team of large language models to perform tasks."}, {"start": 1108.1, "end": 1113.46, "text": "Future applications will do and perform very similar to the way we do things."}, {"start": 1114.0, "end": 1122.34, "text": "Assemble teams of experts, use tools, reason and plan, and execute our mission. Software and"}, {"start": 1122.34, "end": 1130.06, "text": "what software can do has been completely changed. Even our industry, as it's being changed and"}, {"start": 1130.06, "end": 1135.44, "text": "transformed, created yet another industry and industry the world has never seen before."}, {"start": 1136.54, "end": 1146.8, "text": "An industry is forming right in front of our eyes. AI's input and output are tokens for all the"}, {"start": 1146.8, "end": 1152.98, "text": "engineers in the room you know what I mean. These are floating point numbers that embed intelligence."}, {"start": 1154.24, "end": 1159.92, "text": "Companies are now building a new type, a new type of data center that didn't exist before that"}, {"start": 1159.92, "end": 1171.7, "text": "specialized in producing intelligence tokens. Essentially AI factories. Like AC generators"}, {"start": 1172.66, "end": 1182.62, "text": "that Nikola Tesla invented of the past industrial revolution, we now have AI token generators."}, {"start": 1183.42, "end": 1189.5, "text": "And they will be the factories of a new industrial revolution. There's large industries producing"}, {"start": 1189.5, "end": 1194.92, "text": "energy, electricity. We now have a large industry producing something invisible called software."}, {"start": 1195.72, "end": 1202.86, "text": "In the future, in the very near future, we'll have industries that are producing manufacturing"}, {"start": 1203.56, "end": 1212.76, "text": "intelligence tokens, AI generators. A new computing model has emerged and a new industry has emerged"}, {"start": 1213.56, "end": 1220.34, "text": "all because we reasoned from first principles formed our belief about the future and we acted on them."}, {"start": 1222.28, "end": 1232.88, "text": "The next wave of AI is robotics, where AI in addition to a language model also has a physical"}, {"start": 1233.54, "end": 1239.04, "text": "world model. We work with hundreds of companies building robots, robotic vehicles,"}, {"start": 1239.6, "end": 1245.18, "text": "picking place arms, humanoid robots, and even entire gigantic warehouses that are robotic."}, {"start": 1246.16, "end": 1253.34, "text": "But unlike our AI factory strategy and our experience there, which was really formed through"}, {"start": 1253.34, "end": 1259.44, "text": "reasoning and deliberate action, our robotics journey resulted from a series of setbacks."}, {"start": 1261.32, "end": 1265.92, "text": "As you know, I'm video invented the GPU. This was before we invented AI factories."}, {"start": 1267.02, "end": 1271.96, "text": "Our first great contribution to the computer industry was re-inventing"}, {"start": 1272.6, "end": 1278.1, "text": "computer graphics through programmable shaders. We invented the GPU and programmable shading in 2000."}, {"start": 1279.14, "end": 1284.76, "text": "We wanted to integrate GPUs into every computer and so we started to combine our GPUs"}, {"start": 1284.76, "end": 1293.02, "text": "with motherboard chips and we launched a fabulous integrated graphics chip at the time for AMD CPUs."}, {"start": 1294.0, "end": 1300.42, "text": "Our chipset business was an instant success. I think it went from zero to a billion dollars"}, {"start": 1300.42, "end": 1306.6, "text": "practically overnight. But then all of a sudden AMD wanted to control all of the technology in the"}, {"start": 1306.6, "end": 1315.48, "text": "PC and we wanted to stay independent so they purchased ATI and no longer needed us. We turned to"}, {"start": 1315.48, "end": 1328.58, "text": "Intel. That probably wasn't a great idea but we turned to Intel and negotiated a license to"}, {"start": 1328.58, "end": 1338.08, "text": "connect to Intel CPUs. Apple was excited about what we were building and asked us to work on a"}, {"start": 1338.08, "end": 1346.14, "text": "new computer with them which became the first MacBook Air. While Intel saw what happened and decided"}, {"start": 1346.66, "end": 1351.22, "text": "they didn't want us to do that anymore and so they terminated our agreement."}, {"start": 1353.24, "end": 1362.98, "text": "Well we pivoted again and this time we went in licensed ARM and we built a low power SOC, a mobile SOC."}, {"start": 1363.68, "end": 1370.46, "text": "The world's first SOC that was essentially a computer, a full operating computer and it was"}, {"start": 1370.46, "end": 1378.86, "text": "incredible. Our chip excited Google and they asked us to work on a new device which turned out"}, {"start": 1378.86, "end": 1387.88, "text": "to have been the Android mobile device. Well Qualcomm decided they didn't want us to do that and so"}, {"start": 1387.88, "end": 1392.34, "text": "they didn't want us to connect to their modems and it's hard to build a mobile device without"}, {"start": 1392.34, "end": 1398.84, "text": "being connected to a modem and there were no other LTE modem companies so we had to exit the mobile"}, {"start": 1398.84, "end": 1408.08, "text": "device market. Well this happened practically on a year rhythm and we would build something,"}, {"start": 1408.6, "end": 1413.94, "text": "it would be incredibly successful, generate enormous amounts of excitement and then one year later"}, {"start": 1414.52, "end": 1419.1, "text": "we were kicked out of those markets. Well with no more markets to turn to"}, {"start": 1420.48, "end": 1426.36, "text": "we decided to build something where we are sure there // === Helpers ===
function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function decodeHtmlEntities(t) {
  const textarea = document.createElement('textarea');
  textarea.innerHTML = t;
  return textarea.value;
}

function highlightVocab(text) {
  let result = escapeHtml(text);
  // Split into words and non-words, wrap each word in a clickable span
  result = result.replace(/([a-zA-Z'-]+)/g, (match) => {
    const lower = match.toLowerCase().replace(/^['-]+|['-]+$/g, '');
    const isVocab = VOCAB[lower];
    if (isVocab) {
      return `<span class="vocab-word word-clickable" data-word="${lower}">${match}</span>`;
    }
    return `<span class="word-clickable" data-word="${lower}">${match}</span>`;
  });
  return result;
}

function positionPopup(targetEl) {
  const rect = targetEl.getBoundingClientRect();
  const pw = 320;
  let left = rect.left + rect.width / 2 - pw / 2;
  let top = rect.bottom + 8;

  // Keep within viewport
  if (left < 8) left = 8;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (top + 200 > window.innerHeight) top = rect.top - 8 - 200;
  if (top < 8) top = 8;

  wordPopup.style.left = left + 'px';
  wordPopup.style.top = top + 'px';
}

function showPopup(word, targetEl) {
  const lower = word.toLowerCase().replace(/^['-]+|['-]+$/g, '');
  if (!lower || lower.length < 2) return;

  popupWord.textContent = lower;
  popupPhonetic.textContent = '';
  popupMeaning.textContent = '';
  popupEnDef.innerHTML = '';
  popupSource.textContent = '';

  positionPopup(targetEl);
  wordPopup.classList.add('show');

  // Reset add button
  if (isInNotebook(lower)) {
    popupAddBtn.textContent = '✅ 已加入';
    popupAddBtn.classList.add('added');
  } else {
    popupAddBtn.textContent = '⭐ 加入单词本';
    popupAddBtn.classList.remove('added');
  }

  // Check VOCAB first
  if (VOCAB[lower]) {
    const info = VOCAB[lower];
    popupPhonetic.textContent = info.phonetic || '';
    popupMeaning.textContent = info.meaning;
    popupSource.textContent = '📖 课文重点词汇';
    popupSource.className = 'popup-source is-vocab';
    fetchEnglishDef(lower, true);
    return;
  }

  // Check cache
  if (lookupCache[lower]) {
    renderLookupResult(lookupCache[lower]);
    return;
  }

  // Show loading
  popupMeaning.innerHTML = '<div class="popup-loading"><div class="mini-spinner"></div>正在查询...</div>';
  popupSource.textContent = '';

  // Fetch from Free Dictionary API + translation
  fetchWordInfo(lower);
}

async function fetchEnglishDef(word, isVocab) {
  try {
    const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data[0]) return;

    // If vocab word didn't have phonetic, fill from API
    if (isVocab && !popupPhonetic.textContent && data[0].phonetic) {
      popupPhonetic.textContent = data[0].phonetic;
    }

    // Add English definitions
    const meanings = data[0].meanings || [];
    let defHtml = '';
    for (const m of meanings.slice(0, 3)) {
      const pos = m.partOfSpeech;
      const defs = m.definitions.slice(0, 2);
      for (const d of defs) {
        defHtml += `<div><span class="def-pos">${pos}</span>${escapeHtml(d.definition)}</div>`;
      }
    }
    if (defHtml) popupEnDef.innerHTML = defHtml;
  } catch (e) { /* ignore */ }
}

async function fetchWordInfo(word) {
  const result = { word, phonetic: '', meaning: '', enDefs: [] };

  // Parallel: dictionary API + translation API
  const [dictResult, transResult] = await Promise.allSettled([
    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r => r.ok ? r.json() : null),
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${encodeURIComponent('en|zh')}`).then(r => r.ok ? r.json() : null)
  ]);

  // Parse dictionary
  if (dictResult.status === 'fulfilled' && dictResult.value && dictResult.value[0]) {
    const entry = dictResult.value[0];
    result.phonetic = entry.phonetic || '';
    if (!result.phonetic && entry.phonetics) {
      const p = entry.phonetics.find(ph => ph.text);
      if (p) result.phonetic = p.text;
    }
    const meanings = entry.meanings || [];
    for (const m of meanings.slice(0, 3)) {
      const pos = m.partOfSpeech;
      for (const d of m.definitions.slice(0, 2)) {
        result.enDefs.push({ pos, def: d.definition });
      }
    }
  }

  // Parse translation
  if (transResult.status === 'fulfilled' && transResult.value) {
    const trans = transResult.value;
    if (trans.responseStatus === 200 && trans.responseData && trans.responseData.translatedText) {
      const t = trans.responseData.translatedText;
      // Only use if it actually looks like Chinese
      if (/[\u4e00-\u9fff]/.test(t)) {
        result.meaning = t;
      }
    }
  }

  lookupCache[word] = result;
  renderLookupResult(result);
}

function renderLookupResult(result) {
  popupPhonetic.textContent = result.phonetic || '';
  popupMeaning.textContent = result.meaning || '';
  popupSource.textContent = result.meaning ? '🌐 在线翻译' : '';
  popupSource.className = 'popup-source';

  let defHtml = '';
  for (const d of (result.enDefs || [])) {
    defHtml += `<div><span class="def-pos">${d.pos}</span>${escapeHtml(d.def)}</div>`;
  }
  popupEnDef.innerHTML = defHtml;

  if (!result.meaning && !defHtml) {
    popupMeaning.textContent = '暂无释义';
  }
}

      if (audio.paused) audio.play();
    });
    div.querySelector('.seg-repeat').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLoop(i);
    });
    div.querySelector('.seg-translate').addEventListener('click', (e) => {
      e.stopPropagation();
      translateSegment(i);
    });
    subtitlePanel.appendChild(div);
  });
}

function setSegmentTranslationState(i, text, state = 'ready') {
  const el = subtitlePanel.children[i];
  if (!el) return;

  const translation = el.querySelector('.seg-translation');
  const button = el.querySelector('.seg-translate');
  if (!translation || !button) return;

  translation.hidden = false;
  translation.classList.toggle('is-loading', state === 'loading');
  translation.classList.toggle('is-error', state === 'error');
  translation.textContent = text;

  button.disabled = state === 'loading';
  button.textContent = state === 'loading' ? '...' : '译';
}

async function translateSegment(i) {
  const seg = SEGMENTS[i];
  if (!seg) return;

  const cacheKey = seg.text;
  if (sentenceTranslationCache[cacheKey]) {
    setSegmentTranslationState(i, sentenceTranslationCache[cacheKey]);
    return;
  }

  setSegmentTranslationState(i, '正在翻译...', 'loading');

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);

  try {
    const resp = await fetch(
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(seg.text)}&langpair=${encodeURIComponent('en|zh')}`,
      { signal: controller.signal }
    );
    if (!resp.ok) throw new Error('translation request failed');

    const data = await resp.json();
    if (data && data.responseStatus && data.responseStatus !== 200) {
      throw new Error(data.responseDetails || 'translation service rejected request');
    }
    const translatedText = data && data.responseData && data.responseData.translatedText;
    const translated = translatedText ? decodeHtmlEntities(translatedText.trim()) : '';
    if (!translated) throw new Error('empty translation');

    sentenceTranslationCache[cacheKey] = translated;
    setSegmentTranslationState(i, translated);
  } catch (e) {
    setSegmentTranslationState(i, '暂时无法翻译，请稍后重试。', 'error');
  } finally {
    clearTimeout(timeout);
  }
}

function toggleLoop(i) {
  if (loopSegIndex === i) {
    loopSegIndex = -1;
    loopIndicator.classList.remove('active');
    document.querySelectorAll('.seg').forEach(s => s.style.outline = '');
  } else {
    loopSegIndex = i;
    loopIndicator.classList.add('active');
    document.querySelectorAll('.seg').forEach(s => s.style.outline = '');
    const el = subtitlePanel.children[i];
    if (el) el.style.outline = '1px solid var(--accent)';
    audio.currentTime = SEGMENTS[i].start;
    if (audio.paused) audio.play();
  }
}

// === Notebook (localStorage) ===
const NB_KEY = 'english_learning_notebook';
function loadNotebook() {
  try { return JSON.parse(localStorage.getItem(NB_KEY)) || {}; } catch { return {}; }
}
function saveNotebook(nb) {
  localStorage.setItem(NB_KEY, JSON.stringify(nb));
  updateNotebookCount();
}
function addToNotebook(word, phonetic, meaning) {
  const nb = loadNotebook();
  if (!nb[word]) {
    nb[word] = { phonetic: phonetic || '', meaning: meaning || '', addedAt: Date.now() };
    saveNotebook(nb);
  }
}
function removeFromNotebook(word) {
  const nb = loadNotebook();
  delete nb[word];
  saveNotebook(nb);
}
function isInNotebook(word) {
  return !!loadNotebook()[word];
}
function updateNotebookCount() {
  const count = Object.keys(loadNotebook()).length;
  document.getElementById('notebookCount').textContent = count;
}

// === Tab state ===
let currentTab = 'course'; // 'course' or 'notebook'

// === Build vocab sidebar ===
function buildVocabList(filter = '') {
  vocabList.innerHTML = '';
  const notebookActions = document.getElementById('notebookActions');

  if (currentTab === 'course') {
    notebookActions.classList.remove('show');
    const entries = Object.entries(VOCAB)
      .filter(([w, info]) => !filter || w.includes(filter.toLowerCase()) || info.meaning.includes(filter))
      .sort((a, b) => a[0].localeCompare(b[0]));

    document.getElementById('vocabBadge').textContent = entries.length;
    document.getElementById('courseCount').textContent = entries.length;
    document.getElementById('vocabCount').textContent = entries.length;

    entries.forEach(([word, info]) => {
      const div = document.createElement('div');
      div.className = 'vocab-item';
      const inNb = isInNotebook(word);
      div.innerHTML = `
        <div><span class="vi-word">${word}</span><span class="vi-phonetic">${info.phonetic || ''}</span></div>
        <div class="vi-meaning">${info.meaning}</div>
      `;
      div.addEventListener('click', () => {
        const idx = SEGMENTS.findIndex(s => new RegExp('\\b' + word + '\\b', 'i').test(s.text));
        if (idx >= 0) {
          audio.currentTime = SEGMENTS[idx].start;
          if (audio.paused) audio.play();
          scrollToSeg(idx);
        }
      });
      vocabList.appendChild(div);
    });
  } else {
    // Notebook tab
    notebookActions.classList.add('show');
    const nb = loadNotebook();
    const entries = Object.entries(nb)
      .filter(([w, info]) => !filter || w.includes(filter.toLowerCase()) || info.meaning.includes(filter))
      .sort((a, b) => a[0].localeCompare(b[0]));

    document.getElementById('vocabBadge').textContent = entries.length;

    if (entries.length === 0) {
      vocabList.innerHTML = '<div style="padding:24px 16px;text-align:center;color:var(--text-dim);font-size:13px;">📝 单词本为空<br><br>点击字幕中的单词，然后按「⭐ 加入单词本」<br>即可收藏到这里</div>';
      return;
    }

    entries.forEach(([word, info]) => {
      const div = document.createElement('div');
      div.className = 'vocab-item';
      div.innerHTML = `
        <button class="vi-delete" title="移除">✕</button>
        <div><span class="vi-word">${word}</span><span class="vi-phonetic">${info.phonetic || ''}</span></div>
        <div class="vi-meaning">${info.meaning}</div>
      `;
      div.querySelector('.vi-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromNotebook(word);
        buildVocabList(vocabSearchInput.value);
      });
      div.addEventListener('click', (e) => {
        if (e.target.closest('.vi-delete')) return;
        const idx = SEGMENTS.findIndex(s => new RegExp('\\b' + word + '\\b', 'i').test(s.text));
        if (idx >= 0) {
          audio.currentTime = SEGMENTS[idx].start;
          if (audio.paused) audio.play();
          scrollToSeg(idx);
        }
      });
      vocabList.appendChild(div);
    });
  }
  updateNotebookCount();
}

// === Tab switching ===
document.querySelectorAll('.vocab-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.vocab-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    buildVocabList(vocabSearchInput.value);
  });
});

// === Popup "Add to notebook" button ===
const popupAddBtn = document.getElementById('popupAddBtn');
popupAddBtn.addEventListener('click', () => {
  const word = popupWord.textContent;
  if (!word) return;
  const phonetic = popupPhonetic.textContent || '';
  const meaning = popupMeaning.textContent || '';
  addToNotebook(word, phonetic, meaning);
  popupAddBtn.textContent = '✅ 已加入';
  popupAddBtn.classList.add('added');
  // Refresh list if on notebook tab
  if (currentTab === 'notebook') buildVocabList(vocabSearchInput.value);
});

// === Notebook export/import/clear ===
document.getElementById('nbExport').addEventListener('click', () => {
  const nb = loadNotebook();
  const blob = new Blob([JSON.stringify(nb, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'my-vocabulary-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('nbImport').addEventListener('click', () => {
  document.getElementById('nbImportFile').click();
});
document.getElementById('nbImportFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      const nb = loadNotebook();
      Object.assign(nb, imported);
      saveNotebook(nb);
      buildVocabList(vocabSearchInput.value);
    } catch { alert('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('nbClear').addEventListener('click', () => {
  if (confirm('确定清空单词本？此操作不可撤销。')) {
    saveNotebook({});
    buildVocabList(vocabSearchInput.value);
  }
});

// === Scroll active segment into view ===
function scrollToSeg(idx) {
  const el = subtitlePanel.children[idx];
  if (el && autoScrollCheck.checked) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// === Update active segment ===
function updateActiveSeg() {
  const t = audio.currentTime;
  let newIdx = -1;
  for (let i = 0; i < SEGMENTS.length; i++) {
    if (t >= SEGMENTS[i].start && t < SEGMENTS[i].end) {
      newIdx = i;
      break;
    }
    // Handle gap between segments
    if (i < SEGMENTS.length - 1 && t >= SEGMENTS[i].end && t < SEGMENTS[i+1].start) {
      newIdx = i;
      break;
    }
  }
  if (newIdx === currentSegIndex) return;

  // Remove previous active
  if (currentSegIndex >= 0 && subtitlePanel.children[currentSegIndex]) {
    subtitlePanel.children[currentSegIndex].classList.remove('active');
  }
  currentSegIndex = newIdx;
  if (currentSegIndex >= 0 && subtitlePanel.children[currentSegIndex]) {
    subtitlePanel.children[currentSegIndex].classList.add('active');
    scrollToSeg(currentSegIndex);
  }
}

// === Loop check ===
function checkLoop() {
  if (loopSegIndex >= 0) {
    const seg = SEGMENTS[loopSegIndex];
    if (audio.currentTime >= seg.end) {
      audio.currentTime = seg.start;
    }
  }
}

// === Audio events ===
audio.addEventListener('timeupdate', () => {
  checkLoop();
  updateActiveSeg();

  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  progressFill.style.width = pct + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
  document.getElementById('durationStat').textContent = formatTime(audio.duration);
  loading.classList.add('hidden');
});

audio.addEventListener('canplaythrough', () => {
  loading.classList.add('hidden');
});

audio.addEventListener('play', () => { playBtn.textContent = '⏸'; });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });

// === Controls ===
playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play(); else audio.pause();
});

progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

document.getElementById('backBtn').addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 5);
});
document.getElementById('fwdBtn').addEventListener('click', () => {
  audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentSegIndex > 0) {
    audio.currentTime = SEGMENTS[currentSegIndex - 1].start;
  }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentSegIndex < SEGMENTS.length - 1) {
    audio.currentTime = SEGMENTS[currentSegIndex + 1].start;
  }
});

// Speed buttons
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    audio.playbackRate = parseFloat(btn.dataset.speed);
  });
});

// Volume
volumeSlider.addEventListener('input', () => {
  audio.volume = volumeSlider.value / 100;
  volumeBtn.textContent = audio.volume === 0 ? '🔇' : audio.volume < 0.5 ? '🔉' : '🔊';
});
audio.volume = 0.8;

volumeBtn.addEventListener('click', () => {
  if (audio.volume > 0) {
    audio.volume = 0;
    volumeSlider.value = 0;
    volumeBtn.textContent = '🔇';
  } else {
    audio.volume = 0.8;
    volumeSlider.value = 80;
    volumeBtn.textContent = '🔊';
  }
});

// Vocab search
vocabSearchInput.addEventListener('input', () => {
  buildVocabList(vocabSearchInput.value);
});

// Mobile vocab toggle
document.getElementById('vocabToggle').addEventListener('click', () => {
  document.getElementById('vocabSidebar').classList.toggle('show');
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ':
      e.preventDefault();
      if (audio.paused) audio.play(); else audio.pause();
      break;
    case 'ArrowLeft':
      audio.currentTime = Math.max(0, audio.currentTime - 5);
      break;
    case 'ArrowRight':
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      break;
    case 'ArrowUp':
      if (currentSegIndex > 0) audio.currentTime = SEGMENTS[currentSegIndex - 1].start;
      break;
    case 'ArrowDown':
      if (currentSegIndex < SEGMENTS.length - 1) audio.currentTime = SEGMENTS[currentSegIndex + 1].start;
      break;
  }
});

// === Init ===
buildSubtitles();
buildVocabList();

// Fallback hide loading
setTimeout(() => loading.classList.add('hidden'), 3000);
</script>

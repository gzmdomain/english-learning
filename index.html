<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 Jensen Huang - Caltech 2024 Commencement Speech | English Learning</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg-primary: #0f0f14;
    --bg-secondary: #1a1a24;
    --bg-card: #22222e;
    --bg-hover: #2a2a38;
    --text-primary: #e8e8ef;
    --text-secondary: #9898a8;
    --text-dim: #68688a;
    --accent: #76b900;
    --accent-glow: rgba(118, 185, 0, 0.3);
    --accent-dim: rgba(118, 185, 0, 0.12);
    --highlight: #fbbf24;
    --highlight-bg: rgba(251, 191, 36, 0.12);
    --border: rgba(255,255,255,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
  }

  /* === Layout === */
  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* === Header === */
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header .logo {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #000;
    flex-shrink: 0;
  }
  .header .title-group h1 {
    font-size: 16px; font-weight: 600; line-height: 1.3;
  }
  .header .title-group p {
    font-size: 12px; color: var(--text-secondary); margin-top: 2px;
  }
  .header .stats {
    margin-left: auto;
    display: flex; gap: 16px; font-size: 12px; color: var(--text-dim);
  }
  .header .stats span { display: flex; align-items: center; gap: 4px; }
  .session-start-btn {
    margin-left: auto;
    min-height: 38px;
    padding: 0 14px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent);
    color: #000;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    white-space: nowrap;
  }
  .session-start-btn:hover {
    background: #8ad400;
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .session-start-btn:active { transform: translateY(1px); }
  .session-start-btn.is-active {
    background: transparent;
    color: var(--accent);
  }
  .header .session-start-btn + .stats { margin-left: 0; }

  /* === Main Content === */
  .main {
    display: grid;
    grid-template-columns: 210px minmax(0, 1fr) 320px;
    gap: 0;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
  }

  .track-sidebar {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: rgba(255,255,255,0.015);
  }
  .track-sidebar-header {
    padding: 16px 14px 10px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .track-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 10px 14px;
    overflow-y: auto;
  }
  .track-tab {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    color: var(--text-secondary);
    text-align: left;
    padding: 10px 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .track-tab:hover,
  .track-tab.active {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--text-primary);
  }
  .track-tab-title {
    display: block;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;
  }
  .track-tab-subtitle {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.35;
  }
  .track-tab-meta {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  /* === Subtitle Panel === */
  .subtitle-panel {
    overflow-y: auto;
    padding: 16px 24px 20px;
    scroll-behavior: smooth;
    min-width: 0;
    flex: 1;
  }
  .subtitle-panel::-webkit-scrollbar { width: 4px; }
  .subtitle-panel::-webkit-scrollbar-track { background: transparent; }
  .subtitle-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .seg {
    padding: 12px 136px 12px 16px;
    margin-bottom: 4px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    border-left: 3px solid transparent;
    position: relative;
  }
  .seg.is-outside-section { display: none; }
  .seg:hover {
    background: var(--bg-hover);
  }
  .seg.active {
    background: var(--accent-dim);
    border-left-color: var(--accent);
  }
  .seg.active .seg-text {
    color: #fff;
  }
  .seg .seg-time {
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .seg.active .seg-time {
    color: var(--accent);
  }
  .seg .seg-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-secondary);
    transition: color 0.25s;
  }
  .dictation-prompt {
    display: none;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
  }
  body.dictation-mode .seg:not(.is-revealed) .seg-text {
    display: none;
  }
  body.dictation-mode .seg:not(.is-revealed) .dictation-prompt {
    display: block;
  }
  body.dictation-mode .seg:not(.is-revealed) {
    background-image: linear-gradient(90deg, rgba(118,185,0,0.08), transparent 55%);
  }

  /* Vocab highlight in subtitle */
  .vocab-word {
    color: var(--highlight);
    background: var(--highlight-bg);
    padding: 1px 4px;
    border-radius: 4px;
    cursor: help;
    position: relative;
    font-weight: 500;
    transition: all 0.2s;
  }
  .vocab-word:hover {
    background: rgba(251, 191, 36, 0.25);
  }

  /* Tooltip */
  .vocab-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #2d2d3a;
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .vocab-tip .tip-word { color: var(--highlight); font-weight: 600; }
  .vocab-tip .tip-phonetic { color: var(--text-dim); font-size: 11px; margin-left: 6px; }
  .vocab-tip .tip-meaning { color: var(--text-primary); margin-top: 4px; font-family: 'Noto Sans SC', sans-serif; }
  .vocab-word:hover .vocab-tip { display: block; }

  /* === Vocabulary Sidebar === */
  .vocab-sidebar {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .vocab-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .vocab-header .badge {
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .vocab-search {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .vocab-search input {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .vocab-search input:focus {
    border-color: var(--accent);
  }
  .vocab-search input::placeholder {
    color: var(--text-dim);
  }
  .vocab-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 12px;
  }
  .vocab-list::-webkit-scrollbar { width: 4px; }
  .vocab-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .vocab-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    border-bottom: 1px solid var(--border);
  }
  .vocab-item:last-child { border-bottom: none; }
  .vocab-item:hover { background: var(--bg-hover); }
  .vocab-item.active { background: var(--highlight-bg); }
  .vocab-item .vi-word {
    font-size: 14px;
    font-weight: 600;
    color: var(--highlight);
  }
  .vocab-item .vi-phonetic {
    font-size: 11px;
    color: var(--text-dim);
    margin-left: 6px;
  }
  .vocab-item .vi-meaning {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .vocab-item .vi-delete {
    float: right;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    padding: 0 2px;
  }
  .vocab-item:hover .vi-delete { opacity: 0.7; }
  .vocab-item .vi-delete:hover { opacity: 1; color: #f87171; }

  /* Sidebar summary */
  .learning-summary {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .summary-pill {
    flex: 1;
    padding: 7px 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .summary-pill .tab-badge {
    display: block;
    width: fit-content;
    min-width: 24px;
    margin: 5px auto 0;
    padding: 1px 7px;
    border-radius: 8px;
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 700;
  }

  .sidebar-section {
    margin-bottom: 14px;
  }
  .sidebar-section-title {
    position: sticky;
    top: -8px;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 4px 8px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 700;
  }
  .sidebar-section-title .section-count {
    font-size: 11px;
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 8px;
    color: var(--text-secondary);
  }
  .sidebar-empty {
    padding: 18px 10px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
  }

  /* Notebook actions bar */
  .notebook-actions {
    display: flex;
    padding: 8px 12px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .notebook-actions.show { display: flex; }
  .nb-action-btn {
    flex: 1;
    padding: 6px 0;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .nb-action-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .nb-action-btn.danger:hover {
    border-color: #f87171;
    color: #f87171;
  }

  /* === Player Bar === */
  .player-bar {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .progress-row .time-label {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    min-width: 48px;
    text-align: center;
  }
  .progress-bar-container {
    flex: 1;
    min-width: 0;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    transition: height 0.15s;
    touch-action: none;
  }
  .progress-bar-container:hover { height: 10px; }
  .progress-bar-container.dragging { height: 10px; }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    position: relative;
    transition: width 0.1s linear;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .progress-bar-container:hover .progress-bar-fill::after {
    opacity: 1;
  }
  .progress-bar-container.dragging .progress-bar-fill::after {
    opacity: 1;
  }
  .controls-row {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    min-width: 0;
  }
  .btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    font-size: 18px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
  }
  .btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .btn-play {
    background: var(--accent);
    color: #000;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 20px;
  }
  .btn-play:hover { background: #8ad400; color: #000; transform: scale(1.05); }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
  }
  .speed-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .speed-btn:hover, .speed-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
  }
  .volume-slider {
    -webkit-appearance: none;
    width: 80px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }

  /* === Responsive === */
  @media (max-width: 900px) {
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); width: 100%; }
    .track-sidebar {
      border-right: none;
      border-bottom: 1px solid var(--border);
      max-height: 138px;
    }
    .track-sidebar-header {
      padding: 10px 14px 6px;
    }
    .track-list {
      flex-direction: row;
      overflow-x: auto;
      padding: 0 14px 10px;
    }
    .track-tab {
      min-width: 178px;
      flex: 0 0 auto;
    }
    .vocab-sidebar { display: none; }
  }

  /* === Toggle sidebar for mobile === */
  .vocab-toggle {
    display: none;
    position: fixed;
    bottom: 100px;
    right: 16px;
    width: 48px;
    height: 48px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow);
    z-index: 50;
  }
  @media (max-width: 900px) {
    .vocab-toggle { display: flex; align-items: center; justify-content: center; }
    .vocab-sidebar.show {
      display: flex;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 320px;
      background: var(--bg-secondary);
      z-index: 100;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
  }

  /* Loading overlay */
  .loading {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  .loading.hidden { display: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Subtitle tools */
  .subtitle-tools {
    position: absolute;
    top: 12px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
    z-index: 10;
  }
  .autoscroll-toggle,
  .dictation-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .autoscroll-toggle input,
  .dictation-toggle input { accent-color: var(--accent); }

  .section-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 248px 12px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-width: 0;
  }
  .section-nav-btn {
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .section-nav-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .section-nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .section-meta {
    min-width: 118px;
    flex-shrink: 0;
  }
  .section-title {
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
  }
  .section-range {
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .section-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    min-width: 0;
    padding-bottom: 1px;
  }
  .section-chip {
    min-width: 34px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .section-chip:hover,
  .section-chip.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .subtitle-wrapper {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  /* Five-minute easy session */
  .easy-session {
    flex-shrink: 0;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(118,185,0,0.35);
    background: linear-gradient(90deg, rgba(118,185,0,0.14), rgba(118,185,0,0.03));
  }
  .easy-session[hidden] { display: none; }
  .easy-session-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .easy-session-copy { min-width: 0; }
  .easy-session-kicker {
    color: var(--accent);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .easy-session-title {
    margin-top: 3px;
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 800;
  }
  .easy-session-note {
    margin-top: 3px;
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.45;
  }
  .easy-session-timer {
    min-width: 74px;
    color: var(--accent);
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .easy-session-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 12px;
  }
  .easy-action {
    min-height: 34px;
    padding: 0 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: rgba(255,255,255,0.025);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .easy-action:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }
  .easy-action.is-primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #000;
  }
  .easy-action.is-primary:hover { background: #8ad400; color: #000; }
  .easy-session.is-complete {
    background: linear-gradient(90deg, rgba(118,185,0,0.2), rgba(118,185,0,0.05));
  }
  .easy-session.is-complete .easy-session-timer { font-size: 18px; }
  .easy-listen-prompt { display: none; }
  body.easy-session-mode .section-nav,
  body.easy-session-mode .subtitle-tools {
    display: none;
  }
  body.easy-session-mode .subtitle-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }
  body.easy-session-mode .seg:not(.easy-focus) {
    display: none !important;
  }
  body.easy-session-mode .seg.easy-focus {
    width: min(760px, 100%);
    margin: 0;
    padding: 28px 138px 28px 26px;
    border: 1px solid rgba(118,185,0,0.38);
    border-left: 4px solid var(--accent);
    background: rgba(118,185,0,0.08);
    cursor: default;
  }
  body.easy-session-mode .seg.easy-focus .seg-time {
    margin-bottom: 10px;
    color: var(--accent);
  }
  body.easy-session-mode .seg.easy-focus .seg-text {
    font-size: 22px;
    line-height: 1.6;
    color: var(--text-primary);
  }
  body.easy-session-mode .seg.easy-focus:not(.easy-session-revealed) .seg-text {
    display: none;
  }
  body.easy-session-mode .seg.easy-focus:not(.easy-session-revealed) .easy-listen-prompt {
    display: block;
    color: var(--text-primary);
    font-size: 18px;
    font-weight: 650;
    line-height: 1.55;
  }
  body.easy-session-mode .seg.easy-focus .seg-actions { display: none; }

  .bored-btn {
    min-height: 36px;
    padding: 0 12px;
    border: 1px solid rgba(251,191,36,0.45);
    border-radius: 8px;
    background: rgba(251,191,36,0.08);
    color: var(--highlight);
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
  }
  .bored-btn:hover { background: rgba(251,191,36,0.16); }

  .rescue-dialog {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(0,0,0,0.68);
  }
  .rescue-dialog[hidden] { display: none; }
  .rescue-sheet {
    width: min(520px, 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #1b1b24;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .rescue-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 20px 14px;
  }
  .rescue-head h2 {
    margin: 3px 0 0;
    color: var(--text-primary);
    font-size: 20px;
  }
  .rescue-close {
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .rescue-options {
    display: grid;
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }
  .rescue-option {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 12px;
    align-items: center;
    padding: 15px 20px;
    border: 0;
    background: #20202a;
    color: var(--text-primary);
    text-align: left;
    cursor: pointer;
  }
  .rescue-option:hover { background: var(--bg-hover); }
  .rescue-icon {
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--accent);
    font-weight: 800;
  }
  .rescue-option strong {
    display: block;
    font-size: 14px;
  }
  .rescue-option span:last-child {
    display: block;
    margin-top: 3px;
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.45;
  }

  /* Loop mode indicator */
  .loop-indicator {
    font-size: 11px;
    color: var(--accent);
    margin-left: 8px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .loop-indicator.active { opacity: 1; }

  /* Sentence action buttons */
  .seg-actions {
    position: absolute;
    right: 8px;
    top: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .seg-action {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .seg-reveal {
    display: none;
  }
  body.dictation-mode .seg-reveal {
    display: inline-flex;
  }
  .seg:hover .seg-action,
  .seg:focus-within .seg-action {
    opacity: 0.6;
  }
  body.dictation-mode .seg-action {
    opacity: 0.72;
  }
  .seg-action:hover { opacity: 1 !important; color: var(--accent); background: rgba(255,255,255,0.06); }
  .seg-action.is-active {
    opacity: 1;
    color: var(--accent);
  }
  .seg-action:disabled {
    cursor: wait;
    opacity: 0.7;
  }
  .seg-translation {
    margin-top: 8px;
    padding-left: 10px;
    border-left: 2px solid var(--accent);
    color: var(--text-primary);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    line-height: 1.65;
  }
  .seg-translation[hidden] { display: none; }
  .seg-translation.is-loading,
  .seg-translation.is-error {
    color: var(--text-dim);
  }
  .sentence-card .sentence-time {
    color: var(--accent);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .sentence-card .sentence-text {
    color: var(--text-primary);
    font-size: 13px;
    line-height: 1.55;
    margin-top: 5px;
  }
  .sentence-card .sentence-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  /* === Click-to-lookup popup === */
  .word-clickable {
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, color 0.15s;
  }
  .word-clickable:hover {
    background: rgba(255,255,255,0.08);
  }
  .word-clickable.looked-up {
    color: #60a5fa;
    text-decoration-color: rgba(96,165,250,0.3);
  }

  #wordPopup {
    display: none;
    position: fixed;
    z-index: 200;
    background: #1e1e2e;
    border: 1px solid rgba(118,185,0,0.4);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 280px;
    max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    font-size: 14px;
    animation: popIn 0.15s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  #wordPopup.show { display: block; }
  #wordPopup .popup-close {
    position: absolute;
    top: 8px; right: 12px;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }
  #wordPopup .popup-close:hover { color: #fff; }
  #wordPopup .popup-word {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  #wordPopup .popup-phonetic {
    font-size: 14px;
    color: var(--accent);
    margin-left: 8px;
    font-weight: 400;
  }
  #wordPopup .popup-speak {
    background: none; border: none;
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    margin-left: 6px;
    vertical-align: middle;
  }
  #wordPopup .popup-speak:hover { color: #8ad400; }
  #wordPopup .popup-divider {
    height: 1px;
    background: var(--border);
    margin: 10px 0;
  }
  #wordPopup .popup-meaning {
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--highlight);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
  }
  #wordPopup .popup-en-def {
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.6;
    margin-top: 6px;
  }
  #wordPopup .popup-en-def .def-pos {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
    margin-right: 4px;
  }
  #wordPopup .popup-loading {
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #wordPopup .popup-loading .mini-spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  #wordPopup .popup-source {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
  }
  #wordPopup .popup-source.is-vocab {
    color: var(--highlight);
  }
  #wordPopup .popup-add-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: none;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
  }
  #wordPopup .popup-add-btn:hover {
    background: var(--accent);
    color: #000;
  }
  #wordPopup .popup-add-btn.added {
    border-color: var(--text-dim);
    color: var(--text-dim);
    pointer-events: none;
  }

  @media (max-width: 760px) {
    .header {
      padding: 12px 14px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .header .title-group { min-width: 0; flex: 1; }
    .header .title-group h1 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header .session-start-btn {
      order: 3;
      width: 100%;
      margin-left: 0;
    }
    .header .stats {
      display: none;
    }
    .player-bar {
      padding: 8px 12px max(8px, env(safe-area-inset-bottom));
    }
    .progress-row {
      gap: 8px;
    }
    .progress-row .time-label {
      min-width: 42px;
    }
    .controls-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .volume-control {
      display: none;
    }
    .controls-row > .btn {
      justify-self: center;
    }
    .speed-control {
      grid-column: 3 / -1;
      width: 100%;
      margin-left: 0;
    }
    .speed-btn {
      flex: 1;
      min-width: 0;
      padding-right: 4px;
      padding-left: 4px;
    }
    .speed-btn[data-speed="0.5"],
    .speed-btn[data-speed="1.5"] {
      display: none;
    }
    .subtitle-tools {
      position: static;
      justify-content: flex-end;
      padding: 8px 14px 0;
      flex-wrap: wrap;
    }
    .section-nav {
      padding: 10px 14px;
      flex-wrap: wrap;
    }
    .section-meta {
      min-width: 96px;
    }
    .section-chips {
      order: 3;
      width: 100%;
    }
    .seg {
      padding-right: 120px;
    }
    .seg-actions {
      right: 6px;
    }
    .easy-session {
      padding: 12px 14px;
    }
    .easy-session-main {
      align-items: flex-start;
    }
    .easy-session-title {
      font-size: 15px;
    }
    .easy-session-timer {
      min-width: 62px;
      font-size: 22px;
    }
    .easy-session-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .easy-action:last-child {
      grid-column: 1 / -1;
    }
    body.easy-session-mode .subtitle-panel {
      padding: 18px 14px;
    }
    body.easy-session-mode .seg.easy-focus {
      padding: 22px 18px;
    }
    body.easy-session-mode .seg.easy-focus .seg-text {
      font-size: 19px;
    }
    .bored-btn {
      grid-column: 1 / 3;
      width: 100%;
    }
    .rescue-dialog {
      align-items: end;
      padding: 0;
    }
    .rescue-sheet {
      width: 100%;
      border-right: 0;
      border-bottom: 0;
      border-left: 0;
      border-radius: 10px 10px 0 0;
    }
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div style="color: var(--text-dim); font-size: 14px;">Loading audio...</div>
</div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">E</div>
    <div class="title-group">
      <h1 id="trackTitle">Jensen Huang — Caltech Commencement 2024</h1>
      <p id="trackSubtitle">🎓 English Learning · Scroll Subtitles with Vocabulary</p>
    </div>
    <button class="session-start-btn" id="sessionStartBtn" type="button">▶ 开始 5 分钟 · 今日 0 轮</button>
    <div class="stats">
      <span>📖 <span id="vocabCount">0</span> words</span>
      <span>⏱ <span id="durationStat">--:--</span></span>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <nav class="track-sidebar" aria-label="Lessons">
      <div class="track-sidebar-header">Lessons</div>
      <div class="track-list" id="trackTabs"></div>
    </nav>
    <div class="subtitle-wrapper">
      <section class="easy-session" id="easySession" aria-live="polite" hidden>
        <div class="easy-session-main">
          <div class="easy-session-copy">
            <div class="easy-session-kicker">5-minute easy mode</div>
            <div class="easy-session-title" id="easySessionTitle">今天只完成这一句</div>
            <div class="easy-session-note" id="easySessionNote">先听一遍，不需要全部听懂。</div>
          </div>
          <div class="easy-session-timer" id="easySessionTimer">5:00</div>
        </div>
        <div class="easy-session-actions" id="easySessionActions">
          <button class="easy-action is-primary" id="easyListenBtn" type="button">▶ 听一遍</button>
          <button class="easy-action" id="easyRevealBtn" type="button">文 看原文</button>
          <button class="easy-action" id="easyTranslateBtn" type="button">译 看翻译</button>
          <button class="easy-action" id="easyNextBtn" type="button">↻ 换一句</button>
          <button class="easy-action" id="easyCompleteBtn" type="button">✓ 完成本轮</button>
        </div>
      </section>
      <div class="subtitle-tools">
        <label class="autoscroll-toggle">
          <input type="checkbox" id="autoScroll" checked> Auto-scroll
        </label>
        <label class="dictation-toggle">
          <input type="checkbox" id="dictationMode"> 听写
        </label>
        <span class="loop-indicator" id="loopIndicator">🔁 Loop</span>
      </div>
      <div class="section-nav" id="sectionNav" aria-label="学习分段">
        <button class="section-nav-btn" type="button" id="prevSection" title="上一段" aria-label="上一段">‹</button>
        <div class="section-meta">
          <div class="section-title" id="sectionTitle">第 1/1 段</div>
          <div class="section-range" id="sectionRange">0:00 - 0:00</div>
        </div>
        <div class="section-chips" id="sectionChips"></div>
        <button class="section-nav-btn" type="button" id="nextSection" title="下一段" aria-label="下一段">›</button>
      </div>
      <div class="subtitle-panel" id="subtitlePanel"></div>
    </div>
    <div class="vocab-sidebar" id="vocabSidebar">
      <div class="vocab-header">
        📚 学习清单 <span class="badge" id="vocabBadge">0</span>
      </div>
      <div class="learning-summary">
        <div class="summary-pill">词汇 <span class="tab-badge" id="courseCount">0</span></div>
        <div class="summary-pill">单词本 <span class="tab-badge" id="notebookCount">0</span></div>
        <div class="summary-pill">难句 <span class="tab-badge" id="sentenceCount">0</span></div>
      </div>
      <div class="vocab-search">
        <input type="text" id="vocabSearchInput" placeholder="搜索词汇、单词本或难句...">
      </div>
      <div class="notebook-actions" id="notebookActions">
        <button class="nb-action-btn" id="nbExport">📤 导出</button>
        <button class="nb-action-btn" id="nbImport">📥 导入</button>
        <button class="nb-action-btn danger" id="nbClear">🗑 清空</button>
      </div>
      <div class="vocab-list" id="vocabList"></div>
      <input type="file" id="nbImportFile" accept=".json" style="display:none">
    </div>
  </div>

  <!-- Player -->
  <div class="player-bar">
    <div class="progress-row">
      <span class="time-label" id="currentTime">0:00</span>
      <div class="progress-bar-container" id="progressBar">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <span class="time-label" id="totalTime">0:00</span>
    </div>
    <div class="controls-row">
      <div class="volume-control">
        <button class="btn" id="volumeBtn" title="Volume">🔊</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
      </div>
      <button class="btn" id="prevBtn" title="Previous sentence">⏮</button>
      <button class="btn" id="backBtn" title="Back 5s">↩️</button>
      <button class="btn btn-play" id="playBtn" title="Play/Pause">▶</button>
      <button class="btn" id="fwdBtn" title="Forward 5s">↪️</button>
      <button class="btn" id="nextBtn" title="Next sentence">⏭</button>
      <button class="bored-btn" id="boredBtn" type="button">我听烦了</button>
      <div class="speed-control">
        <button class="speed-btn" data-speed="0.5">0.5x</button>
        <button class="speed-btn" data-speed="0.75">0.75x</button>
        <button class="speed-btn active" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="1.25">1.25x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
      </div>
    </div>
  </div>
</div>

<button class="vocab-toggle" id="vocabToggle">📚</button>

<div class="rescue-dialog" id="rescueDialog" role="dialog" aria-modal="true" aria-labelledby="rescueTitle" hidden>
  <div class="rescue-sheet">
    <div class="rescue-head">
      <div>
        <div class="easy-session-kicker">先别硬撑</div>
        <h2 id="rescueTitle">现在换一种方式</h2>
      </div>
      <button class="rescue-close" id="rescueCloseBtn" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="rescue-options">
      <button class="rescue-option" type="button" data-rescue="easier">
        <span class="rescue-icon">0.75</span>
        <span><strong>太难了</strong><span>降速、显示原文，并翻译当前句。</span></span>
      </button>
      <button class="rescue-option" type="button" data-rescue="next">
        <span class="rescue-icon">↻</span>
        <span><strong>重复烦了</strong><span>换到下一句，不从头来。</span></span>
      </button>
      <button class="rescue-option" type="button" data-rescue="finish">
        <span class="rescue-icon">✓</span>
        <span><strong>今天到这里</strong><span>记为完成一轮，放心关掉。</span></span>
      </button>
    </div>
  </div>
</div>

<!-- Word lookup popup -->
<div id="wordPopup">
  <button class="popup-close" id="popupClose">✕</button>
  <div>
    <span class="popup-word" id="popupWord"></span>
    <span class="popup-phonetic" id="popupPhonetic"></span>
    <button class="popup-speak" id="popupSpeak" type="button" title="Pronounce" aria-label="Pronounce">🔊</button>
  </div>
  <div class="popup-divider"></div>
  <div class="popup-meaning" id="popupMeaning"></div>
  <div class="popup-en-def" id="popupEnDef"></div>
  <div class="popup-source" id="popupSource"></div>
  <button class="popup-add-btn" id="popupAddBtn">⭐ 加入单词本</button>
</div>

<audio id="audio" preload="auto">
  <source src="https://media.podcasts.ox.ac.uk/philfac/uehiro/2022-05-10-uehiro-tolpeter-railton.mp3" type="audio/mpeg">
</audio>

<script src="data/ai-tracks.js"></script>
<script>
// === Data ===
const JENSEN_SEGMENTS = [{"start":8.5,"end":13.5,"text":"It really makes me cringe listening to all that."},{"start":13.5,"end":19.5,"text":"Thank you for that kind introduction, but I hate hearing about myself."},{"start":19.5,"end":26.5,"text":"And just as a show, well, maybe if you could just applaud."},{"start":26.5,"end":34.1,"text":"How many of you know who NVIDIA is?"},{"start":34.1,"end":37.26,"text":"And how many of you know what a GPU is?"},{"start":42.7,"end":46.5,"text":"Okay, good, I don't have to change my speech."},{"start":46.5,"end":54.64,"text":"Ladies and gentlemen, President Rosenbaum, esteemed faculty members, distinguished guests, proud parents, and above all,"},{"start":54.64,"end":61.38,"text":"the 2024 graduating class of Caltech."},{"start":68.5,"end":70.5,"text":"This is a really happy day for you guys."},{"start":70.5,"end":71.5,"text":"You got to look more excited."},{"start":71.5,"end":74.5,"text":"You know you're graduating from Caltech."},{"start":74.5,"end":87.5,"text":"This is the school of the great Richard Feynman, Linus Pauling, and someone who's very influential to me and our industry, Carver Mead."},{"start":87.5,"end":89.0,"text":"Yeah, this is a very big deal."},{"start":93.5,"end":95.5,"text":"Today is a day of immense pride and joy."},{"start":95.5,"end":103.28,"text":"It is a dream come true for all of you,"},{"start":103.28,"end":107.5,"text":"but not just for you because your parents and families have made countless sacrifices to see you reach this milestone."},{"start":107.5,"end":115.42,"text":"So let's take this moment and congratulate them, thank them, and let them know you love them."},{"start":124.5,"end":134.5,"text":"You don't want to forget that because you don't know how long you're going to be living at home."},{"start":134.5,"end":136.64,"text":"You want to be super grateful today."},{"start":139.5,"end":146.44,"text":"As a proud parent, I really loved it when my kids didn't move out,"},{"start":146.44,"end":149.5,"text":"and it was great to see them every day, but now they've moved out, it makes me sad."},{"start":149.5,"end":151.5,"text":"So hopefully you guys get to spend some time with your parents."},{"start":151.5,"end":161.5,"text":"Your journey here is a testament of your character, determination, willingness to make sacrifices for your dreams, and you should be proud."},{"start":161.5,"end":169.14,"text":"The ability to make sacrifices, endure pain and suffering, you will need these qualities in life."},{"start":171.5,"end":175.5,"text":"You and I share some things in common."},{"start":175.5,"end":181.8,"text":"First, both chief scientists of NVIDIA were from Caltech."},{"start":187.5,"end":196.5,"text":"And one of the reasons why I'm giving this speech today is because I'm recruiting."},{"start":196.5,"end":210.5,"text":"And so I want to tell you that NVIDIA is a really great company, I'm a very nice boss, universally loved, come work at NVIDIA."},{"start":210.5,"end":214.94,"text":"You and I share a passion for science and engineering, and although we're separated by about 40 years,"},{"start":214.94,"end":227.5,"text":"we are both at the peaks of our career."},{"start":227.5,"end":232.5,"text":"For all of you who have been paying attention to NVIDIA and myself, you know what I mean."},{"start":232.5,"end":239.5,"text":"It's just that in your case, you'll have many, many more peaks to go."},{"start":239.5,"end":243.5,"text":"I just hope that today is not my peak."},{"start":243.5,"end":245.5,"text":"Not the peak."},{"start":245.5,"end":251.5,"text":"And so I'm working as hard as ever to make sure that I have many, many more peaks ahead."},{"start":251.5,"end":257.38,"text":"Last year, I was honored to give the commencement address at Taiwan University,"},{"start":257.38,"end":263.5,"text":"and I shared several stories about NVIDIA's journey and the lessons that we learned that might be valuable for graduates."},{"start":263.5,"end":274.5,"text":"I have to admit that I don't love giving advice, especially to other people's children."},{"start":274.5,"end":287.18,"text":"And so my advice today will largely be disguised in some stories that I've enjoyed, and some life experiences that I've enjoyed."},{"start":291.5,"end":295.4,"text":"I'm the longest running tech CEO in the world today, I believe."},{"start":302.5,"end":309.5,"text":"Over the course of 31 years, I managed not to go out of business, not get bored, and not get fired."},{"start":309.5,"end":321.5,"text":"And so I have the great privilege of enjoying a lot of life's experiences, starting from creating NVIDIA, from nothing to what it is today."},{"start":321.5,"end":326.5,"text":"And so I spoke about the long road of creating CUDA, a programming model."},{"start":326.5,"end":334.5,"text":"The programming model that we dedicated over 20 years to invent, and that is revolutionizing computing today."},{"start":334.5,"end":341.94,"text":"I spoke about a very, quite public, canceled Sega game console project we worked on,"},{"start":345.8,"end":351.2,"text":"and where intellectual honesty, something that I know Richard Feynman cares very deeply about and spoke quite often about,"},{"start":351.2,"end":354.5,"text":"where intellectual honesty and humility saved our company."},{"start":354.5,"end":361.5,"text":"And how a retreat, a strategic retreat, was one of our best strategies."},{"start":361.5,"end":369.5,"text":"All of these are counterintuitive lessons that I spoke about at the commencement."},{"start":369.5,"end":378.5,"text":"But I encouraged the graduates to engage with AI, the most consequential technology of our time."},{"start":378.5,"end":384.5,"text":"And I'll speak a little bit more about that later, but all of you know about AI."},{"start":384.5,"end":389.5,"text":"It's hard not to be immersed in it and surrounded by it, and a great deal of discussion about it."},{"start":389.5,"end":401.5,"text":"And of course, I hope that all of you are using it and playing with it, with surprising results and some magical, some disappointing, and some surprising."},{"start":401.5,"end":405.5,"text":"But you have to enjoy it, you have to engage it, because it's advancing so quickly."},{"start":405.5,"end":412.5,"text":"It is the only technology that I've known that is advancing on multiple exponentials at the same time."},{"start":412.5,"end":415.5,"text":"And so the technology is changing very, very quickly."},{"start":415.5,"end":426.16,"text":"So I advised the students at the Taiwan University to run, don't walk, and engage the AI revolution."},{"start":428.5,"end":431.5,"text":"And yet, one year later, it's incredible how much it's changed."},{"start":431.5,"end":440.1,"text":"And so today, what I wanted to do is share with you my perspective, from my vantage point,"},{"start":440.1,"end":444.5,"text":"of some of the important things that are happening that you're graduating into."},{"start":444.5,"end":452.02,"text":"And these are extraordinary things that are happening that you should have an intuitive understanding for,"},{"start":452.02,"end":455.5,"text":"because it's going to matter to you, it's going to matter to the industry."},{"start":455.5,"end":460.5,"text":"And hopefully, you take advantage of the opportunity ahead of you."},{"start":460.5,"end":466.5,"text":"The computer industry is transforming from its foundations, literally from studs."},{"start":466.5,"end":468.5,"text":"Everything is changing from studs on up."},{"start":468.5,"end":474.5,"text":"And across every layer, and soon, every industry will also be transformed."},{"start":474.5,"end":480.5,"text":"And the reason for that is quite obvious, because computers today are the single most important instrument of knowledge."},{"start":480.5,"end":484.5,"text":"And it's foundational to every single industry and every field of science."},{"start":484.5,"end":491.5,"text":"If we are transforming the computer so profoundly, it will, of course, have implications in every industry."},{"start":491.5,"end":494.5,"text":"And I'll talk about that in just a little bit."},{"start":494.5,"end":498.5,"text":"And as you enter industry, it's important you know what's happening."},{"start":498.5,"end":504.5,"text":"Modern computing traces back to the IBM System 360."},{"start":504.5,"end":507.5,"text":"That was the architecture manual that I learned from."},{"start":507.5,"end":509.5,"text":"It's an architecture manual that you don't need to learn from."},{"start":509.5,"end":518.5,"text":"A lot better documentation and better descriptions of computers and architecture has been presented since."},{"start":518.5,"end":525.92,"text":"But the System 360 was incredibly important at its time, and in fact,"},{"start":525.92,"end":536.06,"text":"the basic ideas of the System 360, the architecture of it,"},{"start":536.06,"end":540.5,"text":"the principal ideas and architecture and strategy of the System 360 are still governing the computer industry today."},{"start":540.5,"end":544.5,"text":"And it was introduced a year after my birth."},{"start":544.5,"end":557.5,"text":"In the 80s, I was among the first generation of VLSI engineers who learned to design chips from Mead and Conway's landmark textbook."},{"start":557.5,"end":559.5,"text":"And I'm not sure if it's still being taught here."},{"start":559.5,"end":562.5,"text":"It should be in the introduction of VLSI systems."},{"start":562.5,"end":571.5,"text":"Based on Carver Mead's pioneering work here at Caltech on chip design methodologies and textbook that revolutionized IC design."},{"start":571.5,"end":578.5,"text":"And it enabled our generation to design supergiant chips and ultimately the CPU."},{"start":578.5,"end":582.5,"text":"The CPU led to exponential growth in computing."},{"start":582.5,"end":592.5,"text":"The performance, the incredible technology advances, that's called Moore's Law, fueled the information technology revolution."},{"start":592.5,"end":603.5,"text":"The industrial revolution that we are part of, that my generation was part of, saw the mass production of something the world had never seen before."},{"start":603.5,"end":609.5,"text":"The mass production of something that was invisible, easy to copy, the mass production of software."},{"start":609.5,"end":613.5,"text":"And it led to a $3 trillion industry."},{"start":613.5,"end":619.5,"text":"When I sat where you sat, the IT industry was minuscule."},{"start":619.5,"end":625.5,"text":"And the concept that you could make money selling software was a fantasy."},{"start":625.5,"end":636.5,"text":"And yet today, it's one of the most important commodities, most important technologies and product creations that our industry produces."},{"start":636.5,"end":646.5,"text":"However, the limits of the NARD scaling, of transistor scaling, and instruction level parallelism have slowed CPU performance."},{"start":646.5,"end":655.5,"text":"And the slowed CPU performance gains is happening at a time when computing demand continues to grow exponentially."},{"start":655.5,"end":670.66,"text":"This exponentially growing gap between demand of computing and the capabilities of computers, if not addressed,"},{"start":670.66,"end":675.5,"text":"computing energy consumption and cost, inflation, would eventually stifle every industry."},{"start":675.5,"end":680.5,"text":"We see very clear signs of computing inflation as we speak."},{"start":680.5,"end":688.5,"text":"And after two decades of advancing NVIDIA's CUDA, NVIDIA's accelerated computing offers a path forward."},{"start":688.5,"end":690.5,"text":"That's the reason why I'm here."},{"start":690.5,"end":705.5,"text":"Because finally, the industry realized of the incredible effectiveness of accelerated computing at precisely the time that we're witnessing computing inflation after several decades."},{"start":705.5,"end":719.0,"text":"By offloading time-consuming algorithms to a GPU that specializes in parallel processing, we routinely achieve 10, 100,"},{"start":719.0,"end":723.5,"text":"sometimes 1,000-fold speedups, saving money, cost, and energy."},{"start":723.5,"end":733.78,"text":"We now accelerate application domains from computer graphics, ray tracing, of course, to gene sequencing, scientific computing, astronomy, quantum circuit simulations,"},{"start":733.78,"end":738.5,"text":"SQL data processing, and even pandas, data science."},{"start":738.5,"end":741.5,"text":"Accelerated computing has reached a tipping point."},{"start":741.5,"end":747.38,"text":"That is our first great contribution to the computer industry, our first great contribution to society, accelerated computing."},{"start":751.5,"end":761.5,"text":"It now gives us a path forward for sustainable computing where cost will continue to decline as computing requirement continues to grow."},{"start":761.5,"end":777.5,"text":"A hundred-fold, a hundred-fold of anything in time or cost or energy savings that accelerated computing opened surely would trigger a new development somewhere else."},{"start":777.5,"end":785.5,"text":"We just didn't know what it was until deep learning came to our consciousness."},{"start":785.5,"end":787.5,"text":"A whole new world of computing emerged."},{"start":787.5,"end":801.5,"text":"Jeff Hinton, Alex Krzyzewski, and Ilya Sutskever used NVIDIA CUDA GPUs to train AlexNet and shocked the computer vision community by winning the 2012 ImageNet Challenge."},{"start":801.5,"end":812.5,"text":"This was the big moment, the big bang of deep learning, a pivotal moment that marked the beginning of the AI revolution."},{"start":812.5,"end":821.5,"text":"Our decisions after AlexNet transformed our company is something that's worth taking note of."},{"start":821.5,"end":827.5,"text":"Our decisions after AlexNet transformed our company and likely everything else."},{"start":827.5,"end":839.5,"text":"We saw the potential of deep learning and believed, just believed through principle thinking, believed through our own analysis of the scalability of deep learning."},{"start":839.5,"end":842.5,"text":"We believed the approach could learn other valuable functions."},{"start":842.5,"end":853.5,"text":"That maybe deep learning is a universal function learner and how many problems are difficult or impossible to express using fundamental first principles."},{"start":853.5,"end":859.84,"text":"And so when we saw this, when we saw this,"},{"start":859.84,"end":869.5,"text":"we thought this is a technology we really have to pay attention to because its limits are potentially only limited by model and data scale."},{"start":869.5,"end":872.5,"text":"However, there were challenges at the time."},{"start":872.5,"end":875.5,"text":"This is 2012, shortly after 2012."},{"start":875.5,"end":883.0,"text":"How could we explore the limits of deep learning without having to build these massive GPU clusters?"},{"start":883.0,"end":889.5,"text":"At the time we were a rather small company, building these massive GPU clusters could cost hundreds and hundreds of millions of dollars."},{"start":889.5,"end":896.5,"text":"And if we didn't though, there was no assurance that it would be effective if we scaled."},{"start":896.5,"end":900.5,"text":"However, no one knew how far deep learning could scale."},{"start":900.5,"end":904.5,"text":"And if we didn't build it, we'd never know."},{"start":904.5,"end":907.5,"text":"This is one of those, if you build it, will they come?"},{"start":907.5,"end":910.5,"text":"Our logic is if we don't build it, they can't come."},{"start":910.5,"end":916.5,"text":"And so we dedicated ourselves based on our first principled beliefs and our analysis."},{"start":916.5,"end":920.84,"text":"And we got ourselves to the point where we believed this was going to be so effective and when the company believes something,"},{"start":920.84,"end":924.5,"text":"we should go act on it."},{"start":924.5,"end":931.5,"text":"So we dove deep into deep learning, and over the next decade, systematically reinvented everything."},{"start":931.5,"end":935.5,"text":"We reinvented every computing layer, starting with the GPU itself."},{"start":935.5,"end":947.86,"text":"The invention of the modern GPU, which is very different than the GPU of the past that we invented in the first place,"},{"start":947.86,"end":953.5,"text":"and we went on to invent just about every other aspect of computing, the interconnects, the systems, the networking, and of course, software."},{"start":953.5,"end":955.5,"text":"We invested billions."},{"start":955.5,"end":958.5,"text":"We invested billions into the unknown."},{"start":958.5,"end":971.5,"text":"Thousands of engineers for a decade worked on deep learning and advancing and scaling deep learning without really knowing how far we could really take the technology."},{"start":971.5,"end":972.5,"text":"We invested billions."},{"start":972.5,"end":978.5,"text":"And we designed and built supercomputers to explore the limits of deep learning and AI."},{"start":978.5,"end":985.34,"text":"And in 2016, we announced DGX-1, our first AI supercomputer,"},{"start":985.34,"end":993.68,"text":"and I delivered the first one to a startup in San Francisco, a startup nobody knew anything about,"},{"start":993.68,"end":1001.3,"text":"a group of friends of mine who were working on artificial intelligence, a company called OpenAI."},{"start":1003.5,"end":1014.5,"text":"In 2022, 10 years after AlexNet, and about a million-fold increase in computing later, a million-fold."},{"start":1014.5,"end":1019.7,"text":"If you could just imagine, what would it be like if your laptop was a million-fold more capable?"},{"start":1019.7,"end":1028.5,"text":"A million-fold later, OpenAI launched ChatGPT, and AI went mainstream."},{"start":1028.5,"end":1034.54,"text":"During this decade, NVIDIA transformed ourselves from a graphics company that many of you probably first knew us as, that builds GPUs,"},{"start":1034.54,"end":1044.5,"text":"to now an AI company that builds massive data center scale supercomputers."},{"start":1044.5,"end":1047.5,"text":"We transformed our company completely."},{"start":1047.5,"end":1050.5,"text":"We also transformed computing completely."},{"start":1050.5,"end":1055.5,"text":"The fundamental way of doing computing today has been radically changed."},{"start":1055.5,"end":1072.5,"text":"The computing stack now uses GPU to process large language models that are trained on supercomputers rather than CPUs that are processing instructions written by programmers."},{"start":1072.5,"end":1075.5,"text":"We are now creating software that no humans can write."},{"start":1075.5,"end":1081.5,"text":"We are now creating software that does things that no humans can imagine, even just 10 years ago."},{"start":1081.5,"end":1088.5,"text":"Computers are now intention-driven rather than instruction-driven."},{"start":1088.5,"end":1093.5,"text":"Tell a computer what you want, and it will figure out how."},{"start":1093.5,"end":1108.5,"text":"And like humans, AI applications will understand the mission, reason, plan, and orchestrate a team of large language models to perform tasks."},{"start":1108.5,"end":1121.5,"text":"Future applications will do and perform very similar to the way we do things, assemble teams of experts, use tools, reason and plan, and execute our mission."},{"start":1121.5,"end":1126.5,"text":"Software and what software can do has been completely changed."},{"start":1126.5,"end":1136.5,"text":"Even our industry, as it's being changed and transformed, created yet another industry, an industry the world's never seen before."},{"start":1136.5,"end":1140.5,"text":"An industry is forming right in front of our eyes."},{"start":1140.5,"end":1146.5,"text":"AI's input and output are tokens."},{"start":1146.5,"end":1148.5,"text":"For all the engineers in the room, you know what I mean."},{"start":1148.5,"end":1154.5,"text":"These are floating-point numbers that embed intelligence."},{"start":1154.5,"end":1165.5,"text":"Companies are now building a new type of data center that didn't exist before that specialize in producing intelligence tokens."},{"start":1165.5,"end":1169.5,"text":"Essentially, AI factories."},{"start":1169.5,"end":1183.92,"text":"Like AC generators that Nikola Tesla invented of the past industrial revolution, we now have AI token generators,"},{"start":1183.92,"end":1187.5,"text":"and they will be the factories of a new industrial revolution."},{"start":1187.5,"end":1191.5,"text":"There's large industries producing energy, electricity."},{"start":1191.5,"end":1195.5,"text":"We now have a large industry producing something invisible called software."},{"start":1195.5,"end":1203.36,"text":"In the future, in the very near future, we'll have industries that are producing, manufacturing intelligence tokens, AI generators."},{"start":1207.5,"end":1214.06,"text":"A new computing model has emerged, and a new industry has emerged, all because we reasoned from first principles,"},{"start":1214.06,"end":1222.5,"text":"formed our belief about the future, and we acted on them."},{"start":1222.5,"end":1233.38,"text":"The next wave of AI is robotics, where AI, in addition to a language model, also has a physical world model."},{"start":1235.5,"end":1246.5,"text":"We work with hundreds of companies building robots, robotic vehicles, pick-and-place arms, humanoid robots, and even entire gigantic warehouses that are robotic."},{"start":1246.5,"end":1253.84,"text":"But unlike our AI factory strategy and our experience there, which was really formed through reasoning and deliberate action,"},{"start":1253.84,"end":1261.5,"text":"our robotics journey resulted from a series of setbacks."},{"start":1261.5,"end":1263.5,"text":"As you know, NVIDIA invented the GPU."},{"start":1263.5,"end":1267.5,"text":"This was before we invented AI factories."},{"start":1267.5,"end":1275.5,"text":"Our first great contribution to the computer industry was reinventing computer graphics through programmable shaders."},{"start":1275.5,"end":1279.5,"text":"We invented the GPU and programmable shading in 2000."},{"start":1279.5,"end":1285.26,"text":"We wanted to integrate GPUs into every computer, and so we started to combine our GPUs with motherboard chips,"},{"start":1285.26,"end":1293.5,"text":"and we launched a fabulous integrated graphics chip at the time for AMD CPUs."},{"start":1293.5,"end":1297.5,"text":"Our chipset business was an instant success."},{"start":1297.5,"end":1302.5,"text":"I think it went from zero to a billion dollars practically overnight."},{"start":1302.5,"end":1307.1,"text":"But then all of a sudden, AMD wanted to control all of the technology in the PC,"},{"start":1307.1,"end":1314.5,"text":"and we wanted to stay independent, so they purchased ATI and no longer needed us."},{"start":1314.5,"end":1321.5,"text":"We turned to Intel."},{"start":1321.5,"end":1331.5,"text":"That probably wasn't a great idea, but we turned to Intel and negotiated a license to connect to Intel CPUs."},{"start":1331.5,"end":1344.5,"text":"Apple was excited by what we were building and asked us to work on a new computer with them, which became the first MacBook Air."},{"start":1344.5,"end":1353.5,"text":"Well, Intel saw what happened and decided they didn't want us to do that anymore, and so they terminated our agreement."},{"start":1353.5,"end":1359.2,"text":"Well, we pivoted again, and this time we went and licensed ARM,"},{"start":1359.2,"end":1364.18,"text":"and we built a low-power SoC, a mobile SoC,"},{"start":1364.18,"end":1372.5,"text":"the world's first SoC that was essentially a computer, a full operating computer, and it was incredible."},{"start":1372.5,"end":1382.5,"text":"Our chip excited Google, and they asked us to work on a new device, which turned out to have been the Android mobile device."},{"start":1382.5,"end":1388.38,"text":"Well, Qualcomm decided they didn't want us to do that,"},{"start":1388.38,"end":1391.38,"text":"and so they didn't want us to connect to their modems,"},{"start":1391.38,"end":1394.5,"text":"and it's hard to build a mobile device without being connected to a modem."},{"start":1394.5,"end":1401.5,"text":"And there were no other LTE modem companies, so we had to exit the mobile device market."},{"start":1401.5,"end":1409.1,"text":"Well, this happened practically on a year rhythm, and we would build something, it would be incredibly successful,"},{"start":1409.1,"end":1416.5,"text":"generate enormous amounts of excitement, and then one year later, we were kicked out of those markets."},{"start":1416.5,"end":1420.98,"text":"Well, with no more markets to turn to,"},{"start":1420.98,"end":1426.86,"text":"we decided to build something where we are sure there are no customers,"},{"start":1431.12,"end":1438.46,"text":"because one of the things you can definitely guarantee is where there are no customers,"},{"start":1438.46,"end":1442.5,"text":"there are also no competitors, and nobody cares about you."},{"start":1442.5,"end":1451.5,"text":"And so we chose a market with no customers, a $0 billion market, and it was robotics."},{"start":1451.5,"end":1459.5,"text":"We built the world's first robotics computer processing an algorithm nobody understood at the time called deep learning."},{"start":1459.5,"end":1462.5,"text":"This is over 10 years ago now."},{"start":1462.5,"end":1470.5,"text":"Ten years later, I can't be happier with what we've built and the opportunity to create the next wave of AI."},{"start":1470.5,"end":1476.5,"text":"More importantly, we developed agility and a culture of resilience."},{"start":1476.5,"end":1482.5,"text":"One setback after another, we shook it off and skated to the next opportunity."},{"start":1482.5,"end":1487.5,"text":"Each time, we gained skills and strengthened our character."},{"start":1487.5,"end":1490.5,"text":"We strengthened our corporate character."},{"start":1490.5,"end":1502.5,"text":"Our company is really hard to distract and really hard to discourage, and no setback that comes our way doesn't look like an opportunity these days."},{"start":1502.5,"end":1512.5,"text":"Ironically, the robotics computer that we built today doesn't even need graphics, which is why our journey started in the first place."},{"start":1512.5,"end":1517.5,"text":"So where we are today tells us something and teaches us something."},{"start":1517.5,"end":1526.5,"text":"The world is uncertain, as Richard Feynman would say, and the world can be unfair and deal you with tough cards."},{"start":1526.5,"end":1529.68,"text":"Swiftly, shake it off."},{"start":1547.5,"end":1553.5,"text":"You've apparently been paying too much attention to your books."},{"start":1553.5,"end":1554.5,"text":"Swiftly, shake it off."},{"start":1554.5,"end":1556.5,"text":"Come on, that's pretty clever."},{"start":1556.5,"end":1564.5,"text":"I made myself laugh."},{"start":1564.5,"end":1569.5,"text":"There's another opportunity out there, or create one."},{"start":1569.5,"end":1571.5,"text":"Let me tell you one more story."},{"start":1571.5,"end":1578.5,"text":"I used to work from one of our international sites for one month each summer."},{"start":1578.5,"end":1582.5,"text":"When our kids were in their teens, we spent a summer in Japan."},{"start":1582.5,"end":1586.5,"text":"For a weekend, we visited Kyoto and the Silver Temple."},{"start":1586.5,"end":1589.5,"text":"If you haven't had a chance to go, you must."},{"start":1589.5,"end":1592.5,"text":"It's renowned for its exquisite moss garden."},{"start":1592.5,"end":1601.5,"text":"The day we visited was quintessential Kyoto summer day, suffocatingly hot and humid, sticky."},{"start":1601.5,"end":1605.5,"text":"Heat is radiating from the ground."},{"start":1605.5,"end":1609.5,"text":"The air was thick, still."},{"start":1609.5,"end":1614.5,"text":"Along with the other tourists, we wandered through the meticulously groomed moss garden."},{"start":1614.5,"end":1618.5,"text":"And I noticed the lone gardener."},{"start":1618.5,"end":1623.5,"text":"Now, remember, the moss garden, this is the Silver Temple, the moss garden is gigantic."},{"start":1623.5,"end":1625.5,"text":"It's about the size of this courtyard."},{"start":1625.5,"end":1632.5,"text":"And it has the collection, the largest collection of just about apparently every species of moss in the world."},{"start":1632.5,"end":1636.5,"text":"And it's just exquisitely maintained."},{"start":1636.5,"end":1651.5,"text":"I noticed the lone gardener squatting, carefully picking at the moss with a bamboo tweezer and putting it in the bamboo basket."},{"start":1651.5,"end":1663.5,"text":"And you have to, it's a bamboo tweezer, you know, and it's just this one gardener."},{"start":1663.5,"end":1666.5,"text":"And the basket looked empty."},{"start":1666.5,"end":1677.5,"text":"Well, for a moment there, I thought he was picking imaginary moss into a pile of imaginary dead moss."},{"start":1677.5,"end":1682.32,"text":"And so I walked up to him and I said, what are you doing?"},{"start":1682.32,"end":1686.5,"text":"And in his English, he said, I'm picking dead moss."},{"start":1686.5,"end":1688.5,"text":"I'm taking care of my garden."},{"start":1688.5,"end":1694.5,"text":"And I said, but your garden is so big."},{"start":1694.5,"end":1700.5,"text":"And he responded, I have cared for my garden for 25 years."},{"start":1700.5,"end":1703.5,"text":"I have plenty of time."},{"start":1703.5,"end":1710.5,"text":"Well, that was one of the most profound learnings in my life."},{"start":1710.5,"end":1714.5,"text":"And it really taught me something."},{"start":1714.5,"end":1720.5,"text":"This gardener has dedicated himself to his craft and doing his life's work."},{"start":1720.5,"end":1724.5,"text":"And when you do that, you have plenty of time."},{"start":1724.5,"end":1733.5,"text":"I begin each morning, I do every single morning exactly the same way, I begin each morning by doing my highest priority work first."},{"start":1733.5,"end":1738.5,"text":"I have a very clear priority list and I start from the highest priority work first."},{"start":1738.5,"end":1744.5,"text":"Before I even get to work, my day is already a success."},{"start":1744.5,"end":1751.5,"text":"I've already completed my most important work and can dedicate my day to helping others."},{"start":1751.5,"end":1760.5,"text":"And when people apologize for interrupting me, I always say I have plenty of time and I do."},{"start":1760.5,"end":1771.5,"text":"Graduates of the class of 2024, I can hardly imagine anyone more prepared for the future than you."},{"start":1771.5,"end":1781.5,"text":"You dedicated yourself, you worked hard, you earned a world-class education from one of the most prestigious schools in the world."},{"start":1781.5,"end":1791.5,"text":"And as you commence into the next stage, take my learnings and hopefully they'll help you along the way."},{"start":1791.5,"end":1802.5,"text":"I hope you believe in something, something unconventional, something unexplored, but let it be informed and let it be reasoned."},{"start":1802.5,"end":1805.5,"text":"Then dedicate yourself to making it happen."},{"start":1805.5,"end":1814.5,"text":"You may find your GPU, you may find your CUDA, you may find your generative AI, you may find your NVIDIA."},{"start":1814.5,"end":1818.5,"text":"I hope you will see setbacks as new opportunities."},{"start":1818.5,"end":1827.5,"text":"Your pain and suffering will strengthen your character, your resilience and agility, and they are the ultimate superpowers."},{"start":1827.5,"end":1836.5,"text":"Of all of the things that I value most about my abilities, intelligence is not top of that list."},{"start":1836.5,"end":1845.52,"text":"My ability to endure pain and suffering, my ability to work on something for a very, very long period of time,"},{"start":1845.52,"end":1851.26,"text":"my ability to handle setbacks and see the opportunity just around the corner I consider to be my superpowers,"},{"start":1851.26,"end":1853.5,"text":"and I hope they're yours."},{"start":1853.5,"end":1865.5,"text":"And I hope you find a craft."},{"start":1865.5,"end":1868.5,"text":"I hope you find a craft."},{"start":1868.5,"end":1871.99,"text":"It's not important to decide on day one,"},{"start":1871.99,"end":1878.97,"text":"it's not even important to decide any time soon, but I hope you do find a craft,"},{"start":1878.97,"end":1884.24,"text":"that you want to dedicate your lifetime to perfecting, to hone the skills of,"},{"start":1884.24,"end":1887.5,"text":"and let it be your life's work."},{"start":1887.5,"end":1891.5,"text":"And then lastly, prioritize your life."},{"start":1891.5,"end":1895.23,"text":"There's so many things going on, there's so many things to do,"},{"start":1895.23,"end":1899.5,"text":"but prioritize your life and you will have plenty of time to do the important things."},{"start":1899.5,"end":1903.86,"text":"Congratulations, class of 2024, go get them."}];

// === Helpers ===
function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function escapeHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escapeRegExp(t) {
  return String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function decodeHtmlEntities(t) {
  const textarea = document.createElement('textarea');
  textarea.innerHTML = t;
  return textarea.value;
}

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function getLocalDateKey() {
  const now = new Date();
  return [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, '0'),
    String(now.getDate()).padStart(2, '0')
  ].join('-');
}

function getTodayRounds() {
  try {
    const stored = JSON.parse(localStorage.getItem(EASY_ROUNDS_KEY) || '{}');
    return stored.date === getLocalDateKey() ? Number(stored.count) || 0 : 0;
  } catch {
    return 0;
  }
}

function addTodayRound() {
  const count = getTodayRounds() + 1;
  localStorage.setItem(EASY_ROUNDS_KEY, JSON.stringify({
    date: getLocalDateKey(),
    count
  }));
  return count;
}

function findEasyFocusIndex(fromIndex, direction = 1) {
  if (!SEGMENTS.length) return -1;
  const start = Number.isFinite(fromIndex) ? fromIndex : -1;

  for (let step = 1; step <= SEGMENTS.length; step += 1) {
    const index = (start + step * direction + SEGMENTS.length) % SEGMENTS.length;
    const seg = SEGMENTS[index];
    const duration = seg.end - seg.start;
    if (duration >= 1.5 && duration <= 18 && seg.text.trim().length >= 8) return index;
  }

  return clamp(start + direction, 0, SEGMENTS.length - 1);
}

    const target = start + SECTION_TARGET_SECONDS;
    const breakpoint = findSectionBreak(start, target, end);
    if (!Number.isFinite(breakpoint) || breakpoint <= start || end - breakpoint < MIN_FINAL_SECTION_SECONDS) break;

    sections.push({ start, end: breakpoint });
    start = breakpoint;
  }

  sections.push({ start, end });
  return sections;
}

function isCompleteSentenceEnd(text) {
  const cleaned = String(text || '').trim().replace(/["')\]]+$/g, '');
  return /[.!?]$/.test(cleaned);
}

function findSectionBreak(start, target, lessonEnd) {
  const latestBreak = lessonEnd - MIN_FINAL_SECTION_SECONDS;
  const minBreak = start + Math.min(SECTION_TARGET_SECONDS * 0.55, Math.max(60, target - start));
  const candidates = SEGMENTS
    .filter((seg) => seg.end > minBreak && seg.end < latestBreak && isCompleteSentenceEnd(seg.text))
    .sort((a, b) => Math.abs(a.end - target) - Math.abs(b.end - target) || a.end - b.end);

  if (candidates.length) return candidates[0].end;

  const fallback = SEGMENTS.find((seg) => seg.end >= target && seg.end < latestBreak);
  return fallback ? fallback.end : NaN;
}

function isSegmentInSection(seg, section) {
  return !!seg && !!section && seg.end > section.start && seg.start < section.end;
}

function getSectionIndexForTime(time) {
  if (!lessonSections.length) return 0;
  const index = lessonSections.findIndex((section, i) => {
    const isLast = i === lessonSections.length - 1;
    return time >= section.start && (time < section.end || isLast);
  });
  return index >= 0 ? index : lessonSections.length - 1;
}

function getSectionIndexForSegment(index) {
  const seg = SEGMENTS[index];
  if (!seg || !lessonSections.length) return currentSectionIndex;
  return getSectionIndexForTime(seg.start);
}

function getFirstSegmentInSection(section) {
  return SEGMENTS.findIndex((seg) => isSegmentInSection(seg, section));
}

function clearLoop() {
  loopSegIndex = -1;
  loopIndicator.classList.remove('active');
  document.querySelectorAll('.seg').forEach(s => s.style.outline = '');
}

function renderSectionNav() {
  const total = lessonSections.length || 1;
  const section = lessonSections[currentSectionIndex] || { start: 0, end: getLessonEndTime() };
  sectionTitle.textContent = `第 ${currentSectionIndex + 1}/${total} 段`;
  sectionRange.textContent = `${formatTime(section.start)} - ${formatTime(section.end)}`;
  prevSection.disabled = currentSectionIndex <= 0;
  nextSection.disabled = currentSectionIndex >= total - 1;

  sectionChips.innerHTML = '';
  lessonSections.forEach((item, index) => {
    const button = document.createElement('button');
    button.className = 'section-chip' + (index === currentSectionIndex ? ' active' : '');
    button.type = 'button';
    button.textContent = index + 1;
    button.title = `第 ${index + 1} 段 ${formatTime(item.start)} - ${formatTime(item.end)}`;
    button.setAttribute('aria-label', button.title);
    button.addEventListener('click', () => setCurrentSection(index, { seek: true }));
    sectionChips.appendChild(button);
  });
}

function applySectionFilter() {
  const section = lessonSections[currentSectionIndex];
  if (!section) return;

  subtitlePanel.querySelectorAll('.seg').forEach((el) => {
    const index = Number(el.dataset.index);
    el.classList.toggle('is-outside-section', !isSegmentInSection(SEGMENTS[index], section));
  });
  renderSectionNav();
}

function setCurrentSection(index, options = {}) {
  if (!lessonSections.length) return;
  const next = clamp(Math.round(index), 0, lessonSections.length - 1);
  currentSectionIndex = next;
  applySectionFilter();

  const section = lessonSections[currentSectionIndex];
  if (loopSegIndex >= 0 && !isSegmentInSection(SEGMENTS[loopSegIndex], section)) {
    clearLoop();
  }

  if (options.seek) {
    const firstIndex = getFirstSegmentInSection(section);
    audio.currentTime = firstIndex >= 0 ? Math.max(SEGMENTS[firstIndex].start, section.start) : section.start;
    updateActiveSeg();
    if (firstIndex >= 0) scrollToSeg(firstIndex);
  }
}

function rebuildLessonSections(duration) {
  lessonSections = buildLessonSections(duration);
  currentSectionIndex = clamp(currentSectionIndex, 0, lessonSections.length - 1);
  applySectionFilter();
}

function ensureSectionForSegment(index) {
  const seg = SEGMENTS[index];
  const section = lessonSections[currentSectionIndex];
  if (!seg || !section || isSegmentInSection(seg, section)) return;
  setCurrentSection(getSectionIndexForSegment(index));
}

function syncSectionToTime(time) {
  const next = getSectionIndexForTime(time);
  if (next !== currentSectionIndex) {
    setCurrentSection(next);
  }
}

function getTrackDuration(track) {
  const end = (track.segments || []).reduce((max, seg) => Math.max(max, seg.end), 0);
  return track.duration || end;
}

function renderTrackTabs() {
  trackTabs.innerHTML = '';
  TRACKS.forEach((track, index) => {

}

function updateTrackHeader() {

function switchTrack(index) {
  if (index === currentTrackIndex || !TRACKS[index]) return;

  clearLoop();
  wordPopup.classList.remove('show');
  audio.pause();

  currentTrackIndex = index;
  currentTrack = TRACKS[currentTrackIndex];

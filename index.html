<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 Jensen Huang - Caltech 2024 Commencement Speech | English Learning</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg-primary: #0f0f14;
    --bg-secondary: #1a1a24;
    --bg-card: #22222e;
    --bg-hover: #2a2a38;
    --text-primary: #e8e8ef;
    --text-secondary: #9898a8;
    --text-dim: #68688a;
    --accent: #76b900;
    --accent-glow: rgba(118, 185, 0, 0.3);
    --accent-dim: rgba(118, 185, 0, 0.12);
    --highlight: #fbbf24;
    --highlight-bg: rgba(251, 191, 36, 0.12);
    --border: rgba(255,255,255,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
  }

  /* === Layout === */
  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* === Header === */
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header .logo {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #000;
    flex-shrink: 0;
  }
  .header .title-group h1 {
    font-size: 16px; font-weight: 600; line-height: 1.3;
  }
  .header .title-group p {
    font-size: 12px; color: var(--text-secondary); margin-top: 2px;
  }
  .header .stats {
    margin-left: auto;
    display: flex; gap: 16px; font-size: 12px; color: var(--text-dim);
  }
  .header .stats span { display: flex; align-items: center; gap: 4px; }

  /* === Main Content === */
  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
  }

  /* === Subtitle Panel === */
  .subtitle-panel {
    overflow-y: auto;
    padding: 20px 24px;
    scroll-behavior: smooth;
    min-width: 0;
  }
  .subtitle-panel::-webkit-scrollbar { width: 4px; }
  .subtitle-panel::-webkit-scrollbar-track { background: transparent; }
  .subtitle-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .seg {
    padding: 12px 136px 12px 16px;
    margin-bottom: 4px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    border-left: 3px solid transparent;
    position: relative;
  }
  .seg:hover {
    background: var(--bg-hover);
  }
  .seg.active {
    background: var(--accent-dim);
    border-left-color: var(--accent);
  }
  .seg.active .seg-text {
    color: #fff;
  }
  .seg .seg-time {
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .seg.active .seg-time {
    color: var(--accent);
  }
  .seg .seg-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-secondary);
    transition: color 0.25s;
  }
  .dictation-prompt {
    display: none;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
  }
  body.dictation-mode .seg:not(.is-revealed) .seg-text {
    display: none;
  }
  body.dictation-mode .seg:not(.is-revealed) .dictation-prompt {
    display: block;
  }
  body.dictation-mode .seg:not(.is-revealed) {
    background-image: linear-gradient(90deg, rgba(118,185,0,0.08), transparent 55%);
  }

  /* Vocab highlight in subtitle */
  .vocab-word {
    color: var(--highlight);
    background: var(--highlight-bg);
    padding: 1px 4px;
    border-radius: 4px;
    cursor: help;
    position: relative;
    font-weight: 500;
    transition: all 0.2s;
  }
  .vocab-word:hover {
    background: rgba(251, 191, 36, 0.25);
  }

  /* Tooltip */
  .vocab-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #2d2d3a;
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .vocab-tip .tip-word { color: var(--highlight); font-weight: 600; }
  .vocab-tip .tip-phonetic { color: var(--text-dim); font-size: 11px; margin-left: 6px; }
  .vocab-tip .tip-meaning { color: var(--text-primary); margin-top: 4px; font-family: 'Noto Sans SC', sans-serif; }
  .vocab-word:hover .vocab-tip { display: block; }

  /* === Vocabulary Sidebar === */
  .vocab-sidebar {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .vocab-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .vocab-header .badge {
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .vocab-search {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .vocab-search input {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .vocab-search input:focus {
    border-color: var(--accent);
  }
  .vocab-search input::placeholder {
    color: var(--text-dim);
  }
  .vocab-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 12px;
  }
  .vocab-list::-webkit-scrollbar { width: 4px; }
  .vocab-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .vocab-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    border-bottom: 1px solid var(--border);
  }
  .vocab-item:last-child { border-bottom: none; }
  .vocab-item:hover { background: var(--bg-hover); }
  .vocab-item.active { background: var(--highlight-bg); }
  .vocab-item .vi-word {
    font-size: 14px;
    font-weight: 600;
    color: var(--highlight);
  }
  .vocab-item .vi-phonetic {
    font-size: 11px;
    color: var(--text-dim);
    margin-left: 6px;
  }
  .vocab-item .vi-meaning {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .vocab-item .vi-delete {
    float: right;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    padding: 0 2px;
  }
  .vocab-item:hover .vi-delete { opacity: 0.7; }
  .vocab-item .vi-delete:hover { opacity: 1; color: #f87171; }

  /* Vocab tabs */
  .vocab-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .vocab-tab {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .vocab-tab:hover { color: var(--text-secondary); }
  .vocab-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .vocab-tab .tab-badge {
    font-size: 11px;
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .vocab-tab.active .tab-badge {
    background: var(--accent-dim);
    color: var(--accent);
  }

  /* Notebook actions bar */
  .notebook-actions {
    display: none;
    padding: 8px 12px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .notebook-actions.show { display: flex; }
  .nb-action-btn {
    flex: 1;
    padding: 6px 0;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .nb-action-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .nb-action-btn.danger:hover {
    border-color: #f87171;
    color: #f87171;
  }

  /* === Player Bar === */
  .player-bar {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .progress-row .time-label {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    min-width: 48px;
    text-align: center;
  }
  .progress-bar-container {
    flex: 1;
    min-width: 0;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    transition: height 0.15s;
    touch-action: none;
  }
  .progress-bar-container:hover { height: 10px; }
  .progress-bar-container.dragging { height: 10px; }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    position: relative;
    transition: width 0.1s linear;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .progress-bar-container:hover .progress-bar-fill::after {
    opacity: 1;
  }
  .progress-bar-container.dragging .progress-bar-fill::after {
    opacity: 1;
  }
  .controls-row {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    min-width: 0;
  }
  .btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    font-size: 18px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
  }
  .btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .btn-play {
    background: var(--accent);
    color: #000;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 20px;
  }
  .btn-play:hover { background: #8ad400; color: #000; transform: scale(1.05); }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
  }
  .speed-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .speed-btn:hover, .speed-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
  }
  .volume-slider {
    -webkit-appearance: none;
    width: 80px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }

  /* === Responsive === */
  @media (max-width: 900px) {
    .main { grid-template-columns: minmax(0, 1fr); width: 100%; }
    .vocab-sidebar { display: none; }
  }

  /* === Toggle sidebar for mobile === */
  .vocab-toggle {
    display: none;
    position: fixed;
    bottom: 100px;
    right: 16px;
    width: 48px;
    height: 48px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow);
    z-index: 50;
  }
  @media (max-width: 900px) {
    .vocab-toggle { display: flex; align-items: center; justify-content: center; }
    .vocab-sidebar.show {
      display: flex;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 320px;
      background: var(--bg-secondary);
      z-index: 100;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
  }

  /* Loading overlay */
  .loading {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  .loading.hidden { display: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Subtitle tools */
  .subtitle-tools {
    position: absolute;
    top: 12px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
    z-index: 10;
  }
  .autoscroll-toggle,
  .dictation-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .autoscroll-toggle input,
  .dictation-toggle input { accent-color: var(--accent); }

  .subtitle-wrapper {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  /* Loop mode indicator */
  .loop-indicator {
    font-size: 11px;
    color: var(--accent);
    margin-left: 8px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .loop-indicator.active { opacity: 1; }

  /* Sentence action buttons */
  .seg-actions {
    position: absolute;
    right: 8px;
    top: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .seg-action {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .seg-reveal {
    display: none;
  }
  body.dictation-mode .seg-reveal {
    display: inline-flex;
  }
  .seg:hover .seg-action,
  .seg:focus-within .seg-action {
    opacity: 0.6;
  }
  body.dictation-mode .seg-action {
    opacity: 0.72;
  }
  .seg-action:hover { opacity: 1 !important; color: var(--accent); background: rgba(255,255,255,0.06); }
  .seg-action.is-active {
    opacity: 1;
    color: var(--accent);
  }
  .seg-action:disabled {
    cursor: wait;
    opacity: 0.7;
  }
  .seg-translation {
    margin-top: 8px;
    padding-left: 10px;
    border-left: 2px solid var(--accent);
    color: var(--text-primary);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    line-height: 1.65;
  }
  .seg-translation[hidden] { display: none; }
  .seg-translation.is-loading,
  .seg-translation.is-error {
    color: var(--text-dim);
  }
  .sentence-card .sentence-time {
    color: var(--accent);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .sentence-card .sentence-text {
    color: var(--text-primary);
    font-size: 13px;
    line-height: 1.55;
    margin-top: 5px;
  }
  .sentence-card .sentence-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  /* === Click-to-lookup popup === */
  .word-clickable {
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, color 0.15s;
  }
  .word-clickable:hover {
    background: rgba(255,255,255,0.08);
  }
  .word-clickable.looked-up {
    color: #60a5fa;
    text-decoration-color: rgba(96,165,250,0.3);
  }

  #wordPopup {
    display: none;
    position: fixed;
    z-index: 200;
    background: #1e1e2e;
    border: 1px solid rgba(118,185,0,0.4);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 280px;
    max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    font-size: 14px;
    animation: popIn 0.15s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  #wordPopup.show { display: block; }
  #wordPopup .popup-close {
    position: absolute;
    top: 8px; right: 12px;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }
  #wordPopup .popup-close:hover { color: #fff; }
  #wordPopup .popup-word {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  #wordPopup .popup-phonetic {
    font-size: 14px;
    color: var(--accent);
    margin-left: 8px;
    font-weight: 400;
  }
  #wordPopup .popup-speak {
    background: none; border: none;
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    margin-left: 6px;
    vertical-align: middle;
  }
  #wordPopup .popup-speak:hover { color: #8ad400; }
  #wordPopup .popup-divider {
    height: 1px;
    background: var(--border);
    margin: 10px 0;
  }
  #wordPopup .popup-meaning {
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--highlight);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
  }
  #wordPopup .popup-en-def {
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.6;
    margin-top: 6px;
  }
  #wordPopup .popup-en-def .def-pos {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
    margin-right: 4px;
  }
  #wordPopup .popup-loading {
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #wordPopup .popup-loading .mini-spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  #wordPopup .popup-source {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
  }
  #wordPopup .popup-source.is-vocab {
    color: var(--highlight);
  }
  #wordPopup .popup-add-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: none;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
  }
  #wordPopup .popup-add-btn:hover {
    background: var(--accent);
    color: #000;
  }
  #wordPopup .popup-add-btn.added {
    border-color: var(--text-dim);
    color: var(--text-dim);
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div style="color: var(--text-dim); font-size: 14px;">Loading audio...</div>
</div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">E</div>
    <div class="title-group">
      <h1>Jensen Huang — Caltech Commencement 2024</h1>
      <p>🎓 English Learning · Scroll Subtitles with Vocabulary</p>
    </div>
    <div class="stats">
      <span>📖 <span id="vocabCount">0</span> words</span>
      <span>⏱ <span id="durationStat">--:--</span></span>
    </div>

<script>
// === Data ===
const SEGMENTS = [{"start":8.0,"end":13.0,"text":"It really makes me cringe listening to all that."},{"start":13.0,"end":19.0,"text":"Thank you for that kind introduction, but I hate hearing about myself."},{"start":19.0,"end":26.0,"text":"And just as a show, well, maybe if you could just applaud."},{"start":26.0,"end":33.6,"text":"How many of you know who NVIDIA is?"},{"start":33.6,"end":36.76,"text":"And how many of you know what a GPU is?"},{"start":42.2,"end":46.0,"text":"Okay, good, I don't have to change my speech."},{"start":46.0,"end":54.14,"text":"Ladies and gentlemen, President Rosenbaum, esteemed faculty members, distinguished guests, proud parents, and above all,"},{"start":54.14,"end":60.88,"text":"the 2024 graduating class of Caltech."},{"start":68.0,"end":70.0,"text":"This is a really happy day for you guys."},{"start":70.0,"end":71.0,"text":"You got to look more excited."},{"start":71.0,"end":74.0,"text":"You know you're graduating from Caltech."},{"start":74.0,"end":87.0,"text":"This is the school of the great Richard Feynman, Linus Pauling, and someone who's very influential to me and our industry, Carver Mead."},{"start":87.0,"end":88.5,"text":"Yeah, this is a very big deal."},{"start":93.0,"end":95.0,"text":"Today is a day of immense pride and joy."},{"start":95.0,"end":102.78,"text":"It is a dream come true for all of you,"},{"start":102.78,"end":107.0,"text":"but not just for you because your parents and families have made countless sacrifices to see you reach this milestone."},{"start":107.0,"end":114.92,"text":"So let's take this moment and congratulate them, thank them, and let them know you love them."},{"start":124.0,"end":134.0,"text":"You don't want to forget that because you don't know how long you're going to be living at home."},{"start":134.0,"end":136.14,"text":"You want to be super grateful today."},{"start":139.0,"end":145.94,"text":"As a proud parent, I really loved it when my kids didn't move out,"},{"start":145.94,"end":149.0,"text":"and it was great to see them every day, but now they've moved out, it makes me sad."},{"start":149.0,"end":151.0,"text":"So hopefully you guys get to spend some time with your parents."},{"start":151.0,"end":161.0,"text":"Your journey here is a testament of your character, determination, willingness to make sacrifices for your dreams, and you should be proud."},{"start":161.0,"end":168.64,"text":"The ability to make sacrifices, endure pain and suffering, you will need these qualities in life."},{"start":171.0,"end":175.0,"text":"You and I share some things in common."},{"start":175.0,"end":181.3,"text":"First, both chief scientists of NVIDIA were from Caltech."},{"start":187.0,"end":196.0,"text":"And one of the reasons why I'm giving this speech today is because I'm recruiting."},{"start":196.0,"end":210.0,"text":"And so I want to tell you that NVIDIA is a really great company, I'm a very nice boss, universally loved, come work at NVIDIA."},{"start":210.0,"end":214.44,"text":"You and I share a passion for science and engineering, and although we're separated by about 40 years,"},{"start":214.44,"end":227.0,"text":"we are both at the peaks of our career."},{"start":227.0,"end":232.0,"text":"For all of you who have been paying attention to NVIDIA and myself, you know what I mean."},{"start":232.0,"end":239.0,"text":"It's just that in your case, you'll have many, many more peaks to go."},{"start":239.0,"end":243.0,"text":"I just hope that today is not my peak."},{"start":243.0,"end":245.0,"text":"Not the peak."},{"start":245.0,"end":251.0,"text":"And so I'm working as hard as ever to make sure that I have many, many more peaks ahead."},{"start":251.0,"end":256.88,"text":"Last year, I was honored to give the commencement address at Taiwan University,"},{"start":256.88,"end":263.0,"text":"and I shared several stories about NVIDIA's journey and the lessons that we learned that might be valuable for graduates."},{"start":263.0,"end":274.0,"text":"I have to admit that I don't love giving advice, especially to other people's children."},{"start":274.0,"end":286.68,"text":"And so my advice today will largely be disguised in some stories that I've enjoyed, and some life experiences that I've enjoyed."},{"start":291.0,"end":294.9,"text":"I'm the longest running tech CEO in the world today, I believe."},{"start":302.0,"end":309.0,"text":"Over the course of 31 years, I managed not to go out of business, not get bored, and not get fired."},{"start":309.0,"end":321.0,"text":"And so I have the great privilege of enjoying a lot of life's experiences, starting from creating NVIDIA, from nothing to what it is today."},{"start":321.0,"end":326.0,"text":"And so I spoke about the long road of creating CUDA, a programming model."},{"start":326.0,"end":334.0,"text":"The programming model that we dedicated over 20 years to invent, and that is revolutionizing computing today."},{"start":334.0,"end":341.44,"text":"I spoke about a very, quite public, canceled Sega game console project we worked on,"},{"start":345.3,"end":350.7,"text":"and where intellectual honesty, something that I know Richard Feynman cares very deeply about and spoke quite often about,"},{"start":350.7,"end":354.0,"text":"where intellectual honesty and humility saved our company."},{"start":354.0,"end":361.0,"text":"And how a retreat, a strategic retreat, was one of our best strategies."},{"start":361.0,"end":369.0,"text":"All of these are counterintuitive lessons that I spoke about at the commencement."},{"start":369.0,"end":378.0,"text":"But I encouraged the graduates to engage with AI, the most consequential technology of our time."},{"start":378.0,"end":384.0,"text":"And I'll speak a little bit more about that later, but all of you know about AI."},{"start":384.0,"end":389.0,"text":"It's hard not to be immersed in it and surrounded by it, and a great deal of discussion about it."},{"start":389.0,"end":401.0,"text":"And of course, I hope that all of you are using it and playing with it, with surprising results and some magical, some disappointing, and some surprising."},{"start":401.0,"end":405.0,"text":"But you have to enjoy it, you have to engage it, because it's advancing so quickly."},{"start":405.0,"end":412.0,"text":"It is the only technology that I've known that is advancing on multiple exponentials at the same time."},{"start":412.0,"end":415.0,"text":"And so the technology is changing very, very quickly."},{"start":415.0,"end":425.66,"text":"So I advised the students at the Taiwan University to run, don't walk, and engage the AI revolution."},{"start":428.0,"end":431.0,"text":"And yet, one year later, it's incredible how much it's changed."},{"start":431.0,"end":439.6,"text":"And so today, what I wanted to do is share with you my perspective, from my vantage point,"},{"start":439.6,"end":444.0,"text":"of some of the important things that are happening that you're graduating into."},{"start":444.0,"end":451.52,"text":"And these are extraordinary things that are happening that you should have an intuitive understanding for,"},{"start":451.52,"end":455.0,"text":"because it's going to matter to you, it's going to matter to the industry."},{"start":455.0,"end":460.0,"text":"And hopefully, you take advantage of the opportunity ahead of you."},{"start":460.0,"end":466.0,"text":"The computer industry is transforming from its foundations, literally from studs."},{"start":466.0,"end":468.0,"text":"Everything is changing from studs on up."},{"start":468.0,"end":474.0,"text":"And across every layer, and soon, every industry will also be transformed."},{"start":474.0,"end":480.0,"text":"And the reason for that is quite obvious, because computers today are the single most important instrument of knowledge."},{"start":480.0,"end":484.0,"text":"And it's foundational to every single industry and every field of science."},{"start":484.0,"end":491.0,"text":"If we are transforming the computer so profoundly, it will, of course, have implications in every industry."},{"start":491.0,"end":494.0,"text":"And I'll talk about that in just a little bit."},{"start":494.0,"end":498.0,"text":"And as you enter industry, it's important you know what's happening."},{"start":498.0,"end":504.0,"text":"Modern computing traces back to the IBM System 360."},{"start":504.0,"end":507.0,"text":"That was the architecture manual that I learned from."},{"start":507.0,"end":509.0,"text":"It's an architecture manual that you don't need to learn from."},{"start":509.0,"end":518.0,"text":"A lot better documentation and better descriptions of computers and architecture has been presented since."},{"start":518.0,"end":525.42,"text":"But the System 360 was incredibly important at its time, and in fact,"},{"start":525.42,"end":535.56,"text":"the basic ideas of the System 360, the architecture of it,"},{"start":535.56,"end":540.0,"text":"the principal ideas and architecture and strategy of the System 360 are still governing the computer industry today."},{"start":540.0,"end":544.0,"text":"And it was introduced a year after my birth."},{"start":544.0,"end":557.0,"text":"In the 80s, I was among the first generation of VLSI engineers who learned to design chips from Mead and Conway's landmark textbook."},{"start":557.0,"end":559.0,"text":"And I'm not sure if it's still being taught here."},{"start":559.0,"end":562.0,"text":"It should be in the introduction of VLSI systems."},{"start":562.0,"end":571.0,"text":"Based on Carver Mead's pioneering work here at Caltech on chip design methodologies and textbook that revolutionized IC design."},{"start":571.0,"end":578.0,"text":"And it enabled our generation to design supergiant chips and ultimately the CPU."},{"start":578.0,"end":582.0,"text":"The CPU led to exponential growth in computing."},{"start":582.0,"end":592.0,"text":"The performance, the incredible technology advances, that's called Moore's Law, fueled the information technology revolution."},{"start":592.0,"end":603.0,"text":"The industrial revolution that we are part of, that my generation was part of, saw the mass production of something the world had never seen before."},{"start":603.0,"end":609.0,"text":"The mass production of something that was invisible, easy to copy, the mass production of software."},{"start":609.0,"end":613.0,"text":"And it led to a $3 trillion industry."},{"start":613.0,"end":619.0,"text":"When I sat where you sat, the IT industry was minuscule."},{"start":619.0,"end":625.0,"text":"And the concept that you could make money selling software was a fantasy."},{"start":625.0,"end":636.0,"text":"And yet today, it's one of the most important commodities, most important technologies and product creations that our industry produces."},{"start":636.0,"end":646.0,"text":"However, the limits of the NARD scaling, of transistor scaling, and instruction level parallelism have slowed CPU performance."},{"start":646.0,"end":655.0,"text":"And the slowed CPU performance gains is happening at a time when computing demand continues to grow exponentially."},{"start":655.0,"end":670.16,"text":"This exponentially growing gap between demand of computing and the capabilities of computers, if not addressed,"},{"start":670.16,"end":675.0,"text":"computing energy consumption and cost, inflation, would eventually stifle every industry."},{"start":675.0,"end":680.0,"text":"We see very clear signs of computing inflation as we speak."},{"start":680.0,"end":688.0,"text":"And after two decades of advancing NVIDIA's CUDA, NVIDIA's accelerated computing offers a path forward."},{"start":688.0,"end":690.0,"text":"That's the reason why I'm here."},{"start":690.0,"end":705.0,"text":"Because finally, the industry realized of the incredible effectiveness of accelerated computing at precisely the time that we're witnessing computing inflation after several decades."},{"start":705.0,"end":718.5,"text":"By offloading time-consuming algorithms to a GPU that specializes in parallel processing, we routinely achieve 10, 100,"},{"start":718.5,"end":723.0,"text":"sometimes 1,000-fold speedups, saving money, cost, and energy."},{"start":723.0,"end":733.28,"text":"We now accelerate application domains from computer graphics, ray tracing, of course, to gene sequencing, scientific computing, astronomy, quantum circuit simulations,"},{"start":733.28,"end":738.0,"text":"SQL data processing, and even pandas, data science."},{"start":738.0,"end":741.0,"text":"Accelerated computing has reached a tipping point."},{"start":741.0,"end":746.88,"text":"That is our first great contribution to the computer industry, our first great contribution to society, accelerated computing."},{"start":751.0,"end":761.0,"text":"It now gives us a path forward for sustainable computing where cost will continue to decline as computing requirement continues to grow."},{"start":761.0,"end":777.0,"text":"A hundred-fold, a hundred-fold of anything in time or cost or energy savings that accelerated computing opened surely would trigger a new development somewhere else."},{"start":777.0,"end":785.0,"text":"We just didn't know what it was until deep learning came to our consciousness."},{"start":785.0,"end":787.0,"text":"A whole new world of computing emerged."},{"start":787.0,"end":801.0,"text":"Jeff Hinton, Alex Krzyzewski, and Ilya Sutskever used NVIDIA CUDA GPUs to train AlexNet and shocked the computer vision community by winning the 2012 ImageNet Challenge."},{"start":801.0,"end":812.0,"text":"This was the big moment, the big bang of deep learning, a pivotal moment that marked the beginning of the AI revolution."},{"start":812.0,"end":821.0,"text":"Our decisions after AlexNet transformed our company is something that's worth taking note of."},{"start":821.0,"end":827.0,"text":"Our decisions after AlexNet transformed our company and likely everything else."},{"start":827.0,"end":839.0,"text":"We saw the potential of deep learning and believed, just believed through principle thinking, believed through our own analysis of the scalability of deep learning."},{"start":839.0,"end":842.0,"text":"We believed the approach could learn other valuable functions."},{"start":842.0,"end":853.0,"text":"That maybe deep learning is a universal function learner and how many problems are difficult or impossible to express using fundamental first principles."},{"start":853.0,"end":859.34,"text":"And so when we saw this, when we saw this,"},{"start":859.34,"end":869.0,"text":"we thought this is a technology we really have to pay attention to because its limits are potentially only limited by model and data scale."},{"start":869.0,"end":872.0,"text":"However, there were challenges at the time."},{"start":872.0,"end":875.0,"text":"This is 2012, shortly after 2012."},{"start":875.0,"end":882.5,"text":"How could we explore the limits of deep learning without having to build these massive GPU clusters?"},{"start":882.5,"end":889.0,"text":"At the time we were a rather small company, building these massive GPU clusters could cost hundreds and hundreds of millions of dollars."},{"start":889.0,"end":896.0,"text":"And if we didn't though, there was no assurance that it would be effective if we scaled."},{"start":896.0,"end":900.0,"text":"However, no one knew how far deep learning could scale."},{"start":900.0,"end":904.0,"text":"And if we didn't build it, we'd never know."},{"start":904.0,"end":907.0,"text":"This is one of those, if you build it, will they come?"},{"start":907.0,"end":910.0,"text":"Our logic is if we don't build it, they can't come."},{"start":910.0,"end":916.0,"text":"And so we dedicated ourselves based on our first principled beliefs and our analysis."},{"start":916.0,"end":920.34,"text":"And we got ourselves to the point where we believed this was going to be so effective and when the company believes something,"},{"start":920.34,"end":924.0,"text":"we should go act on it."},{"start":924.0,"end":931.0,"text":"So we dove deep into deep learning, and over the next decade, systematically reinvented everything."},{"start":931.0,"end":935.0,"text":"We reinvented every computing layer, starting with the GPU itself."},{"start":935.0,"end":947.36,"text":"The invention of the modern GPU, which is very different than the GPU of the past that we invented in the first place,"},{"start":947.36,"end":953.0,"text":"and we went on to invent just about every other aspect of computing, the interconnects, the systems, the networking, and of course, software."},{"start":953.0,"end":955.0,"text":"We invested billions."},{"start":955.0,"end":958.0,"text":"We invested billions into the unknown."},{"start":958.0,"end":971.0,"text":"Thousands of engineers for a decade worked on deep learning and advancing and scaling deep learning without really knowing how far we could really take the technology."},{"start":971.0,"end":972.0,"text":"We invested billions."},{"start":972.0,"end":978.0,"text":"And we designed and built supercomputers to explore the limits of deep learning and AI."},{"start":978.0,"end":984.84,"text":"And in 2016, we announced DGX-1, our first AI supercomputer,"},{"start":984.84,"end":993.18,"text":"and I delivered the first one to a startup in San Francisco, a startup nobody knew anything about,"},{"start":993.18,"end":1000.8,"text":"a group of friends of mine who were working on artificial intelligence, a company called OpenAI."},{"start":1003.0,"end":1014.0,"text":"In 2022, 10 years after AlexNet, and about a million-fold increase in computing later, a million-fold."},{"start":1014.0,"end":1019.2,"text":"If you could just imagine, what would it be like if your laptop was a million-fold more capable?"},{"start":1019.2,"end":1028.0,"text":"A million-fold later, OpenAI launched ChatGPT, and AI went mainstream."},{"start":1028.0,"end":1034.04,"text":"During this decade, NVIDIA transformed ourselves from a graphics company that many of you probably first knew us as, that builds GPUs,"},{"start":1034.04,"end":1044.0,"text":"to now an AI company that builds massive data center scale supercomputers."},{"start":1044.0,"end":1047.0,"text":"We transformed our company completely."},{"start":1047.0,"end":1050.0,"text":"We also transformed computing completely."},{"start":1050.0,"end":1055.0,"text":"The fundamental way of doing computing today has been radically changed."},{"start":1055.0,"end":1072.0,"text":"The computing stack now uses GPU to process large language models that are trained on supercomputers rather than CPUs that are processing instructions written by programmers."},{"start":1072.0,"end":1075.0,"text":"We are now creating software that no humans can write."},{"start":1075.0,"end":1081.0,"text":"We are now creating software that does things that no humans can imagine, even just 10 years ago."},{"start":1081.0,"end":1088.0,"text":"Computers are now intention-driven rather than instruction-driven."},{"start":1088.0,"end":1093.0,"text":"Tell a computer what you want, and it will figure out how."},{"start":1093.0,"end":1108.0,"text":"And like humans, AI applications will understand the mission, reason, plan, and orchestrate a team of large language models to perform tasks."},{"start":1108.0,"end":1121.0,"text":"Future applications will do and perform very similar to the way we do things, assemble teams of experts, use tools, reason and plan, and execute our mission."},{"start":1121.0,"end":1126.0,"text":"Software and what software can do has been completely changed."},{"start":1126.0,"end":1136.0,"text":"Even our industry, as it's being changed and transformed, created yet another industry, an industry the world's never seen before."},{"start":1136.0,"end":1140.0,"text":"An industry is forming right in front of our eyes."},{"start":1140.0,"end":1146.0,"text":"AI's input and output are tokens."},{"start":1146.0,"end":1148.0,"text":"For all the engineers in the room, you know what I mean."},{"start":1148.0,"end":1154.0,"text":"These are floating-point numbers that embed intelligence."},{"start":1154.0,"end":1165.0,"text":"Companies are now building a new type of data center that didn't exist before that specialize in producing intelligence tokens."},{"start":1165.0,"end":1169.0,"text":"Essentially, AI factories."},{"start":1169.0,"end":1183.42,"text":"Like AC generators that Nikola Tesla invented of the past industrial revolution, we now have AI token generators,"},{"start":1183.42,"end":1187.0,"text":"and they will be the factories of a new industrial revolution."},{"start":1187.0,"end":1191.0,"text":"There's large industries producing energy, electricity."},{"start":1191.0,"end":1195.0,"text":"We now have a large industry producing something invisible called software."},{"start":1195.0,"end":1202.86,"text":"In the future, in the very near future, we'll have industries that are producing, manufacturing intelligence tokens, AI generators."},{"start":1207.0,"end":1213.56,"text":"A new computing model has emerged, and a new industry has emerged, all because we reasoned from first principles,"},{"start":1213.56,"end":1222.0,"text":"formed our belief about the future, and we acted on them."},{"start":1222.0,"end":1232.88,"text":"The next wave of AI is robotics, where AI, in addition to a language model, also has a physical world model."},{"start":1235.0,"end":1246.0,"text":"We work with hundreds of companies building robots, robotic vehicles, pick-and-place arms, humanoid robots, and even entire gigantic warehouses that are robotic."},{"start":1246.0,"end":1253.34,"text":"But unlike our AI factory strategy and our experience there, which was really formed through reasoning and deliberate action,"},{"start":1253.34,"end":1261.0,"text":"our robotics journey resulted from a series of setbacks."},{"start":1261.0,"end":1263.0,"text":"As you know, NVIDIA invented the GPU."},{"start":1263.0,"end":1267.0,"text":"This was before we invented AI factories."},{"start":1267.0,"end":1275.0,"text":"Our first great contribution to the computer industry was reinventing computer graphics through programmable shaders."},{"start":1275.0,"end":1279.0,"text":"We invented the GPU and programmable shading in 2000."},{"start":1279.0,"end":1284.76,"text":"We wanted to integrate GPUs into every computer, and so we started to combine our GPUs with motherboard chips,"},{"start":1284.76,"end":1293.0,"text":"and we launched a fabulous integrated graphics chip at the time for AMD CPUs."},{"start":1293.0,"end":1297.0,"text":"Our chipset business was an instant success."},{"start":1297.0,"end":1302.0,"text":"I think it went from zero to a billion dollars practically overnight."},{"start":1302.0,"end":1306.6,"text":"But then all of a sudden, AMD wanted to control all of the technology in the PC,"},{"start":1306.6,"end":1314.0,"text":"and we wanted to stay independent, so they purchased ATI and no longer needed us."},{"start":1314.0,"end":1321.0,"text":"We turned to Intel."},{"start":1321.0,"end":1331.0,"text":"That probably wasn't a great idea, but we turned to Intel and negotiated a license to connect to Intel CPUs."},{"start":1331.0,"end":1344.0,"text":"Apple was excited by what we were building and asked us to work on a new computer with them, which became the first MacBook Air."},{"start":1344.0,"end":1353.0,"text":"Well, Intel saw what happened and decided they didn't want us to do that anymore, and so they terminated our agreement."},{"start":1353.0,"end":1358.7,"text":"Well, we pivoted again, and this time we went and licensed ARM,"},{"start":1358.7,"end":1363.68,"text":"and we built a low-power SoC, a mobile SoC,"},{"start":1363.68,"end":1372.0,"text":"the world's first SoC that was essentially a computer, a full operating computer, and it was incredible."},{"start":1372.0,"end":1382.0,"text":"Our chip excited Google, and they asked us to work on a new device, which turned out to have been the Android mobile device."},{"start":1382.0,"end":1387.88,"text":"Well, Qualcomm decided they didn't want us to do that,"},{"start":1387.88,"end":1390.88,"text":"and so they didn't want us to connect to their modems,"},{"start":1390.88,"end":1394.0,"text":"and it's hard to build a mobile device without being connected to a modem."},{"start":1394.0,"end":1401.0,"text":"And there were no other LTE modem companies, so we had to exit the mobile device market."},{"start":1401.0,"end":1408.6,"text":"Well, this happened practically on a year rhythm, and we would build something, it would be incredibly successful,"},{"start":1408.6,"end":1416.0,"text":"generate enormous amounts of excitement, and then one year later, we were kicked out of those markets."},{"start":1416.0,"end":1420.48,"text":"Well, with no more markets to turn to,"},{"start":1420.48,"end":1426.36,"text":"we decided to build something where we are sure there are no customers,"},{"start":1430.62,"end":1437.96,"text":"because one of the things you can definitely guarantee is where there are no customers,"},{"start":1437.96,"end":1442.0,"text":"there are also no competitors, and nobody cares about you."},{"start":1442.0,"end":1451.0,"text":"And so we chose a market with no customers, a $0 billion market, and it was robotics."},{"start":1451.0,"end":1459.0,"text":"We built the world's first robotics computer processing an algorithm nobody understood at the time called deep learning."},{"start":1459.0,"end":1462.0,"text":"This is over 10 years ago now."},{"start":1462.0,"end":1470.0,"text":"Ten years later, I can't be happier with what we've built and the opportunity to create the next wave of AI."},{"start":1470.0,"end":1476.0,"text":"More importantly, we developed agility and a culture of resilience."},{"start":1476.0,"end":1482.0,"text":"One setback after another, we shook it off and skated to the next opportunity."},{"start":1482.0,"end":1487.0,"text":"Each time, we gained skills and strengthened our character."},{"start":1487.0,"end":1490.0,"text":"We strengthened our corporate character."},{"start":1490.0,"end":1502.0,"text":"Our company is really hard to distract and really hard to discourage, and no setback that comes our way doesn't look like an opportunity these days."},{"start":1502.0,"end":1512.0,"text":"Ironically, the robotics computer that we built today doesn't even need graphics, which is why our journey started in the first place."},{"start":1512.0,"end":1517.0,"text":"So where we are today tells us something and teaches us something."},{"start":1517.0,"end":1526.0,"text":"The world is uncertain, as Richard Feynman would say, and the world can be unfair and deal you with tough cards."},{"start":1526.0,"end":1529.18,"text":"Swiftly, shake it off."},{"start":1547.0,"end":1553.0,"text":"You've apparently been paying too much attention to your books."},{"start":1553.0,"end":1554.0,"text":"Swiftly, shake it off."},{"start":1554.0,"end":1556.0,"text":"Come on, that's pretty clever."},{"start":1556.0,"end":1564.0,"text":"I made myself laugh."},{"start":1564.0,"end":1569.0,"text":"There's another opportunity out there, or create one."},{"start":1569.0,"end":1571.0,"text":"Let me tell you one more story."},{"start":1571.0,"end":1578.0,"text":"I used to work from one of our international sites for one month each summer."},{"start":1578.0,"end":1582.0,"text":"When our kids were in their teens, we spent a summer in Japan."},{"start":1582.0,"end":1586.0,"text":"For a weekend, we visited Kyoto and the Silver Temple."},{"start":1586.0,"end":1589.0,"text":"If you haven't had a chance to go, you must."},{"start":1589.0,"end":1592.0,"text":"It's renowned for its exquisite moss garden."},{"start":1592.0,"end":1601.0,"text":"The day we visited was quintessential Kyoto summer day, suffocatingly hot and humid, sticky."},{"start":1601.0,"end":1605.0,"text":"Heat is radiating from the ground."},{"start":1605.0,"end":1609.0,"text":"The air was thick, still."},{"start":1609.0,"end":1614.0,"text":"Along with the other tourists, we wandered through the meticulously groomed moss garden."},{"start":1614.0,"end":1618.0,"text":"And I noticed the lone gardener."},{"start":1618.0,"end":1623.0,"text":"Now, remember, the moss garden, this is the Silver Temple, the moss garden is gigantic."},{"start":1623.0,"end":1625.0,"text":"It's about the size of this courtyard."},{"start":1625.0,"end":1632.0,"text":"And it has the collection, the largest collection of just about apparently every species of moss in the world."},{"start":1632.0,"end":1636.0,"text":"And it's just exquisitely maintained."},{"start":1636.0,"end":1651.0,"text":"I noticed the lone gardener squatting, carefully picking at the moss with a bamboo tweezer and putting it in the bamboo basket."},{"start":1651.0,"end":1663.0,"text":"And you have to, it's a bamboo tweezer, you know, and it's just this one gardener."},{"start":1663.0,"end":1666.0,"text":"And the basket looked empty."},{"start":1666.0,"end":1677.0,"text":"Well, for a moment there, I thought he was picking imaginary moss into a pile of imaginary dead moss."},{"start":1677.0,"end":1681.82,"text":"And so I walked up to him and I said, what are you doing?"},{"start":1681.82,"end":1686.0,"text":"And in his English, he said, I'm picking dead moss."},{"start":1686.0,"end":1688.0,"text":"I'm taking care of my garden."},{"start":1688.0,"end":1694.0,"text":"And I said, but your garden is so big."},{"start":1694.0,"end":1700.0,"text":"And he responded, I have cared for my garden for 25 years."},{"start":1700.0,"end":1703.0,"text":"I have plenty of time."},{"start":1703.0,"end":1710.0,"text":"Well, that was one of the most profound learnings in my life."},{"start":1710.0,"end":1714.0,"text":"And it really taught me something."},{"start":1714.0,"end":1720.0,"text":"This gardener has dedicated himself to his craft and doing his life's work."},{"start":1720.0,"end":1724.0,"text":"And when you do that, you have plenty of time."},{"start":1724.0,"end":1733.0,"text":"I begin each morning, I do every single morning exactly the same way, I begin each morning by doing my highest priority work first."},{"start":1733.0,"end":1738.0,"text":"I have a very clear priority list and I start from the highest priority work first."},{"start":1738.0,"end":1744.0,"text":"Before I even get to work, my day is already a success."},{"start":1744.0,"end":1751.0,"text":"I've already completed my most important work and can dedicate my day to helping others."},{"start":1751.0,"end":1760.0,"text":"And when people apologize for interrupting me, I always say I have plenty of time and I do."},{"start":1760.0,"end":1771.0,"text":"Graduates of the class of 2024, I can hardly imagine anyone more prepared for the future than you."},{"start":1771.0,"end":1781.0,"text":"You dedicated yourself, you worked hard, you earned a world-class education from one of the most prestigious schools in the world."},{"start":1781.0,"end":1791.0,"text":"And as you commence into the next stage, take my learnings and hopefully they'll help you along the way."},{"start":1791.0,"end":1802.0,"text":"I hope you believe in something, something unconventional, something unexplored, but let it be informed and let it be reasoned."},{"start":1802.0,"end":1805.0,"text":"Then dedicate yourself to making it happen."},{"start":1805.0,"end":1814.0,"text":"You may find your GPU, you may find your CUDA, you may find your generative AI, you may find your NVIDIA."},{"start":1814.0,"end":1818.0,"text":"I hope you will see setbacks as new opportunities."},{"start":1818.0,"end":1827.0,"text":"Your pain and suffering will strengthen your character, your resilience and agility, and they are the ultimate superpowers."},{"start":1827.0,"end":1836.0,"text":"Of all of the things that I value most about my abilities, intelligence is not top of that list."},{"start":1836.0,"end":1845.02,"text":"My ability to endure pain and suffering, my ability to work on something for a very, very long period of time,"},{"start":1845.02,"end":1850.76,"text":"my ability to handle setbacks and see the opportunity just around the corner I consider to be my superpowers,"},{"start":1850.76,"end":1853.0,"text":"and I hope they're yours."},{"start":1853.0,"end":1865.0,"text":"And I hope you find a craft."},{"start":1865.0,"end":1868.0,"text":"I hope you find a craft."},{"start":1868.0,"end":1871.49,"text":"It's not important to decide on day one,"},{"start":1871.49,"end":1878.47,"text":"it's not even important to decide any time soon, but I hope you do find a craft,"},{"start":1878.47,"end":1883.74,"text":"that you want to dedicate your lifetime to perfecting, to hone the skills of,"},{"start":1883.74,"end":1887.0,"text":"and let it be your life's work."},{"start":1887.0,"end":1891.0,"text":"And then lastly, prioritize your life."},{"start":1891.0,"end":1894.73,"text":"There's so many things going on, there's so many things to do,"},{"start":1894.73,"end":1899.0,"text":"but prioritize your life and you will have plenty of time to do the important things."},{"start":1899.0,"end":1903.36,"text":"Congratulations, class of 2024, go get them."}];
const VOCAB = {"cringe": {"meaning": "感到尴尬/难为情", "phonetic": "/krɪndʒ/"}, "esteemed": {"meaning": "受人尊敬的", "phonetic": "/ɪˈstiːmd/"}, "faculty": {"meaning": "（大学的）全体教员", "phonetic": "/ˈfæklti/"}, "distinguished": {"meaning": "杰出的，卓越的", "phonetic": "/dɪˈstɪŋɡwɪʃt/"}, "graduating": {"meaning": "毕业的", "phonetic": "/ˈɡrædʒueɪtɪŋ/"}, "influential": {"meaning": "有影响力的", "phonetic": "/ˌɪnfluˈenʃl/"}, "sacrifices": {"meaning": "牺牲（复数）", "phonetic": "/ˈsækrɪfaɪsɪz/"}, "commencement": {"meaning": "毕业典礼；开始", "phonetic": "/kəˈmensmənt/"}, "privilege": {"meaning": "特权，荣幸", "phonetic": "/ˈprɪvəlɪdʒ/"}, "revolutionizing": {"meaning": "正在彻底变革", "phonetic": "/ˌrevəˈluːʃənaɪzɪŋ/"}, "intellectual": {"meaning": "智力的；知识分子", "phonetic": "/ˌɪntəˈlektʃuəl/"}, "humility": {"meaning": "谦逊", "phonetic": "/hjuːˈmɪləti/"}, "retreat": {"meaning": "撤退；退缩", "phonetic": "/rɪˈtriːt/"}, "perspective": {"meaning": "视角，观点", "phonetic": "/pərˈspektɪv/"}, "extraordinary": {"meaning": "非凡的，卓越的", "phonetic": "/ɪkˈstrɔːrdneri/"}, "literally": {"meaning": "字面上地；确实", "phonetic": "/ˈlɪtərəli/"}, "profoundly": {"meaning": "深刻地", "phonetic": "/prəˈfaʊndli/"}, "revolutionized": {"meaning": "彻底变革了", "phonetic": "/ˌrevəˈluːʃənaɪzd/"}, "pioneering": {"meaning": "开创性的", "phonetic": "/ˌpaɪəˈnɪrɪŋ/"}, "exponential": {"meaning": "指数级的", "phonetic": "/ˌekspəˈnenʃl/"}, "transistor": {"meaning": "晶体管", "phonetic": "/trænˈzɪstər/"}, "exponentially": {"meaning": "指数级地", "phonetic": "/ˌekspəˈnenʃəli/"}, "accelerated": {"meaning": "加速的", "phonetic": "/əkˈseləreɪtɪd/"}, "algorithms": {"meaning": "算法（复数）", "phonetic": "/ˈælɡərɪðəmz/"}, "accelerate": {"meaning": "加速", "phonetic": "/əkˈseləreɪt/"}, "sustainable": {"meaning": "可持续的", "phonetic": "/səˈsteɪnəbl/"}, "pivotal": {"meaning": "关键的，核心的", "phonetic": "/ˈpɪvətl/"}, "fundamental": {"meaning": "基本的，根本的", "phonetic": "/ˌfʌndəˈmentl/"}, "reinvented": {"meaning": "重新发明了", "phonetic": "/ˌriːɪnˈventɪd/"}, "artificial": {"meaning": "人工的，人造的", "phonetic": "/ˌɑːrtɪˈfɪʃl/"}, "intelligence": {"meaning": "智能，智力", "phonetic": "/ɪnˈtelɪdʒəns/"}, "robotics": {"meaning": "机器人技术", "phonetic": "/roʊˈbɒtɪks/"}, "deliberate": {"meaning": "深思熟虑的；故意的", "phonetic": "/dɪˈlɪbərət/"}, "setbacks": {"meaning": "挫折（复数）", "phonetic": "/ˈsetbæks/"}, "guarantee": {"meaning": "保证", "phonetic": "/ˌɡærənˈtiː/"}, "competitors": {"meaning": "竞争者", "phonetic": "/kəmˈpetɪtərz/"}, "algorithm": {"meaning": "算法", "phonetic": "/ˈælɡərɪðəm/"}, "resilience": {"meaning": "韧性，恢复力", "phonetic": "/rɪˈzɪliəns/"}, "agility": {"meaning": "敏捷性，灵活性", "phonetic": "/əˈdʒɪləti/"}, "setback": {"meaning": "挫折，退步", "phonetic": "/ˈsetbæk/"}, "discourage": {"meaning": "使沮丧；劝阻", "phonetic": "/dɪsˈkʌrɪdʒ/"}, "distract": {"meaning": "分散注意力", "phonetic": "/dɪˈstrækt/"}, "ironically": {"meaning": "讽刺地，出乎意料地", "phonetic": "/aɪˈrɒnɪkli/"}, "meticulously": {"meaning": "一丝不苟地", "phonetic": "/məˈtɪkjələsli/"}, "profound": {"meaning": "深刻的，深远的", "phonetic": "/prəˈfaʊnd/"}};

// === Helpers ===
function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function decodeHtmlEntities(t) {
  const textarea = document.createElement('textarea');
  textarea.innerHTML = t;
  return textarea.value;
}

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function normalizeAudioUrl(url) {
  if (!url) return '';
  return url.startsWith('//') ? `https:${url}` : url;
}

function getDictionaryAudio(entry) {
  const sources = (entry.phonetics || [])
    .map((phonetic) => normalizeAudioUrl(phonetic.audio || ''))
    .filter(Boolean);

  return sources.find((url) => /-us\.mp3|\/us\//i.test(url)) ||
    sources.find((url) => /\.mp3(\?|$)/i.test(url)) ||
    sources[0] ||
    '';
}

function getEnglishVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  return voices.find((voice) => /^en(-|_)?us/i.test(voice.lang)) ||
    voices.find((voice) => /^en/i.test(voice.lang)) ||
    null;
}

function getStaticPronunciationSources(word) {
  const safeWord = encodeURIComponent(word);
  return [
    `https://ssl.gstatic.com/dictionary/static/sounds/20200429/${safeWord}--_us_1.mp3`,
    `https://ssl.gstatic.com/dictionary/static/sounds/oxford/${safeWord}--_us_1.mp3`
  ];
}

function highlightVocab(text) {
  let result = escapeHtml(text);
  // Split into words and non-words, wrap each word in a clickable span
  result = result.replace(/([a-zA-Z'-]+)/g, (match) => {
    const lower = match.toLowerCase().replace(/^['-]+|['-]+$/g, '');
    const isVocab = VOCAB[lower];
    if (isVocab) {
      return `<span class="vocab-word word-clickable" data-word="${lower}">${match}</span>`;
    }
    return `<span class="word-clickable" data-word="${lower}">${match}</span>`;
  });
  return result;
}

function positionPopup(targetEl) {
  const rect = targetEl.getBoundingClientRect();
  const pw = 320;
  let left = rect.left + rect.width / 2 - pw / 2;
  let top = rect.bottom + 8;

  // Keep within viewport
  if (left < 8) left = 8;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (top + 200 > window.innerHeight) top = rect.top - 8 - 200;
  if (top < 8) top = 8;

  wordPopup.style.left = left + 'px';
  wordPopup.style.top = top + 'px';
}

function showPopup(word, targetEl) {
  const lower = word.toLowerCase().replace(/^['-]+|['-]+$/g, '');
  if (!lower || lower.length < 2) return;

  popupWord.textContent = lower;
  popupPhonetic.textContent = '';
  popupMeaning.textContent = '';
  popupEnDef.innerHTML = '';
  popupSource.textContent = '';
  popupSpeak.dataset.audioSrc = '';

  positionPopup(targetEl);
  wordPopup.classList.add('show');

  // Reset add button
  if (isInNotebook(lower)) {
    popupAddBtn.textContent = '✅ 已加入';
    popupAddBtn.classList.add('added');
  } else {
    popupAddBtn.textContent = '⭐ 加入单词本';
    popupAddBtn.classList.remove('added');
  }

  // Check VOCAB first
  if (VOCAB[lower]) {
    const info = VOCAB[lower];
    popupPhonetic.textContent = info.phonetic || '';
    popupMeaning.textContent = info.meaning;
    popupSource.textContent = '📖 课文重点词汇';
    popupSource.className = 'popup-source is-vocab';
    fetchEnglishDef(lower, true);
    return;
  }

  // Check cache
  if (lookupCache[lower]) {
    renderLookupResult(lookupCache[lower]);
    return;
  }

  // Show loading
  popupMeaning.innerHTML = '<div class="popup-loading"><div class="mini-spinner"></div>正在查询...</div>';
  popupSource.textContent = '';

  // Fetch from Free Dictionary API + translation
  fetchWordInfo(lower);
}

async function fetchEnglishDef(word, isVocab) {
  try {
    const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data[0]) return;

    // If vocab word didn't have phonetic, fill from API
    if (isVocab && !popupPhonetic.textContent && data[0].phonetic) {
      popupPhonetic.textContent = data[0].phonetic;
    }

    const audioSrc = getDictionaryAudio(data[0]);
    if (audioSrc && popupWord.textContent === word) {
      popupSpeak.dataset.audioSrc = audioSrc;
    }

    // Add English definitions
    const meanings = data[0].meanings || [];
    let defHtml = '';
    for (const m of meanings.slice(0, 3)) {
      const pos = m.partOfSpeech;
      const defs = m.definitions.slice(0, 2);
      for (const d of defs) {
        defHtml += `<div><span class="def-pos">${pos}</span>${escapeHtml(d.definition)}</div>`;
      }
    }
    if (defHtml) popupEnDef.innerHTML = defHtml;
  } catch (e) { /* ignore */ }
}

async function fetchWordInfo(word) {
  const result = { word, phonetic: '', meaning: '', enDefs: [], audioSrc: '' };

  // Parallel: dictionary API + translation API
  const [dictResult, transResult] = await Promise.allSettled([
    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r => r.ok ? r.json() : null),
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${encodeURIComponent('en|zh')}`).then(r => r.ok ? r.json() : null)
  ]);

  // Parse dictionary
  if (dictResult.status === 'fulfilled' && dictResult.value && dictResult.value[0]) {
    const entry = dictResult.value[0];
    result.phonetic = entry.phonetic || '';
    result.audioSrc = getDictionaryAudio(entry);
    if (!result.phonetic && entry.phonetics) {
      const p = entry.phonetics.find(ph => ph.text);
      if (p) result.phonetic = p.text;
    }
    const meanings = entry.meanings || [];
    for (const m of meanings.slice(0, 3)) {
      const pos = m.partOfSpeech;
      for (const d of m.definitions.slice(0, 2)) {
        result.enDefs.push({ pos, def: d.definition });
      }
    }
  }

  // Parse translation
  if (transResult.status === 'fulfilled' && transResult.value) {
    const trans = transResult.value;
    if (trans.responseStatus === 200 && trans.responseData && trans.responseData.translatedText) {
      const t = trans.responseData.translatedText;
      // Only use if it actually looks like Chinese
      if (/[\u4e00-\u9fff]/.test(t)) {
        result.meaning = t;
      }
    }
  }

  lookupCache[word] = result;
  renderLookupResult(result);
}

function renderLookupResult(result) {
  popupPhonetic.textContent = result.phonetic || '';
  popupMeaning.textContent = result.meaning || '';
  popupSource.textContent = result.meaning ? '🌐 在线翻译' : '';
  popupSource.className = 'popup-source';
  popupSpeak.dataset.audioSrc = result.audioSrc || '';

  let defHtml = '';
  for (const d of (result.enDefs || [])) {
    defHtml += `<div><span class="def-pos">${d.pos}</span>${escapeHtml(d.def)}</div>`;
  }
  popupEnDef.innerHTML = defHtml;

  if (!result.meaning && !defHtml) {
    popupMeaning.textContent = '暂无释义';
  }
}

// === TTS pronunciation ===
function speakWithBrowserVoice(word) {
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return false;

  speechSynthesis.cancel();
  speechSynthesis.resume?.();

  const utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US';
  utt.rate = 0.85;
  utt.voice = getEnglishVoice();
  speechSynthesis.speak(utt);
  return true;
}

function playPronunciationAudio(source) {
  return new Promise((resolve, reject) => {
    let settled = false;
    let startedAt = 0;
    const finish = (handler) => {
      if (settled) return;
      settled = true;
      pronunciationAudio.removeEventListener('playing', onPlaying);
      pronunciationAudio.removeEventListener('canplay', onPlaying);
      pronunciationAudio.removeEventListener('error', onError);
      clearTimeout(timer);
      handler();
    };
    const onPlaying = () => {
      startedAt = pronunciationAudio.currentTime || 0;
      setTimeout(() => {
        if (settled) return;
        if (!pronunciationAudio.paused && pronunciationAudio.currentTime > startedAt) {
          finish(resolve);
        }
      }, 250);
    };
    const onError = () => finish(() => reject(new Error('pronunciation audio failed')));
    const timer = setTimeout(() => {
      pronunciationAudio.pause();
      finish(() => reject(new Error('pronunciation audio timed out')));
    }, 2200);

    pronunciationAudio.addEventListener('playing', onPlaying);
    pronunciationAudio.addEventListener('canplay', onPlaying);
    pronunciationAudio.addEventListener('error', onError);
    pronunciationAudio.pause();
    pronunciationAudio.currentTime = 0;
    pronunciationAudio.src = source;
    pronunciationAudio.play().catch(onError);
  });
}

async function playPronunciation(word) {
  const cleanWord = word.toLowerCase().replace(/^['-]+|['-]+$/g, '');
  if (!cleanWord) return;

  popupSpeak.disabled = true;
  window.speechSynthesis?.cancel();

  if (popupSpeak.dataset.audioSrc) {
    try {
      popupSpeak.disabled = false;
      await playPronunciationAudio(popupSpeak.dataset.audioSrc);
      return;
    } catch (e) {
      // Fall back to synthesized pronunciation.
    }
  }

  for (const source of getStaticPronunciationSources(cleanWord)) {
    try {
      popupSpeak.disabled = false;
      await playPronunciationAudio(source);
      return;
    } catch (e) {
      // Try the next pronunciation source.
    }
  }

  if (speakWithBrowserVoice(cleanWord)) {
    setTimeout(() => {
      popupSpeak.disabled = false;
    }, 800);
    return;
  }

  try {
    popupSpeak.disabled = false;
    await playPronunciationAudio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(cleanWord)}`);
  } catch (e) {
    popupSpeak.disabled = false;
  }
}

popupSpeak.addEventListener('click', (e) => {
  e.stopPropagation();
  const word = popupWord.textContent;
  if (!word) return;
  playPronunciation(word);
});

function setSegmentTranslationState(i, text, state = 'ready') {
  const el = subtitlePanel.children[i];
  if (!el) return;

  const translation = el.querySelector('.seg-translation');
  const button = el.querySelector('.seg-translate');
  if (!translation || !button) return;

  translation.hidden = false;
  translation.classList.toggle('is-loading', state === 'loading');
  translation.classList.toggle('is-error', state === 'error');
  translation.textContent = text;

  button.disabled = state === 'loading';
  button.textContent = state === 'loading' ? '...' : '译';
}

async function translateSegment(i) {
  const seg = SEGMENTS[i];
  if (!seg) return;

  const cacheKey = seg.text;
  if (sentenceTranslationCache[cacheKey]) {
    setSegmentTranslationState(i, sentenceTranslationCache[cacheKey]);
    return;
  }

  setSegmentTranslationState(i, '正在翻译...', 'loading');

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);

  try {
    const resp = await fetch(
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(seg.text)}&langpair=${encodeURIComponent('en|zh')}`,
      { signal: controller.signal }
    );
    if (!resp.ok) throw new Error('translation request failed');

    const data = await resp.json();
    if (data && data.responseStatus && data.responseStatus !== 200) {
      throw new Error(data.responseDetails || 'translation service rejected request');
    }
    const translatedText = data && data.responseData && data.responseData.translatedText;
    const translated = translatedText ? decodeHtmlEntities(translatedText.trim()) : '';
    if (!translated) throw new Error('empty translation');

    sentenceTranslationCache[cacheKey] = translated;
    setSegmentTranslationState(i, translated);
  } catch (e) {
    setSegmentTranslationState(i, '暂时无法翻译，请稍后重试。', 'error');
  } finally {
    clearTimeout(timeout);
  }
}

function toggleLoop(i) {

    loopIndicator.classList.remove('active');

    loopIndicator.classList.add('active');

    const el = subtitlePanel.children[i];
    if (el) el.style.outline = '1px solid var(--accent)';
    audio.currentTime = SEGMENTS[i].start;
    if (audio.paused) audio.play();
  }
}

// === Notebook (localStorage) ===
const NB_KEY = 'english_learning_notebook';
const SENTENCE_KEY = 'english_learning_sentences';
function loadNotebook() {
  try { return JSON.parse(localStorage.getItem(NB_KEY)) || {}; } catch { return {}; }
}
function saveNotebook(nb) {
  localStorage.setItem(NB_KEY, JSON.stringify(nb));
  updateNotebookCount();
}
function addToNotebook(word, phonetic, meaning) {
  const nb = loadNotebook();
  if (!nb[word]) {
    nb[word] = { phonetic: phonetic || '', meaning: meaning || '', addedAt: Date.now() };
    saveNotebook(nb);
  }
}
function removeFromNotebook(word) {
  const nb = loadNotebook();
  delete nb[word];
  saveNotebook(nb);
}
function isInNotebook(word) {
  return !!loadNotebook()[word];
}
function updateNotebookCount() {
  const count = Object.keys(loadNotebook()).length;
  document.getElementById('notebookCount').textContent = count;
}

function loadSentenceFavorites() {
  try {
    return (JSON.parse(localStorage.getItem(SENTENCE_KEY)) || [])
      .map(Number)
      .filter((index) => Number.isInteger(index) && index >= 0 && index < SEGMENTS.length);
  } catch {
    return [];
  }
}

function saveSentenceFavorites(items) {
  const unique = [...new Set(items)].sort((a, b) => a - b);
  localStorage.setItem(SENTENCE_KEY, JSON.stringify(unique));
  updateSentenceFavoriteButtons();
  updateSentenceCount();
}

function isSentenceFavorite(index) {
  return loadSentenceFavorites().includes(index);
}

function toggleSentenceFavorite(index) {
  const current = loadSentenceFavorites();
  const next = current.includes(index)
    ? current.filter((item) => item !== index)
    : [...current, index];
  saveSentenceFavorites(next);
  if (currentTab === 'sentences') buildVocabList(vocabSearchInput.value);
}

function updateSentenceCount() {
  document.getElementById('sentenceCount').textContent = loadSentenceFavorites().length;
}

function updateSentenceFavoriteButtons() {
  const favorites = new Set(loadSentenceFavorites());
  document.querySelectorAll('.seg').forEach((segEl) => {
    const index = Number(segEl.dataset.index);
    const button = segEl.querySelector('.seg-favorite');
    if (!button) return;

    const saved = favorites.has(index);
    button.classList.toggle('is-active', saved);
    button.textContent = saved ? '★' : '☆';
    button.title = saved ? '取消收藏难句' : '收藏难句';
    button.setAttribute('aria-label', button.title);
  });
}

// === Build vocab sidebar ===
function buildVocabList(filter = '') {
  vocabList.innerHTML = '';
  const notebookActions = document.getElementById('notebookActions');
  const query = filter.trim().toLowerCase();

  if (currentTab === 'course') {
    notebookActions.classList.remove('show');
    const entries = Object.entries(VOCAB)
      .filter(([w, info]) => !query || w.includes(query) || info.meaning.includes(filter))
      .sort((a, b) => a[0].localeCompare(b[0]));

    document.getElementById('vocabBadge').textContent = entries.length;
    document.getElementById('courseCount').textContent = entries.length;
    document.getElementById('vocabCount').textContent = entries.length;

    entries.forEach(([word, info]) => {
      const div = document.createElement('div');
      div.className = 'vocab-item';
      const inNb = isInNotebook(word);
      div.innerHTML = `
        <div><span class="vi-word">${word}</span><span class="vi-phonetic">${info.phonetic || ''}</span></div>
        <div class="vi-meaning">${info.meaning}</div>
      `;
      div.addEventListener('click', () => {
        const idx = SEGMENTS.findIndex(s => new RegExp('\\b' + word + '\\b', 'i').test(s.text));
        if (idx >= 0) {
          audio.currentTime = SEGMENTS[idx].start;
          if (audio.paused) audio.play();
          scrollToSeg(idx);
        }
      });
      vocabList.appendChild(div);
    });
  } else if (currentTab === 'notebook') {
    // Notebook tab
    notebookActions.classList.add('show');
    const nb = loadNotebook();
    const entries = Object.entries(nb)
      .filter(([w, info]) => !query || w.includes(query) || info.meaning.includes(filter))
      .sort((a, b) => a[0].localeCompare(b[0]));

    document.getElementById('vocabBadge').textContent = entries.length;

    if (entries.length === 0) {
      vocabList.innerHTML = '<div style="padding:24px 16px;text-align:center;color:var(--text-dim);font-size:13px;">📝 单词本为空<br><br>点击字幕中的单词，然后按「⭐ 加入单词本」<br>即可收藏到这里</div>';
      return;
    }

    entries.forEach(([word, info]) => {
      const div = document.createElement('div');
      div.className = 'vocab-item';
      div.innerHTML = `
        <button class="vi-delete" title="移除">✕</button>
        <div><span class="vi-word">${word}</span><span class="vi-phonetic">${info.phonetic || ''}</span></div>
        <div class="vi-meaning">${info.meaning}</div>
      `;
      div.querySelector('.vi-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromNotebook(word);
        buildVocabList(vocabSearchInput.value);
      });
      div.addEventListener('click', (e) => {
        if (e.target.closest('.vi-delete')) return;
        const idx = SEGMENTS.findIndex(s => new RegExp('\\b' + word + '\\b', 'i').test(s.text));
        if (idx >= 0) {
          audio.currentTime = SEGMENTS[idx].start;
          if (audio.paused) audio.play();
          scrollToSeg(idx);
        }
      });
      vocabList.appendChild(div);
    });
  } else {
    // Favorite sentences tab
    notebookActions.classList.remove('show');
    const entries = loadSentenceFavorites()
      .map((index) => ({ index, ...SEGMENTS[index] }))
      .filter((item) => !query || item.text.toLowerCase().includes(query) || formatTime(item.start).includes(query));

    document.getElementById('vocabBadge').textContent = entries.length;
    updateSentenceCount();

    if (entries.length === 0) {
      vocabList.innerHTML = '<div style="padding:24px 16px;text-align:center;color:var(--text-dim);font-size:13px;">暂无难句<br><br>点击字幕右侧的「☆」收藏需要反复精听的句子</div>';
      return;
    }

    entries.forEach((item) => {
      const div = document.createElement('div');
      div.className = 'vocab-item sentence-card';
      div.innerHTML = `
        <button class="vi-delete" title="取消收藏">✕</button>
        <div class="sentence-time">${formatTime(item.start)}</div>
        <div class="sentence-text">${escapeHtml(item.text)}</div>
        <div class="sentence-actions">
          <button class="nb-action-btn sentence-play" type="button">播放</button>
          <button class="nb-action-btn sentence-loop" type="button">循环</button>
        </div>
      `;

      const playSentence = () => {
        audio.currentTime = item.start;
        audio.play();
        scrollToSeg(item.index);
        revealSegment(item.index);
      };

      div.querySelector('.vi-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSentenceFavorite(item.index);
      });
      div.querySelector('.sentence-play').addEventListener('click', (e) => {
        e.stopPropagation();
        playSentence();
      });
      div.querySelector('.sentence-loop').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLoop(item.index);
        scrollToSeg(item.index);
      });
      div.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        playSentence();
      });
      vocabList.appendChild(div);
    });
  }
  updateNotebookCount();
  updateSentenceCount();
}

// === Scroll active segment into view ===
function scrollToSeg(idx) {
  const el = subtitlePanel.children[idx];
  if (el && autoScrollCheck.checked) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// === Update active segment ===
function updateActiveSeg() {
  const t = audio.currentTime;
  let newIdx = -1;
  for (let i = 0; i < SEGMENTS.length; i++) {
    if (t >= SEGMENTS[i].start && t < SEGMENTS[i].end) {
      newIdx = i;
      break;
    }
    // Handle gap between segments
    if (i < SEGMENTS.length - 1 && t >= SEGMENTS[i].end && t < SEGMENTS[i+1].start) {
      newIdx = i;
      break;
    }
  }
  if (newIdx === currentSegIndex) return;

  // Remove previous active
  if (currentSegIndex >= 0 && subtitlePanel.children[currentSegIndex]) {
    subtitlePanel.children[currentSegIndex].classList.remove('active');
  }
  currentSegIndex = newIdx;
  if (currentSegIndex >= 0 && subtitlePanel.children[currentSegIndex]) {
    subtitlePanel.children[currentSegIndex].classList.add('active');
    scrollToSeg(currentSegIndex);
  }
}

function seekFromProgressClientX(clientX) {
  if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

  const rect = progressBar.getBoundingClientRect();
  const pct = clamp((clientX - rect.left) / rect.width, 0, 1);
  audio.currentTime = pct * audio.duration;
  progressFill.style.width = pct * 100 + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
  updateActiveSeg();
}

// === Loop check ===
function checkLoop() {
  if (loopSegIndex >= 0) {
    const seg = SEGMENTS[loopSegIndex];
    if (audio.currentTime >= seg.end) {
      audio.currentTime = seg.start;
    }
  }
}

// === Audio events ===
audio.addEventListener('timeupdate', () => {
  checkLoop();
  updateActiveSeg();

  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  progressFill.style.width = pct + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {

function normalizeAudioUrl(url) {
  if (!url) return '';
  return url.startsWith('//') ? `https:${url}` : url;
}

function getDictionaryAudio(entry) {
  const sources = (entry.phonetics || [])
    .map((phonetic) => normalizeAudioUrl(phonetic.audio || ''))
    .filter(Boolean);

  return sources.find((url) => /-us\.mp3|\/us\//i.test(url)) ||
    sources.find((url) => /\.mp3(\?|$)/i.test(url)) ||
    sources[0] ||
    '';
}

function getEnglishVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  return voices.find((voice) => /^en(-|_)?us/i.test(voice.lang)) ||
    voices.find((voice) => /^en/i.test(voice.lang)) ||
    null;
}

function getStaticPronunciationSources(word) {
  const safeWord = encodeURIComponent(word);
  return [
    `https://ssl.gstatic.com/dictionary/static/sounds/20200429/${safeWord}--_us_1.mp3`,
    `https://ssl.gstatic.com/dictionary/static/sounds/oxford/${safeWord}--_us_1.mp3`
  ];
}

function highlightVocab(text) {
  let result = escapeHtml(text);
  // Split into words and non-words, wrap each word in a clickable span
  result = result.replace(/([a-zA-Z'-]+)/g, (match) => {
    const lower = match.toLowerCase().replace(/^['-]+|['-]+$/g, '');
    const isVocab = VOCAB[lower];
    if (isVocab) {
      return `<span class="vocab-word word-clickable" data-word="${lower}">${match}</span>`;
    }
    return `<span class="word-clickable" data-word="${lower}">${match}</span>`;
  });
  return result;
}

// === Word Lookup Cache ===
const lookupCache = {};

// === Show word popup ===
const wordPopup = document.getElementById('wordPopup');

function positionPopup(targetEl) {
  const rect = targetEl.getBoundingClientRect();
  const pw = 320;
  let left = rect.left + rect.width / 2 - pw / 2;
  let top = rect.bottom + 8;

  // Keep within viewport
  if (left < 8) left = 8;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (top + 200 > window.innerHeight) top = rect.top - 8 - 200;
  if (top < 8) top = 8;

  wordPopup.style.left = left + 'px';
  wordPopup.style.top = top + 'px';
}

function showPopup(word, targetEl) {
  const lower = word.toLowerCase().replace(/^['-]+|['-]+$/g, '');
  if (!lower || lower.length < 2) return;

  popupWord.textContent = lower;
  popupPhonetic.textContent = '';
  popupMeaning.textContent = '';
  popupEnDef.innerHTML = '';
  popupSource.textContent = '';
  popupSpeak.dataset.audioSrc = '';

  positionPopup(targetEl);
  wordPopup.classList.add('show');

  // Reset add button
  if (isInNotebook(lower)) {
    popupAddBtn.textContent = '✅ 已加入';
    popupAddBtn.classList.add('added');
  } else {
    popupAddBtn.textContent = '⭐ 加入单词本';
    popupAddBtn.classList.remove('added');
  }

  // Check VOCAB first
  if (VOCAB[lower]) {
    const info = VOCAB[lower];
    popupPhonetic.textContent = info.phonetic || '';
    popupMeaning.textContent = info.meaning;
    popupSource.textContent = '📖 课文重点词汇';
    popupSource.className = 'popup-source is-vocab';
    fetchEnglishDef(lower, true);
    return;
  }

  // Check cache
  if (lookupCache[lower]) {
    renderLookupResult(lookupCache[lower]);
    return;
  }

  // Show loading
  popupMeaning.innerHTML = '<div class="popup-loading"><div class="mini-spinner"></div>正在查询...</div>';
  popupSource.textContent = '';

  // Fetch from Free Dictionary API + translation
  fetchWordInfo(lower);
}

async function fetchEnglishDef(word, isVocab) {
  try {
    const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data[0]) return;

    // If vocab word didn't have phonetic, fill from API
    if (isVocab && !popupPhonetic.textContent && data[0].phonetic) {
      popupPhonetic.textContent = data[0].phonetic;
    }

    const audioSrc = getDictionaryAudio(data[0]);
    if (audioSrc && popupWord.textContent === word) {
      popupSpeak.dataset.audioSrc = audioSrc;
    }

    // Add English definitions
    const meanings = data[0].meanings || [];
    let defHtml = '';
    for (const m of meanings.slice(0, 3)) {
      const pos = m.partOfSpeech;
      const defs = m.definitions.slice(0, 2);
      for (const d of defs) {
        defHtml += `<div><span class="def-pos">${pos}</span>${escapeHtml(d.definition)}</div>`;
      }
    }
    if (defHtml) popupEnDef.innerHTML = defHtml;
  } catch (e) { /* ignore */ }
}

async function fetchWordInfo(word) {
  const result = { word, phonetic: '', meaning: '', enDefs: [], audioSrc: '' };

  // Parallel: dictionary API + translation API
  const [dictResult, transResult] = await Promise.allSettled([
    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r => r.ok ? r.json() : null),
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${encodeURIComponent('en|zh')}`).then(r => r.ok ? r.json() : null)
  ]);

  // Parse dictionary
  if (dictResult.status === 'fulfilled' && dictResult.value && dictResult.value[0]) {
    const entry = dictResult.value[0];
    result.phonetic = entry.phonetic || '';
    result.audioSrc = getDictionaryAudio(entry);
    if (!result.phonetic && entry.phonetics) {
      const p = entry.phonetics.find(ph => ph.text);
      if (p) result.phonetic = p.text;
    }
    const meanings = entry.meanings || [];
    for (const m of meanings.slice(0, 3)) {
      const pos = m.partOfSpeech;
      for (const d of m.definitions.slice(0, 2)) {
        result.enDefs.push({ pos, def: d.definition });
      }
    }
  }

  // Parse translation
  if (transResult.status === 'fulfilled' && transResult.value) {
    const trans = transResult.value;
    if (trans.responseStatus === 200 && trans.responseData && trans.responseData.translatedText) {
      const t = trans.responseData.translatedText;
      // Only use if it actually looks like Chinese
      if (/[\u4e00-\u9fff]/.test(t)) {
        result.meaning = t;
      }
    }
  }

  lookupCache[word] = result;
  renderLookupResult(result);
}

function renderLookupResult(result) {
  popupPhonetic.textContent = result.phonetic || '';
  popupMeaning.textContent = result.meaning || '';
  popupSource.textContent = result.meaning ? '🌐 在线翻译' : '';
  popupSource.className = 'popup-source';
  popupSpeak.dataset.audioSrc = result.audioSrc || '';

  let defHtml = '';
  for (const d of (result.enDefs || [])) {
    defHtml += `<div><span class="def-pos">${d.pos}</span>${escapeHtml(d.def)}</div>`;
  }
  popupEnDef.innerHTML = defHtml;

  if (!result.meaning && !defHtml) {
    popupMeaning.textContent = '暂无释义';
  }
}

// === TTS pronunciation ===
function speakWithBrowserVoice(word) {
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return false;

  speechSynthesis.cancel();
  speechSynthesis.resume?.();

  const utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US';
  utt.rate = 0.85;
  utt.voice = getEnglishVoice();
  speechSynthesis.speak(utt);
  return true;
}

function playPronunciationAudio(source) {
  return new Promise((resolve, reject) => {
    let settled = false;
    let startedAt = 0;
    const finish = (handler) => {
      if (settled) return;
      settled = true;
      pronunciationAudio.removeEventListener('playing', onPlaying);
      pronunciationAudio.removeEventListener('canplay', onPlaying);
      pronunciationAudio.removeEventListener('error', onError);
      clearTimeout(timer);
      handler();
    };
    const onPlaying = () => {
      startedAt = pronunciationAudio.currentTime || 0;
      setTimeout(() => {
        if (settled) return;
        if (!pronunciationAudio.paused && pronunciationAudio.currentTime > startedAt) {
          finish(resolve);
        }
      }, 250);
    };
    const onError = () => finish(() => reject(new Error('pronunciation audio failed')));
    const timer = setTimeout(() => {
      pronunciationAudio.pause();
      finish(() => reject(new Error('pronunciation audio timed out')));
    }, 2200);

    pronunciationAudio.addEventListener('playing', onPlaying);
    pronunciationAudio.addEventListener('canplay', onPlaying);
    pronunciationAudio.addEventListener('error', onError);
    pronunciationAudio.pause();
    pronunciationAudio.currentTime = 0;
    pronunciationAudio.src = source;
    pronunciationAudio.play().catch(onError);
  });
}

async function playPronunciation(word) {
  const cleanWord = word.toLowerCase().replace(/^['-]+|['-]+$/g, '');
  if (!cleanWord) return;

  popupSpeak.disabled = true;
  window.speechSynthesis?.cancel();

  if (popupSpeak.dataset.audioSrc) {
    try {
      popupSpeak.disabled = false;
      await playPronunciationAudio(popupSpeak.dataset.audioSrc);
      return;
    } catch (e) {
      // Fall back to synthesized pronunciation.
    }
  }

  for (const source of getStaticPronunciationSources(cleanWord)) {
    try {
      popupSpeak.disabled = false;
      await playPronunciationAudio(source);
      return;
    } catch (e) {
      // Try the next pronunciation source.
    }
  }

  if (speakWithBrowserVoice(cleanWord)) {
    setTimeout(() => {
      popupSpeak.disabled = false;
    }, 800);
    return;
  }

  try {
    popupSpeak.disabled = false;
    await playPronunciationAudio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(cleanWord)}`);
  } catch (e) {
    popupSpeak.disabled = false;
  }
}

popupSpeak.addEventListener('click', (e) => {
  e.stopPropagation();
  const word = popupWord.textContent;
  if (!word) return;
  playPronunciation(word);
});

      <div class="seg-translation" hidden></div>
      <div class="seg-actions">
        <button class="seg-action seg-reveal" type="button" title="显示原文" aria-label="显示原文">显</button>
        <button class="seg-action seg-translate" type="button" title="翻译本句" aria-label="翻译本句">译</button>
        <button class="seg-action seg-favorite" type="button" title="收藏难句" aria-label="收藏难句">☆</button>
        <button class="seg-action seg-repeat" type="button" title="Repeat this sentence" aria-label="Repeat this sentence">🔁</button>

    div.addEventListener('click', (e) => {

    div.querySelector('.seg-reveal').addEventListener('click', (e) => {

    });

function setSegmentTranslationState(i, text, state = 'ready') {
  const el = subtitlePanel.children[i];
  if (!el) return;

  const translation = el.querySelector('.seg-translation');
  const button = el.querySelector('.seg-translate');
  if (!translation || !button) return;

  translation.hidden = false;
  translation.classList.toggle('is-loading', state === 'loading');
  translation.classList.toggle('is-error', state === 'error');
  translation.textContent = text;

  button.disabled = state === 'loading';
  button.textContent = state === 'loading' ? '...' : '译';
}

async function translateSegment(i) {
  const seg = SEGMENTS[i];
  if (!seg) return;

  const cacheKey = seg.text;
  if (sentenceTranslationCache[cacheKey]) {
    setSegmentTranslationState(i, sentenceTranslationCache[cacheKey]);
    return;
  }

  setSegmentTranslationState(i, '正在翻译...', 'loading');

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);

  try {
    const resp = await fetch(
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(seg.text)}&langpair=${encodeURIComponent('en|zh')}`,
      { signal: controller.signal }
    );
    if (!resp.ok) throw new Error('translation request failed');

    const data = await resp.json();
    if (data && data.responseStatus && data.responseStatus !== 200) {
      throw new Error(data.responseDetails || 'translation service rejected request');
    }
    const translatedText = data && data.responseData && data.responseData.translatedText;
    const translated = translatedText ? decodeHtmlEntities(translatedText.trim()) : '';
    if (!translated) throw new Error('empty translation');

    sentenceTranslationCache[cacheKey] = translated;
    setSegmentTranslationState(i, translated);
  } catch (e) {
    setSegmentTranslationState(i, '暂时无法翻译，请稍后重试。', 'error');
  } finally {
    clearTimeout(timeout);
  }
}

function toggleLoop(i) {
  if (loopSegIndex === i) {
    clearLoop();
  } else {
    loopSegIndex = i;
    loopIndicator.classList.add('active');
    document.querySelectorAll('.seg').forEach(s => s.style.outline = '');
    const el = subtitlePanel.children[i];
    if (el) el.style.outline = '1px solid var(--accent)';
    ensureSectionForSegment(i);
    audio.currentTime = SEGMENTS[i].start;
    if (audio.paused) audio.play();
  }
}

// === Notebook (localStorage) ===
const NB_KEY = 'english_learning_notebook';
const SENTENCE_KEY = 'english_learning_sentences';
function getSentenceStorageKey() {
  return `${SENTENCE_KEY}:${currentTrack.id}`;
}
function loadNotebook() {
  try { return JSON.parse(localStorage.getItem(NB_KEY)) || {}; } catch { return {}; }
}
function saveNotebook(nb) {
  localStorage.setItem(NB_KEY, JSON.stringify(nb));
  updateNotebookCount();
}
function addToNotebook(word, phonetic, meaning) {
  const nb = loadNotebook();
  if (!nb[word]) {
    nb[word] = { phonetic: phonetic || '', meaning: meaning || '', addedAt: Date.now() };
    saveNotebook(nb);
  }
}
function removeFromNotebook(word) {
  const nb = loadNotebook();
  delete nb[word];
  saveNotebook(nb);
}
function isInNotebook(word) {
  return !!loadNotebook()[word];
}
function updateNotebookCount() {
  const count = Object.keys(loadNotebook()).length;
  document.getElementById('notebookCount').textContent = count;
}

function loadSentenceFavorites() {
  try {
    const raw = localStorage.getItem(getSentenceStorageKey()) ||
      (currentTrack.id === 'jensen-caltech-2024' ? localStorage.getItem(SENTENCE_KEY) : null);
    return (JSON.parse(raw || '[]') || [])
      .map(Number)
      .filter((index) => Number.isInteger(index) && index >= 0 && index < SEGMENTS.length);
  } catch {
    return [];
  }
}

function saveSentenceFavorites(items) {
  const unique = [...new Set(items)].sort((a, b) => a - b);
  localStorage.setItem(getSentenceStorageKey(), JSON.stringify(unique));
  updateSentenceFavoriteButtons();
  updateSentenceCount();
}

function isSentenceFavorite(index) {
  return loadSentenceFavorites().includes(index);
}

function toggleSentenceFavorite(index) {
  const current = loadSentenceFavorites();
  const next = current.includes(index)
    ? current.filter((item) => item !== index)
    : [...current, index];
  saveSentenceFavorites(next);
  buildVocabList(vocabSearchInput.value);
}

function updateSentenceCount() {
  document.getElementById('sentenceCount').textContent = loadSentenceFavorites().length;
}

function updateSentenceFavoriteButtons() {
  const favorites = new Set(loadSentenceFavorites());
  document.querySelectorAll('.seg').forEach((segEl) => {
    const index = Number(segEl.dataset.index);
    const button = segEl.querySelector('.seg-favorite');
    if (!button) return;

    const saved = favorites.has(index);
    button.classList.toggle('is-active', saved);
    button.textContent = saved ? '★' : '☆';
    button.title = saved ? '取消收藏难句' : '收藏难句';
    button.setAttribute('aria-label', button.title);
  });
}

// === Build vocab sidebar ===
function matchesSidebarQuery(query, values) {
  return !query || values.some((value) => String(value || '').toLowerCase().includes(query));
}

function findWordSegmentIndex(word) {
  const wordPattern = new RegExp('\\b' + escapeRegExp(word) + '\\b', 'i');
  return SEGMENTS.findIndex((seg) => wordPattern.test(seg.text));
}

function playWordFromSidebar(word) {
  const idx = findWordSegmentIndex(word);
  if (idx < 0) return;

  audio.currentTime = SEGMENTS[idx].start;
  if (audio.paused) audio.play();
  scrollToSeg(idx);
}

function appendSidebarSection(title, entries, renderItem, emptyText) {
  const section = document.createElement('div');
  section.className = 'sidebar-section';
  section.innerHTML = `
    <div class="sidebar-section-title">
      <span>${title}</span>
      <span class="section-count">${entries.length}</span>
    </div>
  `;

  if (entries.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'sidebar-empty';
    empty.innerHTML = emptyText;
    section.appendChild(empty);
  } else {
    entries.forEach((entry) => section.appendChild(renderItem(entry)));
  }

  vocabList.appendChild(section);
}

function buildVocabList(filter = '') {
  vocabList.innerHTML = '';
  const query = filter.trim().toLowerCase();
  const notebook = loadNotebook();
  const favoriteSentences = loadSentenceFavorites();

  const courseEntries = Object.entries(VOCAB)
    .filter(([word, info]) => matchesSidebarQuery(query, [word, info.meaning, info.phonetic]))
    .sort((a, b) => a[0].localeCompare(b[0]));
  const notebookEntries = Object.entries(notebook)
    .filter(([word, info]) => matchesSidebarQuery(query, [word, info.meaning, info.phonetic]))
    .sort((a, b) => a[0].localeCompare(b[0]));
  const sentenceEntries = favoriteSentences
    .map((index) => ({ index, ...SEGMENTS[index] }))
    .filter((item) => matchesSidebarQuery(query, [item.text, formatTime(item.start)]));

  document.getElementById('vocabBadge').textContent =
    courseEntries.length + notebookEntries.length + sentenceEntries.length;
  document.getElementById('courseCount').textContent = Object.keys(VOCAB).length;
  document.getElementById('notebookCount').textContent = Object.keys(notebook).length;
  document.getElementById('sentenceCount').textContent = favoriteSentences.length;
  document.getElementById('vocabCount').textContent = Object.keys(VOCAB).length;

  appendSidebarSection(
    '课文词汇',
    courseEntries,
    ([word, info]) => {
      const div = document.createElement('div');
      div.className = 'vocab-item';
      div.innerHTML = `
        <div><span class="vi-word">${escapeHtml(word)}</span><span class="vi-phonetic">${escapeHtml(info.phonetic || '')}</span></div>
        <div class="vi-meaning">${escapeHtml(info.meaning || '')}</div>
      `;
      div.addEventListener('click', () => playWordFromSidebar(word));
      return div;
    },
    query ? '没有匹配的课文词汇' : '暂无课文词汇'
  );

  appendSidebarSection(
    '我的单词本',
    notebookEntries,
    ([word, info]) => {
      const div = document.createElement('div');
      div.className = 'vocab-item';
      div.innerHTML = `
        <button class="vi-delete" title="移除">✕</button>
        <div><span class="vi-word">${escapeHtml(word)}</span><span class="vi-phonetic">${escapeHtml(info.phonetic || '')}</span></div>
        <div class="vi-meaning">${escapeHtml(info.meaning || '')}</div>
      `;
      div.querySelector('.vi-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromNotebook(word);
        buildVocabList(vocabSearchInput.value);
      });
      div.addEventListener('click', (e) => {
        if (e.target.closest('.vi-delete')) return;
        playWordFromSidebar(word);
      });
      return div;
    },
    query ? '没有匹配的单词本内容' : '单词本为空<br><br>点击字幕中的单词，然后按「⭐ 加入单词本」即可收藏到这里'
  );

  appendSidebarSection(
    '难句收藏',
    sentenceEntries,
    (item) => {
      const div = document.createElement('div');
      div.className = 'vocab-item sentence-card';
      div.innerHTML = `
        <button class="vi-delete" title="取消收藏">✕</button>
        <div class="sentence-time">${formatTime(item.start)}</div>
        <div class="sentence-text">${escapeHtml(item.text)}</div>
        <div class="sentence-actions">
          <button class="nb-action-btn sentence-play" type="button">播放</button>
          <button class="nb-action-btn sentence-loop" type="button">循环</button>
        </div>
      `;

      const playSentence = () => {
        audio.currentTime = item.start;
        audio.play();
        scrollToSeg(item.index);
        revealSegment(item.index);
      };

      div.querySelector('.vi-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSentenceFavorite(item.index);
      });
      div.querySelector('.sentence-play').addEventListener('click', (e) => {
        e.stopPropagation();
        playSentence();
      });
      div.querySelector('.sentence-loop').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLoop(item.index);
        scrollToSeg(item.index);
      });
      div.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        playSentence();
      });
      return div;
    },
    query ? '没有匹配的难句' : '暂无难句<br><br>点击字幕右侧的「☆」收藏需要反复精听的句子'
  );
}

// === Popup "Add to notebook" button ===
const popupAddBtn = document.getElementById('popupAddBtn');
popupAddBtn.addEventListener('click', () => {
  const word = popupWord.textContent;
  if (!word) return;
  const phonetic = popupPhonetic.textContent || '';
  const meaning = popupMeaning.textContent || '';
  addToNotebook(word, phonetic, meaning);
  popupAddBtn.textContent = '✅ 已加入';
  popupAddBtn.classList.add('added');
  buildVocabList(vocabSearchInput.value);
});

// === Notebook export/import/clear ===
document.getElementById('nbExport').addEventListener('click', () => {
  const nb = loadNotebook();
  const blob = new Blob([JSON.stringify(nb, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'my-vocabulary-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('nbImport').addEventListener('click', () => {
  document.getElementById('nbImportFile').click();
});
document.getElementById('nbImportFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      const nb = loadNotebook();
      Object.assign(nb, imported);
      saveNotebook(nb);
      buildVocabList(vocabSearchInput.value);
    } catch { alert('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('nbClear').addEventListener('click', () => {
  if (confirm('确定清空单词本？此操作不可撤销。')) {
    saveNotebook({});
    buildVocabList(vocabSearchInput.value);
  }
});

// === Scroll active segment into view ===
function scrollToSeg(idx) {
  ensureSectionForSegment(idx);
  const el = subtitlePanel.children[idx];
  if (el && autoScrollCheck.checked) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// === Update active segment ===
function updateActiveSeg() {
  const t = audio.currentTime;
  syncSectionToTime(t);
  let newIdx = -1;
  for (let i = 0; i < SEGMENTS.length; i++) {
    if (t >= SEGMENTS[i].start && t < SEGMENTS[i].end) {
      newIdx = i;
      break;
    }
    // Handle gap between segments
    if (i < SEGMENTS.length - 1 && t >= SEGMENTS[i].end && t < SEGMENTS[i+1].start) {
      newIdx = i;
      break;
    }
  }
  if (newIdx === currentSegIndex) return;

  // Remove previous active
  if (currentSegIndex >= 0 && subtitlePanel.children[currentSegIndex]) {
    subtitlePanel.children[currentSegIndex].classList.remove('active');
  }
  currentSegIndex = newIdx;
  if (currentSegIndex >= 0 && subtitlePanel.children[currentSegIndex]) {
    subtitlePanel.children[currentSegIndex].classList.add('active');
    scrollToSeg(currentSegIndex);
  }
}

function seekFromProgressClientX(clientX) {
  if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

  const rect = progressBar.getBoundingClientRect();
  const pct = clamp((clientX - rect.left) / rect.width, 0, 1);
  audio.currentTime = pct * audio.duration;
  progressFill.style.width = pct * 100 + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
  updateActiveSeg();
}

// === Loop check ===
function checkLoop() {
  if (loopSegIndex >= 0) {
    const seg = SEGMENTS[loopSegIndex];
    if (audio.currentTime >= seg.end) {
      audio.currentTime = seg.start;
    }
  }
}

// === Audio events ===
audio.addEventListener('timeupdate', () => {
  checkLoop();
  checkEasySentenceEnd();
  updateActiveSeg();

  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  progressFill.style.width = pct + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
  document.getElementById('durationStat').textContent = formatTime(audio.duration);
  rebuildLessonSections(audio.duration);
  loading.classList.add('hidden');
});

audio.addEventListener('canplaythrough', () => {
  loading.classList.add('hidden');
});

audio.addEventListener('play', () => { playBtn.textContent = '⏸'; });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });

// === Controls ===
playBtn.addEventListener('click', () => {
  if (easySessionState.active) {
    if (audio.paused) playEasyFocus(); else audio.pause();
    return;
  }
  if (audio.paused) audio.play(); else audio.pause();
});

sessionStartBtn.addEventListener('click', () => {
  if (easySessionState.active) {
    if (audio.paused) playEasyFocus(); else audio.pause();
    return;
  }
  startEasySession();
});

easyListenBtn.addEventListener('click', playEasyFocus);
easyRevealBtn.addEventListener('click', revealEasyFocus);
easyTranslateBtn.addEventListener('click', () => {
  revealEasyFocus();
  translateSegment(easySessionState.focusIndex);
});
easyNextBtn.addEventListener('click', () => {
  moveEasyFocus();
  playEasyFocus();
});
easyCompleteBtn.addEventListener('click', () => completeEasySession());

boredBtn.addEventListener('click', openRescueDialog);
rescueCloseBtn.addEventListener('click', closeRescueDialog);
rescueDialog.addEventListener('click', (event) => {
  if (event.target === rescueDialog) closeRescueDialog();
});
document.querySelectorAll('[data-rescue]').forEach((button) => {
  button.addEventListener('click', () => {
    const action = button.dataset.rescue;
    if (action === 'finish') {
      closeRescueDialog();
      completeEasySession();
      return;
    }

    if (!easySessionState.active) startEasySession({ play: false });
    if (action === 'easier') {
      setPlaybackSpeed(0.75);
      revealEasyFocus();
      translateSegment(easySessionState.focusIndex);
    } else if (action === 'next') {
      moveEasyFocus();
    }

    closeRescueDialog();
    playEasyFocus();
  });
});

prevSection.addEventListener('click', () => {
  setCurrentSection(currentSectionIndex - 1, { seek: true });
});

nextSection.addEventListener('click', () => {
  setCurrentSection(currentSectionIndex + 1, { seek: true });
});

progressBar.addEventListener('click', (e) => {
  seekFromProgressClientX(e.clientX);
});

progressBar.addEventListener('pointerdown', (e) => {
  if (e.button !== undefined && e.button !== 0) return;

  isDraggingProgress = true;
  progressBar.classList.add('dragging');
  progressBar.setPointerCapture?.(e.pointerId);
  seekFromProgressClientX(e.clientX);
});

progressBar.addEventListener('pointermove', (e) => {
  if (!isDraggingProgress) return;

  e.preventDefault();
  seekFromProgressClientX(e.clientX);
});

function endProgressDrag(e) {
  if (!isDraggingProgress) return;

  isDraggingProgress = false;
  progressBar.classList.remove('dragging');
  progressBar.releasePointerCapture?.(e.pointerId);
  seekFromProgressClientX(e.clientX);
}

progressBar.addEventListener('pointerup', endProgressDrag);
progressBar.addEventListener('pointercancel', () => {
  isDraggingProgress = false;
  progressBar.classList.remove('dragging');
});

document.getElementById('backBtn').addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 5);
});
document.getElementById('fwdBtn').addEventListener('click', () => {
  audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (easySessionState.active) {
    setEasyFocus(findEasyFocusIndex(easySessionState.focusIndex, -1));
    playEasyFocus();
    return;
  }
  if (currentSegIndex > 0) {
    audio.currentTime = SEGMENTS[currentSegIndex - 1].start;
  }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (easySessionState.active) {
    moveEasyFocus();
    playEasyFocus();
    return;
  }
  if (currentSegIndex < SEGMENTS.length - 1) {
    audio.currentTime = SEGMENTS[currentSegIndex + 1].start;
  }
});

// Speed buttons
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    setPlaybackSpeed(parseFloat(btn.dataset.speed));
  });
});

// Volume
volumeSlider.addEventListener('input', () => {
  audio.volume = volumeSlider.value / 100;
  volumeBtn.textContent = audio.volume === 0 ? '🔇' : audio.volume < 0.5 ? '🔉' : '🔊';
});
audio.volume = 0.8;

volumeBtn.addEventListener('click', () => {
  if (audio.volume > 0) {
    audio.volume = 0;
    volumeSlider.value = 0;
    volumeBtn.textContent = '🔇';
  } else {
    audio.volume = 0.8;
    volumeSlider.value = 80;
    volumeBtn.textContent = '🔊';
  }
});

// Vocab search
vocabSearchInput.addEventListener('input', () => {
  buildVocabList(vocabSearchInput.value);
});

dictationModeCheck.addEventListener('change', () => {
  applyDictationMode();
});

// Mobile vocab toggle
document.getElementById('vocabToggle').addEventListener('click', () => {
  document.getElementById('vocabSidebar').classList.toggle('show');
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && !rescueDialog.hidden) {
    closeRescueDialog();
    return;
  }
  switch (e.key) {
    case ' ':
      e.preventDefault();
      if (easySessionState.active) {
        if (audio.paused) playEasyFocus(); else audio.pause();
      } else if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
      break;
    case 'ArrowLeft':
      audio.currentTime = Math.max(0, audio.currentTime - 5);
      break;
    case 'ArrowRight':
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      break;
    case 'ArrowUp':
      if (currentSegIndex > 0) audio.currentTime = SEGMENTS[currentSegIndex - 1].start;
      break;
    case 'ArrowDown':
      if (currentSegIndex < SEGMENTS.length - 1) audio.currentTime = SEGMENTS[currentSegIndex + 1].start;
      break;
    case 'r':
    case 'R':
      if (currentSegIndex >= 0) toggleLoop(currentSegIndex);
      break;
    case 't':
    case 'T':
      if (currentSegIndex >= 0) translateSegment(currentSegIndex);
      break;
    case 's':
    case 'S':
      if (currentSegIndex >= 0) toggleSentenceFavorite(currentSegIndex);
      break;
    case 'v':
    case 'V':
      if (currentSegIndex >= 0) revealSegment(currentSegIndex);
      break;
  }
});

// === Init ===
dictationModeCheck.checked = localStorage.getItem('english_learning_dictation_mode') === '1';
updateTrackHeader();
renderTrackTabs();
audio.src = currentTrack.audio;
rebuildLessonSections();
buildSubtitles();
applyDictationMode();
buildVocabList();
updateSentenceCount();
updateSessionStartButton();

// Fallback hide loading
setTimeout(() => loading.classList.add('hidden'), 3000);
</script>
